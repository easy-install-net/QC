<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>築匠設計 ARTISAN STUDIO — 工程記錄查閱</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="report.css" />
  <style>
    .future-tag-pill {
      display: inline-block;
      background: rgba(234, 88, 12, 0.12);
      color: #C2410C;
      border: none;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.35;
      vertical-align: middle;
    }
    .future-diary-box {
      background: #FFFFFF;
      border-left: 3px solid #EA580C;
      margin-top: 8px;
      overflow: hidden;
    }
    .future-diary-head {
      background: #FFFBEB;
      border-bottom: 1px solid #FDE68A;
      padding: 5px 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .future-diary-body {
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .detail-toggle-btn {
      background: transparent;
      color: #64748B;
      border: none;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .detail-toggle-btn:hover {
      color: #0F172A;
      background: rgba(15, 23, 42, 0.06);
    }
    .detail-toggle-btn.is-open {
      background: rgba(234, 88, 12, 0.12);
      color: #C2410C;
    }
    .schedule-detail-panel {
      margin-top: 5px;
      padding: 6px 9px;
      background: #F8FAFC;
      border-left: 2px solid #CBD5E1;
      border-radius: 2px;
      font-size: 12.5px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
  </style>
</head>
<body>

  <header class="topbar no-print">
    <div class="container row-between" style="padding-bottom:0;">
      <div class="row">
        <span class="t-site" style="color:#FFFFFF;">築匠設計 ARTISAN STUDIO</span>
      </div>
      <div class="row">
        <button type="button" onclick="window.print()" id="printBtn" class="btn-secondary">列印 / PDF</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="viewContainer">
      <div style="background:#FFF;padding:16px;margin-top:8px;text-align:center;" class="muted">載入中...</div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCSRfZdAVh8ADPNtayW5lyDtmE0xDsJXNg",
      authDomain: "gen-lang-client-0208380044.firebaseapp.com",
      databaseURL: "https://gen-lang-client-0208380044-default-rtdb.firebaseio.com",
      projectId: "gen-lang-client-0208380044",
      storageBucket: "gen-lang-client-0208380044.firebasestorage.app",
      messagingSenderId: "17077391191",
      appId: "1:17077391191:web:cb936dd1bfe98b2f3d7812"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    try {
      if (firebase.firestore.persistentLocalCache && firebase.firestore.persistentMultipleTabManager) {
        db.settings({
          localCache: firebase.firestore.persistentLocalCache({
            tabManager: firebase.firestore.persistentMultipleTabManager()
          })
        });
      } else {
        db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
      }
    } catch (_) {
      db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    }

    const COLLECTION_NAME = 'artisan_qc_reports';
    const PHOTOS_COL = 'artisan_qc_photos';
    const ALBUMS_COL = 'artisan_qc_albums';
    const WEEKDAYS_HK = ['日', '一', '二', '三', '四', '五', '六'];

    const urlParams = new URLSearchParams(window.location.search);
    const SINGLE_REPORT_ID = urlParams.get('reportId') || '';
    const SINGLE_SITE = urlParams.get('site') || '';
    const VIEW_MODE = urlParams.get('view') || '';
    const TAB_MODE = urlParams.get('tab') || 'reports';
    const ONLY_UPCOMING = urlParams.get('upcoming') === '1';
    const RANGE_START = urlParams.get('start') || '';
    const RANGE_END = urlParams.get('end') || '';
    const IS_BOSS_BRIEF = VIEW_MODE === 'brief';

    let reports = [];
    let expandedSites = new Set();
    let expandedDetailIds = new Set();

    function escapeHtml(s) {
      return !s ? '' : String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatMonthDayWeekday(dateStr) {
      if (!dateStr || dateStr === '未定日期') return dateStr || '未定日期';
      const m = String(dateStr).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (!m) return String(dateStr);
      const yr = parseInt(m[1], 10);
      const mo = parseInt(m[2], 10);
      const dy = parseInt(m[3], 10);
      const dt = new Date(yr, mo - 1, dy);
      const wd = WEEKDAYS_HK[dt.getDay()] || '';
      return `${mo}月${dy}日(${wd})`;
    }

    function isFutureDiaryEntry(r) {
      return Boolean(r?.isFutureDiary || r?.isUpcoming);
    }

    function getDocsList(r) {
      if (Array.isArray(r.docs) && r.docs.length > 0) return r.docs;
      if (r.docName) return [{ name: r.docName, url: r.docUrl || '' }];
      return [];
    }

    function getReportThumbs(r) {
      if (Array.isArray(r.photoMeta) && r.photoMeta.length > 0) {
        return r.photoMeta.map(m => ({ id: m.id, src: m.thumb, note: m.note || '' }));
      }
      if (Array.isArray(r.photos) && r.photos.length > 0) {
        return r.photos.map(p => ({ id: p.id, src: p.base64Annotated || p.base64Raw, note: p.note || '' }));
      }
      return [];
    }

    async function fetchFullPhotosForReport(r) {
      if (Array.isArray(r.photoMeta) && r.photoMeta.length > 0) {
        const docs = await Promise.all(r.photoMeta.map(m => db.collection(PHOTOS_COL).doc(m.id).get().catch(() => null)));
        return r.photoMeta.map((m, idx) => {
          const d = docs[idx] && docs[idx].exists ? docs[idx].data() : null;
          return {
            id: m.id,
            base64Raw: d ? (d.base64Raw || '') : '',
            base64Annotated: d ? (d.base64Annotated || d.base64Raw || m.thumb) : m.thumb,
            note: d ? (d.note ?? m.note ?? '') : (m.note || '')
          };
        });
      }
      return Array.isArray(r.photos) ? r.photos : [];
    }

    function getSingleReportViewUrl(id) {
      const u = new URL('view.html', window.location.href);
      u.search = `?reportId=${encodeURIComponent(id)}`;
      return u.toString();
    }

    function renderFollowupBlock(r) {
      const logs = Array.isArray(r.followupLogs) ? r.followupLogs : [];
      const hasFollowupText = Boolean(r.followup && r.followup.trim());
      if (!hasFollowupText && logs.length === 0) return '';

      return `<div class="fu-area">
        ${hasFollowupText ? `<div><b>跟進：</b>${escapeHtml(r.followup)}</div>` : ''}
        ${logs.map(l => `<div class="fu-log"><span><b>${escapeHtml(l.author)}</b> ${escapeHtml(l.message)}</span><span class="muted t-mono">${escapeHtml(l.createdAtStr || '')}</span></div>`).join('')}
      </div>`;
    }

    function getScheduleDayGroups(list) {
      const normalEntries = list.filter(r => !isFutureDiaryEntry(r));
      const dayMap = {};
      normalEntries.forEach(r => {
        const dKey = r.date || '未定日期';
        if (RANGE_START && dKey !== '未定日期' && dKey < RANGE_START) return;
        if (RANGE_END && dKey !== '未定日期' && dKey > RANGE_END) return;
        if (!dayMap[dKey]) dayMap[dKey] = [];
        dayMap[dKey].push(r);
      });

      return Object.keys(dayMap)
        .sort((a, b) => {
          if (a === '未定日期') return 1;
          if (b === '未定日期') return -1;
          return b.localeCompare(a);
        })
        .map(dKey => ({
          date: dKey,
          items: dayMap[dKey].sort((a, b) => (a.timeRange || '').localeCompare(b.timeRange || '') || (a.createdAt || 0) - (b.createdAt || 0))
        }));
    }

    function toggleExpandSite(s) {
      expandedSites.has(s) ? expandedSites.delete(s) : expandedSites.add(s);
      renderPublicReportsList();
    }

    function toggleScheduleDetail(id) {
      if (!id) return;
      expandedDetailIds.has(id) ? expandedDetailIds.delete(id) : expandedDetailIds.add(id);
      renderPublicScheduleView();
    }

    async function renderSingleReportStandalone(r) {
      document.title = `${r.site || ''} — ${r.title || '工程報告'}`;
      const docs = getDocsList(r);
      const container = document.getElementById('viewContainer');

      container.innerHTML = `
        <div class="site-card">
          <div class="site-header row-between">
            <div class="row">
              <span class="t-site">${escapeHtml(r.site)}</span>
              ${r.assignee ? `<span class="muted t-meta">${escapeHtml(r.assignee)}</span>` : ''}
            </div>
            <div class="row">
              <span class="t-mono" style="font-weight:700;">${escapeHtml(formatMonthDayWeekday(r.date))} ${escapeHtml(r.timeRange || '')}</span>
            </div>
          </div>
          <div class="site-body">
            <div class="entry-title">${escapeHtml(r.title)}</div>
            ${r.summary ? `<div class="entry-summary">${escapeHtml(r.summary)}</div>` : ''}

            ${docs.filter(d => !d.url || !d.url.includes('albumId=')).length ? `
              <div class="docs-strip">
                ${docs.filter(d => !d.url || !d.url.includes('albumId=')).map(d => d.url
                  ? `<div class="doc-item-row"><a href="${escapeHtml(d.url)}" target="_blank" rel="noopener noreferrer" class="btn-link blue">📄 ${escapeHtml(d.name)} <span class="btn-sym">↗</span></a></div>`
                  : `<div class="doc-item-row"><span class="t-meta">📄 ${escapeHtml(d.name)}</span></div>`
                ).join('')}
              </div>
            ` : ''}

            ${renderFollowupBlock(r)}
            <div id="standalonePhotosWrap"></div>
            <div id="embeddedAlbumsWrap"></div>
          </div>
        </div>`;

      const fullPhotos = await fetchFullPhotosForReport(r);
      const pWrap = document.getElementById('standalonePhotosWrap');
      if (pWrap && fullPhotos.length) {
        pWrap.innerHTML = fullPhotos.map((p, i) => `
          <div class="standalone-photo">
            <img src="${p.base64Annotated || p.base64Raw}" />
            ${p.note ? `<div style="padding:6px 10px;" class="t-meta"><b>#${i + 1}</b> ${escapeHtml(p.note)}</div>` : ''}
          </div>`).join('');
      }

      const albumDocs = docs.filter(d => d.url && d.url.includes('albumId='));
      const embedWrap = document.getElementById('embeddedAlbumsWrap');
      for (const ad of albumDocs) {
        const m = ad.url.match(/albumId=([^&]+)/);
        if (!m) continue;
        const albumId = m[1];
        try {
          let pages = [];
          const albDoc = await db.collection(ALBUMS_COL).doc(albumId).get();
          if (albDoc.exists) {
            const pSnap = await db.collection(ALBUMS_COL).doc(albumId).collection('pages').orderBy('order', 'asc').get();
            pages = pSnap.docs.map(x => x.data());
          }
          if (pages.length && embedWrap) {
            const sec = document.createElement('div');
            sec.style.marginTop = '12px';
            sec.innerHTML = `
              <div style="font-weight:700;padding-bottom:4px;border-bottom:2px solid #EA580C;margin-bottom:6px;">${escapeHtml(ad.name)}</div>
              ${pages.map((p, idx) => `
                <div class="standalone-photo">
                  <img loading="lazy" src="${p.rendered || p.raw}" />
                  ${p.note ? `<div style="padding:6px 10px;" class="t-meta"><b>#${idx + 1}</b> ${escapeHtml(p.note)}</div>` : ''}
                </div>
              `).join('')}`;
            embedWrap.appendChild(sec);
          }
        } catch (e) { console.warn(e); }
      }
    }

    function renderBossBriefCleanView() {
      document.title = '築匠設計 ARTISAN STUDIO — 行程交代';
      document.getElementById('printBtn')?.classList.add('hidden');
      const container = document.getElementById('viewContainer');
      const valid = reports.filter(r => r.site || r.title);
      const dayGroups = getScheduleDayGroups(valid);

      if (!dayGroups.length) {
        container.innerHTML = `<div style="background:#FFF;padding:16px;margin-top:8px;text-align:center;" class="muted">暫無紀錄</div>`;
        return;
      }

      container.innerHTML = dayGroups.map(g => {
        const dayLabel = formatMonthDayWeekday(g.date);
        const rowsHtml = g.items.map(r => {
          const t = (r.timeRange || '').trim() || '全日';
          const sName = r.site || '未分類';
          const docs = getDocsList(r).filter(d => d.name || d.url);
          const thumbs = getReportThumbs(r);
          const latestLog = Array.isArray(r.followupLogs) && r.followupLogs.length ? r.followupLogs[r.followupLogs.length - 1] : null;
          const fuText = [r.followup, latestLog ? `${latestLog.author}：${latestLog.message}` : ''].filter(Boolean).join('｜');

          const docsHtml = docs.length ? `<div class="docs-strip" style="margin-top:4px;">
            ${docs.map(d => d.url
              ? `<div class="doc-item-row"><a href="${escapeHtml(d.url)}" target="_blank" rel="noopener noreferrer" class="btn-link blue">📄 ${escapeHtml(d.name || '附件')} <span class="btn-sym">↗</span></a></div>`
              : `<div class="doc-item-row"><span class="t-meta">📄 ${escapeHtml(d.name || '附件')}</span></div>`
            ).join('')}
          </div>` : '';

          const thumbsHtml = thumbs.length ? `<div class="thumbs">${thumbs.map(th =>
            `<a href="${escapeHtml(getSingleReportViewUrl(r.id))}" class="thumb-box" style="width:60px;height:60px;"><img loading="lazy" decoding="async" src="${th.src}" alt="${escapeHtml(th.note || '')}" /></a>`
          ).join('')}</div>` : '';

          return `<div class="brief-row">
            <div class="brief-meta">
              <span class="t-mono" style="font-weight:700;color:#EA580C;">${escapeHtml(t)}</span>
              <span style="font-weight:700;color:#0F172A;">${escapeHtml(sName)}</span>
              ${r.assignee ? `<span class="t-meta muted">${escapeHtml(r.assignee)}</span>` : ''}
            </div>
            <div class="entry-title">${escapeHtml(r.title || '')}</div>
            ${r.summary ? `<div class="brief-detail">${escapeHtml(r.summary)}</div>` : ''}
            ${fuText ? `<div class="brief-fu"><b>跟進：</b>${escapeHtml(fuText)}</div>` : ''}
            ${docsHtml}${thumbsHtml}
          </div>`;
        }).join('');

        return `<div class="schedule-day-card">
          <div class="schedule-day-head">
            <span class="t-site t-mono" style="font-size:13px;">${escapeHtml(dayLabel)}</span>
          </div>
          <div class="schedule-day-body">${rowsHtml}</div>
        </div>`;
      }).join('');
    }

    function getFilteredPublicReports() {
      return reports.filter(r => {
        if (!r.site && !r.title) return false;
        if (ONLY_UPCOMING && !isFutureDiaryEntry(r)) return false;
        if (!ONLY_UPCOMING && SINGLE_SITE && r.site !== SINGLE_SITE) return false;
        return true;
      });
    }

    function renderPublicScheduleDetail(r) {
      const docs = getDocsList(r).filter(d => d.name || d.url);
      const thumbs = getReportThumbs(r);
      const logs = Array.isArray(r.followupLogs) ? r.followupLogs : [];
      const hasFu = Boolean((r.followup && r.followup.trim()) || logs.length);
      const singleUrl = getSingleReportViewUrl(r.id);

      return `<div class="schedule-detail-panel">
        ${r.summary ? `<div><b>內容：</b>${escapeHtml(r.summary)}</div>` : `<div class="muted">無內容</div>`}
        ${hasFu ? renderFollowupBlock(r) : ''}
        ${docs.length ? `<div class="docs-strip" style="margin-top:2px;">
          ${docs.map(d => d.url
            ? `<div class="doc-item-row"><a href="${escapeHtml(d.url)}" target="_blank" rel="noopener noreferrer" class="btn-link blue">📄 ${escapeHtml(d.name || '附件')} <span class="btn-sym">↗</span></a></div>`
            : `<div class="doc-item-row"><span class="t-meta">📄 ${escapeHtml(d.name || '附件')}</span></div>`
          ).join('')}
        </div>` : ''}
        ${thumbs.length ? `<div class="thumbs" style="margin-top:2px;">${thumbs.map(t =>
          `<a href="${escapeHtml(singleUrl)}" class="thumb-box" style="width:54px;height:54px;"><img loading="lazy" decoding="async" src="${t.src}" /></a>`
        ).join('')}</div>` : ''}
      </div>`;
    }

    function renderPublicScheduleView() {
      document.title = SINGLE_SITE ? `${SINGLE_SITE} — 時間表` : '築匠設計 ARTISAN STUDIO — 時間表';
      const container = document.getElementById('viewContainer');
      const filtered = getFilteredPublicReports();
      const dayGroups = getScheduleDayGroups(filtered);
      const futureItems = filtered
        .filter(r => isFutureDiaryEntry(r))
        .sort((a, b) => (a.date || '9999-99-99').localeCompare(b.date || '9999-99-99') || (a.timeRange || '').localeCompare(b.timeRange || ''));

      if (!dayGroups.length && !futureItems.length) {
        container.innerHTML = `<div style="background:#FFF;padding:16px;margin-top:8px;text-align:center;" class="muted">暫無紀錄</div>`;
        return;
      }

      const futureHtml = futureItems.length ? `<div class="future-diary-box">
        <div class="future-diary-head">
          <div class="row">
            <span class="future-tag-pill">即將</span>
            <span class="t-site" style="font-size:13px;">${futureItems.length} 項</span>
          </div>
        </div>
        <div class="future-diary-body">
          ${futureItems.map(r => {
            const dStr = formatMonthDayWeekday(r.date || '未定日期');
            const tStr = (r.timeRange || '').trim() || '全日';
            const isDetailOpen = expandedDetailIds.has(r.id);
            return `<div class="schedule-slot-row">
              <div class="schedule-time-col" style="flex-direction:column;">
                <span class="t-mono schedule-time-tag">${escapeHtml(dStr)}</span>
                <span class="t-meta t-mono muted">${escapeHtml(tStr)}</span>
              </div>
              <div class="schedule-slot-main">
                <div class="schedule-slot-top">
                  <span style="font-size:13px;font-weight:700;color:#0F172A;">${escapeHtml(r.site || '未分類')}</span>
                  ${r.assignee ? `<span class="t-meta muted">${escapeHtml(r.assignee)}</span>` : ''}
                  <button type="button" onclick="toggleScheduleDetail('${r.id}')" class="detail-toggle-btn no-print ${isDetailOpen ? 'is-open' : ''}">${isDetailOpen ? '收起詳細 ▴' : '詳細 ▾'}</button>
                </div>
                ${r.title ? `<div class="schedule-topic">${escapeHtml(r.title)}</div>` : ''}
                ${isDetailOpen ? renderPublicScheduleDetail(r) : ''}
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>` : '';

      const daysHtml = dayGroups.map(g => {
        const dayLabel = formatMonthDayWeekday(g.date);
        const slotHtml = g.items.map(r => {
          const timeLabel = (r.timeRange || '').trim() || '全日';
          const isDetailOpen = expandedDetailIds.has(r.id);
          return `<div class="schedule-slot-row">
            <div class="schedule-time-col">
              <span class="t-mono schedule-time-tag">${escapeHtml(timeLabel)}</span>
            </div>
            <div class="schedule-slot-main">
              <div class="schedule-slot-top">
                <span style="font-size:13px;font-weight:700;color:#0F172A;">${escapeHtml(r.site || '未分類')}</span>
                ${r.assignee ? `<span class="t-meta muted">${escapeHtml(r.assignee)}</span>` : ''}
                <button type="button" onclick="toggleScheduleDetail('${r.id}')" class="detail-toggle-btn no-print ${isDetailOpen ? 'is-open' : ''}">${isDetailOpen ? '收起詳細 ▴' : '詳細 ▾'}</button>
              </div>
              ${r.title ? `<div class="schedule-topic">${escapeHtml(r.title)}</div>` : ''}
              ${isDetailOpen ? renderPublicScheduleDetail(r) : ''}
            </div>
          </div>`;
        }).join('');

        return `<div class="schedule-day-card">
          <div class="schedule-day-head">
            <span class="t-site t-mono" style="font-size:13px;">${escapeHtml(dayLabel)}</span>
          </div>
          <div class="schedule-day-body">${slotHtml}</div>
        </div>`;
      }).join('');

      container.innerHTML = futureHtml + daysHtml;
    }

    function renderPublicReportsList() {
      if (SINGLE_SITE) document.title = `${SINGLE_SITE} — 工程記錄`;
      const container = document.getElementById('viewContainer');
      const filtered = getFilteredPublicReports();

      if (!filtered.length) {
        container.innerHTML = `<div style="background:#FFF;padding:16px;margin-top:8px;text-align:center;" class="muted">暫無紀錄</div>`;
        return;
      }

      const groups = [], map = {};
      filtered.forEach(r => {
        const k = r.site || '未分類';
        if (!map[k]) { map[k] = { site: k, assignee: r.assignee || '', items: [] }; groups.push(map[k]); }
        map[k].items.push(r);
      });
      groups.forEach(g => g.items.sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0)));

      container.innerHTML = groups.map(g => {
        const encSite = encodeURIComponent(g.site);
        const isExp = SINGLE_SITE ? true : expandedSites.has(g.site);
        const vis = isExp ? g.items : g.items.slice(0, 3);

        const rowsHtml = vis.map(r => {
          const thumbs = getReportThumbs(r);
          const docs = getDocsList(r);
          const singleUrl = getSingleReportViewUrl(r.id);
          const isFuture = isFutureDiaryEntry(r);

          const docsHtml = docs.length ? `<div class="docs-strip">
            ${docs.map(d => `<div class="doc-item-row">
              ${d.url
                ? `<a href="${escapeHtml(d.url)}" target="_blank" rel="noopener noreferrer" class="btn-link blue" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;" title="${escapeHtml(d.name)}">📄 ${escapeHtml(d.name)} <span class="btn-sym">↗</span></a>`
                : `<span class="t-meta" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;">📄 ${escapeHtml(d.name)}</span>`}
            </div>`).join('')}
          </div>` : '';

          const thumbsHtml = thumbs.length ? `<div class="thumbs">${thumbs.map(t => `<a href="${escapeHtml(singleUrl)}" class="thumb-box"><img loading="lazy" decoding="async" src="${t.src}" /></a>`).join('')}</div>` : '';

          return `<div class="entry-row">
            <div class="entry-meta-bar">
              <div class="entry-date-group">
                <span class="t-mono" style="font-weight:700;">${escapeHtml(formatMonthDayWeekday(r.date))}</span>
                ${r.timeRange ? `<span class="t-meta t-mono muted">${escapeHtml(r.timeRange)}</span>` : ''}
                ${isFuture ? `<span class="future-tag-pill">即將</span>` : ''}
              </div>
            </div>
            <div class="entry-content-block">
              <div class="entry-title">${escapeHtml(r.title)}</div>
              ${r.summary ? `<div class="entry-summary">${escapeHtml(r.summary)}</div>` : ''}
              ${thumbsHtml}
              ${docsHtml}
              ${renderFollowupBlock(r)}
            </div>
          </div>`;
        }).join('');

        return `<div class="site-card">
          <div class="site-header row-between">
            <div class="row" style="gap:4px;">
              <span class="t-site" style="font-size:13.5px;">${escapeHtml(g.site)}</span>
              ${g.assignee ? `<span class="muted t-meta">${escapeHtml(g.assignee)}</span>` : ''}
            </div>
          </div>
          <div class="site-body">
            ${rowsHtml}
            ${(!SINGLE_SITE && g.items.length > 3) ? `<div class="no-print" style="text-align:center;margin-top:6px;padding-top:5px;border-top:1px solid #E2E8F0;"><button type="button" onclick="toggleExpandSite(decodeURIComponent('${encSite}'))" class="btn-link muted">${isExp ? '收起 ▴' : `展開其餘 ${g.items.length - 3} 條 ▾`}</button></div>` : ''}
          </div>
        </div>`;
      }).join('');
    }

    function bootPublicView() {
      if (IS_BOSS_BRIEF) {
        db.collection(COLLECTION_NAME).orderBy('createdAt', 'desc').onSnapshot(snap => {
          reports = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderBossBriefCleanView();
        });
        return;
      }

      if (SINGLE_REPORT_ID) {
        db.collection(COLLECTION_NAME).doc(SINGLE_REPORT_ID).onSnapshot(doc => {
          if (!doc.exists) {
            document.getElementById('viewContainer').innerHTML = `<div style="background:#FFF;padding:16px;margin-top:8px;text-align:center;" class="muted">找不到此記錄</div>`;
            return;
          }
          renderSingleReportStandalone({ id: doc.id, ...doc.data() });
        });
        return;
      }

      if (SINGLE_SITE && TAB_MODE !== 'schedule') {
        db.collection(COLLECTION_NAME).where('site', '==', SINGLE_SITE).onSnapshot(snap => {
          reports = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderPublicReportsList();
        });
        return;
      }

      db.collection(COLLECTION_NAME).orderBy('createdAt', 'desc').onSnapshot(snap => {
        reports = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (TAB_MODE === 'schedule') renderPublicScheduleView();
        else renderPublicReportsList();
      });
    }

    bootPublicView();
  </script>
</body>
</html>
