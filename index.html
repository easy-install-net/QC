<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>築匠設計 ARTISAN STUDIO — QC 報告</title>
  <link rel="icon" href="data:," />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
      background: #F1F5F9; color: #0F172A; font-size: 14px; line-height: 1.5; margin: 0;
    }
    a { color: inherit; }
    .container { max-width: 960px; margin: 0 auto; padding: 0 12px 36px; }
    .topbar { background: #FFF; border-bottom: 1px solid #E2E8F0; position: sticky; top: 0; z-index: 30; padding: 8px 0; }
    .row-between { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .t-site { font-size: 16px; font-weight: 700; line-height: 1.35; }
    .t-meta { font-size: 12px; line-height: 1.4; }
    .t-mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { color: #64748B; }

    .btn-primary { background: #0F172A; color: #FFF; border: 1px solid #0F172A; border-radius: 6px; font-size: 12px; font-weight: 500; padding: 5px 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
    .btn-primary:hover { background: #334155; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-wa { background: #059669; color: #FFF; border: 1px solid #059669; border-radius: 6px; font-size: 12px; font-weight: 500; padding: 5px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .btn-wa:hover { background: #047857; }
    .btn-secondary { background: #FFF; color: #334155; border: 1px solid #CBD5E1; border-radius: 6px; font-size: 12px; font-weight: 500; padding: 5px 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
    .btn-secondary:hover { background: #F8FAFC; color: #0F172A; }
    .btn-edit-tag { background: #FFF7ED; color: #9A3412; border: 1px solid #FDBA74; border-radius: 4px; font-size: 11px; font-weight: 600; padding: 1px 6px; text-decoration: none; flex-shrink: 0; white-space: nowrap; }
    .btn-edit-tag:hover { background: #FFEDD5; color: #7C2D12; }
    .btn-danger-outline { background: #FFF; color: #DC2626; border: 1px solid #FECACA; border-radius: 6px; font-size: 12px; font-weight: 500; padding: 5px 8px; cursor: pointer; }
    .btn-active { background: #0F172A !important; color: #FFF !important; border-color: #0F172A !important; }
    .btn-link { background: none; border: none; padding: 2px 3px; font-size: 12px; font-weight: 500; color: #334155; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .btn-link:hover { color: #0F172A; }
    .btn-link.blue { color: #1D4ED8; }
    .btn-link.danger:hover { color: #DC2626; }

    .input-ui { border: 1px solid #FDBA74; border-radius: 6px; padding: 6px 10px; font-size: 14px; background: #FFF7ED; color: #0F172A; width: 100%; font-family: inherit; }
    .input-ui:focus { outline: none; border-color: #0F172A; background: #FFEDD5; }
    .select-ui { border: 1px solid #CBD5E1; border-radius: 6px; padding: 6px 8px; font-size: 12px; background: #FFF; color: #0F172A; }

    .filter-bar { background: #FFF; border: 1px solid #E2E8F0; border-radius: 8px; padding: 8px; margin: 12px 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-bar .search-wrap { flex: 1 1 220px; }
    .site-card { background: #FFF; border: 1px solid #CBD5E1; border-left: 4px solid #0F172A; border-radius: 8px; margin: 14px 0; overflow: hidden; }
    .site-header { background: #F8FAFC; border-bottom: 1px solid #E2E8F0; padding: 10px 16px; }
    .site-body { padding: 16px; }

    .entry-row { display: flex; gap: 14px; }
    .entry-row + .entry-row { margin-top: 14px; padding-top: 14px; border-top: 1px solid #E2E8F0; }
    .step-left { width: 112px; flex-shrink: 0; padding-top: 2px; }
    .step-right { flex: 1; min-width: 0; border-left: 1px solid #E2E8F0; padding-left: 14px; }
    .entry-main { display: flex; gap: 12px; justify-content: space-between; margin-top: 4px; }
    .entry-content { flex: 1; min-width: 0; }
    .docs-col { width: 235px; flex-shrink: 0; border-left: 1px solid #E2E8F0; padding-left: 12px; }
    .doc-item-row { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-bottom: 4px; }

    @media (max-width: 640px) {
      .entry-row { flex-direction: column; gap: 4px; }
      .step-left { width: auto; display: flex; align-items: baseline; gap: 8px; }
      .step-right { border-left: none; padding-left: 0; }
      .entry-main { flex-direction: column; }
      .docs-col { width: 100%; border-left: none; padding-left: 0; border-top: 1px solid #F1F5F9; padding-top: 6px; }
    }

    .badge { font-size: 12px; padding: 2px 7px; border-radius: 4px; border: 1px solid transparent; font-weight: 500; display: inline-block; }
    .st-todo { background: #FEF2F2; color: #B91C1C; border-color: #FECACA; }
    .st-appoint { background: #EFF6FF; color: #1D4ED8; border-color: #BFDBFE; }
    .st-wait { background: #FFFBEB; color: #B45309; border-color: #FDE68A; }
    .st-done { background: #ECFDF5; color: #047857; border-color: #A7F3D0; }
    .sync-ok { background: #ECFDF5; color: #047857; border-color: #A7F3D0; }
    .sync-err { background: #FEF2F2; color: #B91C1C; border-color: #FECACA; }

    .thumbs { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 2px; }
    .thumb-box { width: 56px; height: 56px; border-radius: 4px; border: 1px solid #CBD5E1; overflow: hidden; flex-shrink: 0; cursor: pointer; background: #F1F5F9; display: block; }
    .thumb-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .fu-box { margin-top: 8px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 6px 10px; font-size: 12px; }
    .fu-log { background: #FFF; border: 1px solid #E2E8F0; border-radius: 4px; padding: 4px 8px; margin-top: 4px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,0.55); z-index: 50; overflow-y: auto; padding: 16px 10px; display: flex; align-items: flex-start; justify-content: center; }
    .modal-box { background: #FFF; border: 1px solid #CBD5E1; border-radius: 8px; width: 100%; max-width: 780px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    .modal-sm { max-width: 540px; }
    .modal-head { background: #F8FAFC; border-bottom: 1px solid #E2E8F0; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; }
    .modal-body { padding: 14px; }
    .modal-foot { background: #F8FAFC; border-top: 1px solid #E2E8F0; padding: 10px 14px; display: flex; justify-content: flex-end; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .field-label { display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 4px; }

    .canvas-wrapper { width: 100%; background: #E2E8F0; border: 1px solid #CBD5E1; border-radius: 6px; overflow: hidden; touch-action: none; display: flex; justify-content: center; }
    canvas { max-width: 100%; max-height: 54vh; display: block; cursor: crosshair; }
    canvas.move-cursor { cursor: grab; }
    canvas.move-cursor:active { cursor: grabbing; }
    .color-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #FFF; box-shadow: 0 0 0 1px #64748B; cursor: pointer; padding: 0; }
    .color-dot.active-color { box-shadow: 0 0 0 2px #0F172A; transform: scale(1.12); }

    .standalone-photo { border: 1px solid #CBD5E1; border-radius: 8px; overflow: hidden; background: #FFF; margin-top: 14px; break-inside: avoid; page-break-inside: avoid; }
    .standalone-photo img { width: 100%; max-height: 75vh; object-fit: contain; background: #F8FAFC; display: block; }
    .hidden { display: none !important; }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 90; background: #0F172A; color: #FFF; padding: 8px 14px; border-radius: 6px; font-size: 12px; max-width: 90vw; text-align: center; }

    @media print {
      body { background: #FFF; }
      .no-print, .topbar, .filter-bar { display: none !important; }
      .container { max-width: 100%; padding: 0; }
      .site-card { border: 1px solid #94A3B8; margin: 0; }
      .standalone-photo img { max-height: 460px; }
    }
  </style>
</head>
<body>

  <header class="topbar no-print">
    <div class="container row-between" style="padding-bottom:0;">
      <div class="row">
        <span class="t-site">築匠設計 ARTISAN STUDIO</span>
        <span style="color:#CBD5E1">|</span>
        <span class="t-meta muted" id="headerSubTitle">QC 總報告</span>
        <span id="syncBadge" class="badge" style="background:#F1F5F9;border-color:#E2E8F0;">連線中</span>
      </div>
      <div class="row" id="adminHeaderBtns">
        <a href="album.html" target="_blank" class="btn-secondary">截圖工作台 ↗</a>
        <button type="button" onclick="openEditor()" class="btn-primary">+ 新增報告</button>
      </div>
      <div class="row hidden" id="standaloneHeaderBtns">
        <button type="button" onclick="window.print()" class="btn-secondary">列印 / 儲存 PDF</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="filterBar" class="filter-bar no-print">
      <div class="search-wrap">
        <input type="text" id="searchInput" oninput="renderReportList()" placeholder="搜尋屋苑、負責人、約期或關鍵字..." class="input-ui" />
      </div>
      <select id="siteFilter" onchange="renderReportList()" class="select-ui">
        <option value="ALL">全部單位</option>
      </select>
      <select id="statusFilter" onchange="renderReportList()" class="select-ui">
        <option value="ALL">全部狀態</option>
        <option value="需跟進">需跟進</option>
        <option value="已約期">已約期</option>
        <option value="待確認">待確認</option>
        <option value="已完成">已完成</option>
      </select>
    </div>

    <div id="reportListContainer">
      <div style="background:#FFF;border:1px solid #E2E8F0;border-radius:8px;padding:24px;margin-top:14px;text-align:center;" class="muted">載入中...</div>
    </div>
  </main>

  <!-- 彈窗 1：新增 / 編輯報告 -->
  <div id="editorModal" class="modal-backdrop hidden no-print">
    <div class="modal-box">
      <div class="modal-head">
        <span class="t-site" id="editorModalTitle">新增報告</span>
        <button type="button" onclick="closeEditor()" class="btn-link">關閉 ✕</button>
      </div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:10px;">
        <div class="grid-3">
          <div><label class="field-label">屋苑 / 單位 *</label><input type="text" id="fieldSite" placeholder="例如：屯門良景邨良智樓412室" class="input-ui" /></div>
          <div><label class="field-label">@負責人</label><input type="text" id="fieldAssignee" placeholder="例如：@Johnny" class="input-ui" /></div>
          <div>
            <label class="field-label">狀態</label>
            <select id="fieldStatus" class="select-ui" style="width:100%;padding:7px 8px;">
              <option value="需跟進">需跟進</option><option value="已約期">已約期</option><option value="待確認">待確認</option><option value="已完成">已完成</option>
            </select>
          </div>
        </div>

        <div class="grid-3">
          <div><label class="field-label">日期</label><input type="date" id="fieldDate" class="input-ui" /></div>
          <div>
            <label class="field-label">時段（開始 / 結束）</label>
            <div class="grid-2"><input type="time" id="fieldTimeStart" class="input-ui" /><input type="time" id="fieldTimeEnd" class="input-ui" /></div>
          </div>
          <div><label class="field-label">項目重點標題 *</label><input type="text" id="fieldTitle" placeholder="例如：現場睇位及覆尺" class="input-ui" /></div>
        </div>

        <div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:6px;padding:10px;">
          <div class="row-between" style="margin-bottom:6px;">
            <span class="t-meta" style="font-weight:600;">關聯文件 / Google 連結 / 截圖檔（顯示於右側）</span>
            <div class="row">
              <button type="button" onclick="openAlbumFromEditor()" class="btn-primary">+ 開截圖工作台</button>
              <label class="btn-secondary" style="cursor:pointer;"><span>+ 小PDF</span><input type="file" accept="application/pdf" multiple class="hidden" onchange="handlePdfUpload(event)" /></label>
              <button type="button" onclick="addDocRow()" class="btn-secondary">+ 加網址連結</button>
            </div>
          </div>
          <div id="docRowsContainer" style="display:flex;flex-direction:column;gap:6px;"></div>
        </div>

        <div><label class="field-label">檢查要點 / 事項內容</label><textarea id="fieldSummary" rows="3" placeholder="輸入檢查內容..." class="input-ui"></textarea></div>
        <div><label class="field-label">後續摘要（可留空）</label><input type="text" id="fieldFollowup" placeholder="例如：待工廠回覆修改確認圖" class="input-ui" /></div>

        <div style="border-top:1px solid #E2E8F0;padding-top:10px;">
          <div class="row-between" style="margin-bottom:8px;">
            <span style="font-weight:600;">現場相片與標記 <span id="photoCountHint" class="t-meta muted">（支援連續拍照、批量揀相及 Ctrl+V，不限張數）</span></span>
            <div class="row">
              <label class="btn-primary" style="cursor:pointer;"><span>📷 連續拍照</span><input type="file" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoUpload(event)" /></label>
              <label class="btn-secondary" style="cursor:pointer;"><span>🖼 批量上傳相片</span><input type="file" accept="image/*" multiple class="hidden" onchange="handlePhotoUpload(event)" /></label>
              <button type="button" onclick="createBlankSketch()" class="btn-secondary">+ 草圖板</button>
            </div>
          </div>

          <div id="annotationWorkspace" class="hidden" style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:6px;padding:8px;margin-bottom:8px;">
            <div class="row-between" style="margin-bottom:6px;">
              <div class="row">
                <button type="button" onclick="setTool('move')" id="tool-move" class="btn-secondary" title="點選文字或圖形即可拖曳移動">✋ 移動</button>
                <button type="button" onclick="setTool('freehand')" id="tool-freehand" class="btn-secondary btn-active">✎ 手繪</button>
                <button type="button" onclick="setTool('circle')" id="tool-circle" class="btn-secondary">◯ 線圈</button>
                <button type="button" onclick="setTool('arrow')" id="tool-arrow" class="btn-secondary">↗ 箭咀</button>
                <button type="button" onclick="setTool('text')" id="tool-text" class="btn-secondary">T 打字</button>
                <select id="fontSizeSelect" onchange="onFontSizeChange()" class="select-ui" title="字體大細">
                  <option value="0.018">字體：細</option>
                  <option value="0.026" selected>字體：中</option>
                  <option value="0.036">字體：大</option>
                  <option value="0.048">字體：特大</option>
                </select>
              </div>
              <div class="row">
                <button type="button" onclick="setColor('rgba(220,38,38,0.92)', this)" class="color-dot active-color" style="background:#DC2626;"></button>
                <button type="button" onclick="setColor('rgba(37,99,235,0.92)', this)" class="color-dot" style="background:#2563EB;"></button>
                <button type="button" onclick="setColor('rgba(234,179,8,0.95)', this)" class="color-dot" style="background:#EAB308;"></button>
                <button type="button" onclick="setColor('rgba(15,23,42,0.92)', this)" class="color-dot" style="background:#0F172A;"></button>
                <button type="button" id="delSelectedShapeBtn" onclick="deleteSelectedShape()" class="btn-danger-outline hidden">刪選取</button>
                <button type="button" onclick="undoShape()" class="btn-secondary">復原</button>
                <button type="button" onclick="clearShapes()" class="btn-secondary">全清</button>
              </div>
            </div>

            <div id="textInputBar" class="hidden" style="margin-bottom:6px;">
              <input type="text" id="canvasTextInput" oninput="onTextInputLiveEdit()" placeholder="輸入文字後點擊下方畫布貼上（貼上後會自動切換「✋ 移動」方便拖位）..." class="input-ui t-meta" />
            </div>

            <div class="canvas-wrapper"><canvas id="annotCanvas"></canvas></div>
            <input type="text" id="currentPhotoNote" oninput="syncCurrentPhotoNote()" placeholder="此相片說明 / 位置備註..." class="input-ui t-meta" style="margin-top:6px;" />
          </div>

          <div id="photoThumbList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px;"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" onclick="closeEditor()" class="btn-secondary">取消</button>
        <button type="button" id="saveReportBtn" onclick="saveReport()" class="btn-primary">儲存同步</button>
      </div>
    </div>
  </div>

  <!-- 彈窗 2：約期 / 留言 -->
  <div id="followupModal" class="modal-backdrop hidden no-print">
    <div class="modal-box modal-sm">
      <div class="modal-head">
        <span class="t-site" id="followupModalTitle">新增留言</span>
        <button type="button" onclick="closeFollowupModal()" class="btn-link">關閉 ✕</button>
      </div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:10px;">
        <div id="followupTargetTitle" class="t-meta" style="font-weight:600;background:#F8FAFC;padding:6px 8px;border-radius:4px;border:1px solid #E2E8F0;"></div>
        <div id="followupHistoryList" style="max-height:160px;overflow-y:auto;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:6px;padding:6px;"></div>
        <div class="grid-2">
          <div><label class="field-label">名字 *</label><input type="text" id="fuAuthor" placeholder="例如：Johnny" class="input-ui t-meta" /></div>
          <div>
            <label class="field-label">更新狀態</label>
            <select id="fuNewStatus" class="select-ui" style="width:100%;padding:7px 8px;">
              <option value="KEEP">保持原狀態</option><option value="已約期">已約期</option><option value="需跟進">需跟進</option><option value="待確認">待確認</option><option value="已完成">已完成</option>
            </select>
          </div>
        </div>
        <div id="appointFieldsWrap" class="grid-2 hidden">
          <div><label class="field-label">預約日期 *</label><input type="date" id="fuDate" class="input-ui t-meta" /></div>
          <div>
            <label class="field-label">時段（開始 / 結束）</label>
            <div class="grid-2"><input type="time" id="fuTimeStart" class="input-ui t-meta" style="padding:5px;" /><input type="time" id="fuTimeEnd" class="input-ui t-meta" style="padding:5px;" /></div>
          </div>
        </div>
        <div><label class="field-label" id="fuMsgLabel">留言內容 *</label><textarea id="fuMessage" rows="2" placeholder="輸入內容..." class="input-ui"></textarea></div>
      </div>
      <div class="modal-foot">
        <button type="button" onclick="closeFollowupModal()" class="btn-secondary">取消</button>
        <button type="button" id="submitFollowupBtn" onclick="submitFollowupLog()" class="btn-primary">發送</button>
      </div>
    </div>
  </div>

  <!-- 彈窗 3：WhatsApp 禮貌訊息與獨立分頁分享 -->
  <div id="shareModal" class="modal-backdrop hidden no-print">
    <div class="modal-box modal-sm">
      <div class="modal-head">
        <span class="t-site" id="shareModalTitle">WhatsApp 禮貌分享</span>
        <button type="button" onclick="closeShareModal()" class="btn-link">關閉 ✕</button>
      </div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:12px;" id="shareModalBody"></div>
    </div>
  </div>

  <div id="toast" class="hidden no-print"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCSRfZdAVh8ADPNtayW5lyDtmE0xDsJXNg",
      authDomain: "gen-lang-client-0208380044.firebaseapp.com",
      databaseURL: "https://gen-lang-client-0208380044-default-rtdb.firebaseio.com",
      projectId: "gen-lang-client-0208380044",
      storageBucket: "gen-lang-client-0208380044.firebasestorage.app",
      messagingSenderId: "17077391191",
      appId: "1:17077391191:web:cb936dd1bfe98b2f3d7812"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(() => {});

    const COLLECTION_NAME = 'artisan_qc_reports';
    const PHOTOS_COL = 'artisan_qc_photos';
    const ALBUMS_COL = 'artisan_qc_albums';
    const STATUS_ORDER = ['需跟進', '已約期', '待確認', '已完成'];

    const urlParams = new URLSearchParams(window.location.search);
    const SINGLE_REPORT_ID = urlParams.get('reportId') || '';
    const SINGLE_SITE = urlParams.get('site') || '';
    const IS_PUBLIC = urlParams.get('view') === 'public' || Boolean(SINGLE_REPORT_ID) || Boolean(SINGLE_SITE);

    let reports = [];
    let singleReportData = null;
    let expandedSites = new Set();
    let inlineEditId = null, editingReportId = null, followupTargetId = null;
    let followupModalMode = 'comment';

    function isTypingInputTarget(el) {
      if (!el) return false;
      const tag = el.tagName;
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
    }

    function bootApp() {
      if (SINGLE_REPORT_ID) {
        enterCleanPublicUI('現場記錄報告');
        db.collection(COLLECTION_NAME).doc(SINGLE_REPORT_ID).onSnapshot(doc => {
          if (!doc.exists) {
            document.getElementById('reportListContainer').innerHTML = `<div style="background:#FFF;border:1px solid #E2E8F0;border-radius:8px;padding:24px;margin-top:14px;text-align:center;" class="muted">找不到此報告或報告已被刪除</div>`;
            return;
          }
          singleReportData = { id: doc.id, ...doc.data() };
          reports = [singleReportData];
          renderSingleReportStandalone(singleReportData);
        });
        return;
      }

      if (SINGLE_SITE) {
        enterCleanPublicUI('單位現場記錄');
        db.collection(COLLECTION_NAME).where('site', '==', SINGLE_SITE).onSnapshot(snap => {
          reports = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderReportList();
        });
        return;
      }

      if (IS_PUBLIC) {
        enterCleanPublicUI('現場記錄總覽');
        document.getElementById('filterBar').classList.remove('hidden');
      }

      db.collection(COLLECTION_NAME).orderBy('createdAt', 'desc').onSnapshot(snap => {
        setSyncStatus(snap.metadata.fromCache ? '快取秒開' : '已同步', true);
        reports = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        updateSiteFilterOptions();
        renderReportList();
      }, () => setSyncStatus('離線', false));
    }

      document.getElementById('filterBar').classList.add('hidden');

    function setSyncStatus(text, ok = true) {

    function getAlbumEditUrl(docUrl) {
      if (!docUrl || !docUrl.includes('albumId=')) return '';
      const m = docUrl.match(/albumId=([^&]+)/);
      if (!m) return '';
      const u = new URL('album.html', window.location.href);
      u.search = `?albumId=${encodeURIComponent(m[1])}`;
      return u.toString();
    }

    async function fetchFullPhotosForReport(r) {
      if (Array.isArray(r.photoMeta) && r.photoMeta.length > 0) {
        const docs = await Promise.all(r.photoMeta.map(m => db.collection(PHOTOS_COL).doc(m.id).get().catch(() => null)));
        return r.photoMeta.map((m, idx) => {
          const d = docs[idx] && docs[idx].exists ? docs[idx].data() : null;
          return {
            id: m.id,
            base64Raw: d ? (d.base64Raw || '') : '',
            base64Annotated: d ? (d.base64Annotated || d.base64Raw || m.thumb) : m.thumb,
            shapes: d ? (d.shapes || []) : [],
            note: d ? (d.note ?? m.note ?? '') : (m.note || '')
          };
        });
      }
      return Array.isArray(r.photos) ? r.photos : [];
    }

    function getReportThumbs(r) {
      if (Array.isArray(r.photoMeta) && r.photoMeta.length > 0) {
        return r.photoMeta.map(m => ({ id: m.id, src: m.thumb, note: m.note || '' }));
      }
      if (Array.isArray(r.photos) && r.photos.length > 0) {
        return r.photos.map(p => ({ id: p.id, src: p.base64Annotated || p.base64Raw, note: p.note || '' }));
      }
      return [];
    }

      const fullPhotos = await fetchFullPhotosForReport(r);
      const pWrap = document.getElementById('standalonePhotosWrap');
      if (pWrap && fullPhotos.length) {
        pWrap.innerHTML = fullPhotos.map((p, i) => `
          <div class="standalone-photo">

          </div>`).join('');
      }

      const albumDocs = docs.filter(d => d.url && d.url.includes('albumId='));
      const embedWrap = document.getElementById('embeddedAlbumsWrap');
      for (const ad of albumDocs) {
        const m = ad.url.match(/albumId=([^&]+)/);
        if (!m) continue;
        const albumId = m[1];
        try {
          let pages = [];

          if (albDoc.exists) {
            const pSnap = await db.collection(ALBUMS_COL).doc(albumId).collection('pages').orderBy('order', 'asc').get();
            pages = pSnap.docs.map(x => x.data());
          }
          if (pages.length && embedWrap) {
            const sec = document.createElement('div');
            sec.style.marginTop = '22px';
            sec.innerHTML = `
              <div style="font-weight:700;padding-bottom:6px;border-bottom:2px solid #0F172A;margin-bottom:10px;">${escapeHtml(ad.name)}</div>
              ${pages.map((p, idx) => `
                <div class="standalone-photo">
                  <img loading="lazy" src="${p.rendered || p.raw}" />
                  ${p.note ? `<div style="padding:8px 12px;border-top:1px solid #E2E8F0;" class="t-meta"><b>#${idx + 1}</b> ${escapeHtml(p.note)}</div>` : ''}

              `).join('')}`;

      if (isTypingInputTarget(document.activeElement) || isTypingInputTarget(e.target)) return;
      for (const item of (e.clipboardData || window.clipboardData).items) {

          processImageFile(item.getAsFile());

    function openAlbumWorkspace(siteName = '', dateStr = '', reportId = '') {
      const url = new URL('album.html', window.location.href);
      if (siteName) url.searchParams.set('site', siteName);
      if (dateStr) url.searchParams.set('date', dateStr);
      if (reportId) url.searchParams.set('reportId', reportId);
      window.open(url.toString(), '_blank');
    }

    function openAlbumFromEditor() {
      openAlbumWorkspace(document.getElementById('fieldSite').value.trim(), document.getElementById('fieldDate').value, editingReportId || '');
    }

    function copyText(text, msg) {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => showToast(msg));
      else { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast(msg); }
    }

    function showToast(msg) {
      const el = document.getElementById('toast'); el.textContent = msg; el.classList.remove('hidden');
      clearTimeout(window._t); window._t = setTimeout(() => el.classList.add('hidden'), 2300);
    }

    function updateSiteFilterOptions() {
      const select = document.getElementById('siteFilter'), cur = select.value;
      const sites = [...new Set(reports.map(r => r.site).filter(Boolean))];
      select.innerHTML = '<option value="ALL">全部單位</option>' + sites.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
      if (sites.includes(cur)) select.value = cur;
    }

    function getStatusClass(st) {
      if (st === '需跟進') return 'st-todo';
      if (st === '已約期') return 'st-appoint';
      if (st === '待確認') return 'st-wait';
      return 'st-done';
    }

    function getDocsList(r) {
      if (Array.isArray(r.docs) && r.docs.length > 0) return r.docs;
      if (r.docName) return [{ name: r.docName, url: r.docUrl || '' }];
      return [];
    }

    function parseTimeRange(str) {
      const m = (str || '').match(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/);
      return m ? { start: m[1].padStart(5, '0'), end: m[2].padStart(5, '0') } : { start: '', end: '' };
    }

    function formatTimeRange(s, e) { return (s && e) ? `${s} - ${e}` : (s || e || ''); }

    async function cycleStatus(id) {
      const rep = reports.find(r => r.id === id); if (!rep) return;
      const next = STATUS_ORDER[(STATUS_ORDER.indexOf(rep.status) + 1) % STATUS_ORDER.length];
      await db.collection(COLLECTION_NAME).doc(id).update({ status: next, updatedAt: Date.now() });
      showToast(`狀態：${next}`);
    }

    async function quickEditSiteHeader(oldSite, oldAssignee) {
      const newSite = prompt('修改單位名稱：', oldSite);
      if (!newSite || !newSite.trim()) return;
      const newAssignee = prompt('修改 @負責人：', oldAssignee || '');
      if (newAssignee === null) return;
      const batch = db.batch();
      reports.filter(r => r.site === oldSite).forEach(r => batch.update(db.collection(COLLECTION_NAME).doc(r.id), { site: newSite.trim(), assignee: newAssignee.trim(), updatedAt: Date.now() }));
      await batch.commit(); showToast('已更新');
    }

    function startInlineEdit(id) { inlineEditId = id; renderReportList(); }
    function cancelInlineEdit() { inlineEditId = null; renderReportList(); }
    async function saveInlineEdit(id) {
      const title = document.getElementById(`ie-title-${id}`).value.trim();
      if (!title) return showToast('標題不能為空');
      await db.collection(COLLECTION_NAME).doc(id).update({
        date: document.getElementById(`ie-date-${id}`).value,
        timeRange: formatTimeRange(document.getElementById(`ie-ts-${id}`).value, document.getElementById(`ie-te-${id}`).value),
        title,
        summary: document.getElementById(`ie-sum-${id}`).value.trim(),
        followup: document.getElementById(`ie-fu-${id}`).value.trim(),
        updatedAt: Date.now()
      });
      inlineEditId = null; showToast('已儲存');

    function toggleExpandSite(s) { expandedSites.has(s) ? expandedSites.delete(s) : expandedSites.add(s); renderReportList(); }

    function renderFollowupBlock(r, cleanReadOnly = false) {
      const logs = Array.isArray(r.followupLogs) ? r.followupLogs : [];
      const hasFollowupText = Boolean(r.followup && r.followup.trim());
      if (cleanReadOnly && !hasFollowupText && logs.length === 0) return '';

      const head = hasFollowupText ? escapeHtml(r.followup) : (logs.length ? `共 ${logs.length} 條跟進紀錄` : `<span class="muted">暫無跟進</span>`);
      const commentBtnHtml = cleanReadOnly ? '' : `<button type="button" onclick="openFollowupModal('${r.id}','comment')" class="btn-link no-print">+ 留言</button><span class="no-print" style="color:#CBD5E1">|</span>`;

      return `<div class="fu-box">
        <div class="row">${commentBtnHtml}<span><b>後續跟進：</b>${head}</span></div>
        ${logs.map(l => `<div class="fu-log"><span><b>${escapeHtml(l.author)}</b> ${l.appointDate ? `<span class="badge st-appoint">約期 ${escapeHtml(l.appointDate)} ${escapeHtml(l.appointTime||'')}</span> ` : ''}${escapeHtml(l.message)}</span><span class="muted t-mono">${escapeHtml(l.createdAtStr||'')}</span></div>`).join('')}
      </div>`;
    }

    function renderReportList() {
      const container = document.getElementById('reportListContainer');
      const kw = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
      const siteVal = SINGLE_SITE || document.getElementById('siteFilter').value;
      const statusVal = document.getElementById('statusFilter').value;

      if (SINGLE_SITE) document.title = `${SINGLE_SITE} — 現場記錄`;

      const filtered = reports.filter(r => {
        if (!r.site && !r.title) return false;
        if (siteVal !== 'ALL' && r.site !== siteVal) return false;
        if (!SINGLE_SITE && statusVal !== 'ALL' && r.status !== statusVal) return false;
        if (!SINGLE_SITE && kw) {
          const hay = `${r.site} ${r.assignee||''} ${r.date||''} ${r.title} ${r.summary||''} ${getDocsList(r).map(d=>d.name).join(' ')} ${(r.followupLogs||[]).map(l=>l.message+' '+l.appointDate).join(' ')}`.toLowerCase();
          if (!hay.includes(kw)) return false;
        }
        return true;
      });

      if (!filtered.length) {
        container.innerHTML = `<div style="background:#FFF;border:1px solid #E2E8F0;border-radius:8px;padding:24px;margin-top:14px;text-align:center;" class="muted">暫無紀錄</div>`;
        return;
      }

      const groups = [], map = {};
      filtered.forEach(r => {
        const k = r.site || '未分類單位';
        if (!map[k]) { map[k] = { site: k, assignee: r.assignee || '', items: [] }; groups.push(map[k]); }
        map[k].items.push(r);
      });
      groups.forEach(g => g.items.sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0)));

      container.innerHTML = groups.map(g => {
        const encSite = encodeURIComponent(g.site), encAss = encodeURIComponent(g.assignee || g.items[0].assignee || '');
        const isExp = SINGLE_SITE ? true : expandedSites.has(g.site);
        const vis = isExp ? g.items : g.items.slice(0, 3);

        const rowsHtml = vis.map((r, idx) => {
          const thumbs = getReportThumbs(r);
          const pCount = thumbs.length;
          const docs = getDocsList(r), stCls = getStatusClass(r.status);
          const singleUrl = getSingleReportUrl(r.id);

    async function submitFollowupLog() {

    function handlePhotoUpload(e) {

    function processImageFile(file) {
      if (!file) return;
      const rd = new FileReader();
      rd.onload = ev => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height, m = 1150;
          if (w > m || h > m) { if (w > h) { h = Math.round(h * m / w); w = m; } else { w = Math.round(w * m / h); h = m; } }
          const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
          const b64 = c.toDataURL('image/jpeg', 0.78);
          draftPhotos.push({ id: 'ph_' + Date.now() + '_' + Math.random().toString(36).slice(2,6), base64Raw: b64, base64Annotated: b64, shapes: [], note: '' });
          renderPhotoThumbList();
          selectPhotoForAnnotation(draftPhotos.length - 1);
          showToast(`已加入第 ${draftPhotos.length} 張相片`);
        };
        img.src = ev.target.result;
      };
      rd.readAsDataURL(file);
    }

    function makeSmallThumb(dataUrl) {

          if (w > m || h > m) { if (w > h) { h = Math.round(h * m / w); w = m; } else { w = Math.round(w * m / h); h = m; } }
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);

    function renderPhotoThumbList() {

      document.getElementById('photoThumbList').innerHTML = draftPhotos.map((p, i) => `

    function removeDraftPhoto(e, i) {

      renderPhotoThumbList();
      baseImageObj = new Image();

      baseImageObj.src = p.base64Raw;

    function syncCurrentPhotoNote() { if (activePhotoIndex >= 0) draftPhotos[activePhotoIndex].note = document.getElementById('currentPhotoNote').value; }

    function setTool(t) {
      currentTool = t;
      ['move','freehand','circle','arrow','text'].forEach(k => document.getElementById('tool-'+k).classList.toggle('btn-active', k===t));
      canvas.classList.toggle('move-cursor', t === 'move');
      if (t !== 'move') { selectedShapeIdx = -1; redrawCanvas(false); }
      updateSelectionUI();
    }

    function updateSelectionUI() {
      const shapes = activePhotoIndex >= 0 ? (draftPhotos[activePhotoIndex]?.shapes || []) : [];
      const sel = selectedShapeIdx >= 0 ? shapes[selectedShapeIdx] : null;
      document.getElementById('delSelectedShapeBtn').classList.toggle('hidden', !sel);
      const showTextBar = currentTool === 'text' || (sel && sel.type === 'text');
      document.getElementById('textInputBar').classList.toggle('hidden', !showTextBar);
      if (sel && sel.type === 'text') {
        document.getElementById('canvasTextInput').value = sel.text || '';
        if (sel.scale) document.getElementById('fontSizeSelect').value = String(sel.scale);
      }
    }

    function onFontSizeChange() {
      currentFontScale = parseFloat(document.getElementById('fontSizeSelect').value) || 0.026;
      const shapes = activePhotoIndex >= 0 ? (draftPhotos[activePhotoIndex]?.shapes || []) : [];
      if (selectedShapeIdx >= 0 && shapes[selectedShapeIdx]?.type === 'text') {
        shapes[selectedShapeIdx].scale = currentFontScale;
        redrawCanvas(true);
      }
    }

    function onTextInputLiveEdit() {
      const shapes = activePhotoIndex >= 0 ? (draftPhotos[activePhotoIndex]?.shapes || []) : [];
      if (currentTool === 'move' && selectedShapeIdx >= 0 && shapes[selectedShapeIdx]?.type === 'text') {
        shapes[selectedShapeIdx].text = document.getElementById('canvasTextInput').value;
        redrawCanvas(true);
      }
    }

    function setColor(c, btnEl) {
      currentColor = c;
      document.querySelectorAll('#annotationWorkspace .color-dot').forEach(b => b.classList.remove('active-color'));
      if (btnEl) btnEl.classList.add('active-color');
      const shapes = activePhotoIndex >= 0 ? (draftPhotos[activePhotoIndex]?.shapes || []) : [];
      if (selectedShapeIdx >= 0 && shapes[selectedShapeIdx]) {
        shapes[selectedShapeIdx].color = c;
        redrawCanvas(true);
      }
    }

    function deleteSelectedShape() {
      if (activePhotoIndex < 0 || selectedShapeIdx < 0) return;
      draftPhotos[activePhotoIndex].shapes.splice(selectedShapeIdx, 1);
      selectedShapeIdx = -1;
      updateSelectionUI();
      redrawCanvas(true);
    }

    function undoShape() { if (activePhotoIndex >= 0) { draftPhotos[activePhotoIndex].shapes.pop(); selectedShapeIdx = -1; updateSelectionUI(); redrawCanvas(true); } }
    function clearShapes() { if (activePhotoIndex >= 0) { draftPhotos[activePhotoIndex].shapes = []; selectedShapeIdx = -1; updateSelectionUI(); redrawCanvas(true); } }

    function getShapeBounds(c, s) {
      if (s.type === 'text') {
        const fs = Math.max(16, Math.round(canvas.width * (s.scale || 0.026)));
        c.save(); c.font = `bold ${fs}px sans-serif`; const w = c.measureText(s.text || '').width; c.restore();
        return { x1: s.x - 10, y1: s.y - fs - 4, x2: s.x + w + 10, y2: s.y + 10 };
      }
      if (s.type === 'freehand' && s.points?.length) {
        const xs = s.points.map(p => p.x), ys = s.points.map(p => p.y);
        return { x1: Math.min(...xs) - 10, y1: Math.min(...ys) - 10, x2: Math.max(...xs) + 10, y2: Math.max(...ys) + 10 };
      }
      return { x1: Math.min(s.x1, s.x2) - 10, y1: Math.min(s.y1, s.y2) - 10, x2: Math.max(s.x1, s.x2) + 10, y2: Math.max(s.y1, s.y2) + 10 };
    }

    function hitTestShape(shapes, x, y) {
      for (let i = shapes.length - 1; i >= 0; i--) {
        const b = getShapeBounds(ctx, shapes[i]);
        if (x >= b.x1 && x <= b.x2 && y >= b.y1 && y <= b.y2) return i;
      }
      return -1;
    }

    function moveShapeBy(s, dx, dy) {
      if (s.type === 'text') { s.x += dx; s.y += dy; }
      else if (s.type === 'freehand' && s.points) { s.points.forEach(p => { p.x += dx; p.y += dy; }); }
      else { s.x1 += dx; s.y1 += dy; s.x2 += dx; s.y2 += dy; }
    }

    function getCoords(e) { const r = canvas.getBoundingClientRect(), cx = e.touches ? e.touches[0].clientX : e.clientX, cy = e.touches ? e.touches[0].clientY : e.clientY; return { x: (cx - r.left) * (canvas.width / r.width), y: (cy - r.top) * (canvas.height / r.height) }; }
    canvas.addEventListener('mousedown', pDown); canvas.addEventListener('mousemove', pMove); canvas.addEventListener('mouseup', pUp);
    canvas.addEventListener('touchstart', pDown, { passive: false }); canvas.addEventListener('touchmove', pMove, { passive: false }); canvas.addEventListener('touchend', pUp);

    function pDown(e) {
      if (activePhotoIndex < 0) return; e.preventDefault();
      const pos = getCoords(e);
      const shapes = draftPhotos[activePhotoIndex].shapes || [];

      if (currentTool === 'move') {
        const hit = hitTestShape(shapes, pos.x, pos.y);
        selectedShapeIdx = hit;
        updateSelectionUI();
        redrawCanvas(false);
        if (hit >= 0) { isDraggingShape = true; lastDragX = pos.x; lastDragY = pos.y; }
        return;
      }

      if (currentTool === 'text') {
        const hit = hitTestShape(shapes, pos.x, pos.y);
        if (hit >= 0 && shapes[hit].type === 'text') {
          setTool('move'); selectedShapeIdx = hit; updateSelectionUI(); redrawCanvas(false);
          isDraggingShape = true; lastDragX = pos.x; lastDragY = pos.y;
          return;
        }
        const txt = document.getElementById('canvasTextInput').value.trim();
        if (!txt) return showToast('請先在輸入框打字，再點畫布貼上');
        shapes.push({ type: 'text', x: pos.x, y: pos.y, text: txt, color: currentColor, scale: currentFontScale });
        document.getElementById('canvasTextInput').value = '';
        currentTool = 'move';
        ['move','freehand','circle','arrow','text'].forEach(k => document.getElementById('tool-'+k).classList.toggle('btn-active', k==='move'));
        canvas.classList.add('move-cursor');
        selectedShapeIdx = shapes.length - 1;
        updateSelectionUI();
        redrawCanvas(true);
        showToast('已貼上文字！可直接拖曳擺位');
        return;
      }

      isDrawing = true; startX = pos.x; startY = pos.y;
      if (currentTool === 'freehand') currentStroke = [pos];
    }

    function pMove(e) {
      if (activePhotoIndex < 0) return;
      if (isDraggingShape && selectedShapeIdx >= 0) {
        e.preventDefault();
        const pos = getCoords(e);
        moveShapeBy(draftPhotos[activePhotoIndex].shapes[selectedShapeIdx], pos.x - lastDragX, pos.y - lastDragY);
        lastDragX = pos.x; lastDragY = pos.y;
        redrawCanvas(false);
        return;
      }
      if (!isDrawing) return; e.preventDefault();
      const pos = getCoords(e); redrawCanvas(false);
      if (currentTool === 'freehand') { currentStroke.push(pos); drawShape(ctx, { type: 'freehand', points: currentStroke, color: currentColor }); }
      else drawShape(ctx, { type: currentTool, x1: startX, y1: startY, x2: pos.x, y2: pos.y, color: currentColor });
    }

    function pUp(e) {
      if (isDraggingShape) { isDraggingShape = false; redrawCanvas(true); return; }
      if (!isDrawing || activePhotoIndex < 0) return; isDrawing = false;
      if (currentTool === 'freehand') { if (currentStroke.length > 1) draftPhotos[activePhotoIndex].shapes.push({ type: 'freehand', points: currentStroke, color: currentColor }); currentStroke = []; redrawCanvas(true); return; }
      const r = canvas.getBoundingClientRect(), cx = e.changedTouches ? e.changedTouches[0].clientX : e.clientX, cy = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
      const ex = (cx - r.left) * (canvas.width / r.width), ey = (cy - r.top) * (canvas.height / r.height);
      if (Math.hypot(ex - startX, ey - startY) > 6) draftPhotos[activePhotoIndex].shapes.push({ type: currentTool, x1: startX, y1: startY, x2: ex, y2: ey, color: currentColor });
      redrawCanvas(true);
    }

    function redrawCanvas(save = false) {
      if (!baseImageObj || activePhotoIndex < 0) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(baseImageObj, 0, 0);
      const shapes = draftPhotos[activePhotoIndex].shapes || [];
      shapes.forEach(s => drawShape(ctx, s));
      if (save) {
        draftPhotos[activePhotoIndex].base64Annotated = canvas.toDataURL('image/jpeg', 0.8);
        renderPhotoThumbList();
      }
      if (selectedShapeIdx >= 0 && shapes[selectedShapeIdx]) {
        const b = getShapeBounds(ctx, shapes[selectedShapeIdx]);
        ctx.save();
        ctx.strokeStyle = '#0EA5E9';
        ctx.lineWidth = Math.max(2, Math.round(canvas.width * 0.003));
        ctx.setLineDash([8, 6]);
        ctx.strokeRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);
        ctx.restore();
      }
    }

    function drawShape(c, s) {
      c.save(); const lw = Math.max(4, Math.round(canvas.width * 0.005)); c.strokeStyle = s.color; c.fillStyle = s.color; c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round';
      if (s.type === 'freehand' && s.points?.length > 1) { c.beginPath(); c.moveTo(s.points[0].x, s.points[0].y); s.points.slice(1).forEach(p => c.lineTo(p.x, p.y)); c.stroke(); }
      else if (s.type === 'circle') { c.beginPath(); c.ellipse((s.x1+s.x2)/2, (s.y1+s.y2)/2, Math.max(Math.abs(s.x2-s.x1)/2,4), Math.max(Math.abs(s.y2-s.y1)/2,4), 0, 0, Math.PI*2); c.stroke(); }
      else if (s.type === 'arrow') { const hl = lw*4, a = Math.atan2(s.y2-s.y1, s.x2-s.x1); c.beginPath(); c.moveTo(s.x1,s.y1); c.lineTo(s.x2,s.y2); c.stroke(); c.beginPath(); c.moveTo(s.x2,s.y2); c.lineTo(s.x2-hl*Math.cos(a-Math.PI/6), s.y2-hl*Math.sin(a-Math.PI/6)); c.lineTo(s.x2-hl*Math.cos(a+Math.PI/6), s.y2-hl*Math.sin(a+Math.PI/6)); c.closePath(); c.fill(); }
      else if (s.type === 'text') {
        const fs = Math.max(16, Math.round(canvas.width * (s.scale || 0.026)));
        c.font = `bold ${fs}px sans-serif`; const w = c.measureText(s.text).width;
        c.fillStyle = 'rgba(15,23,42,0.85)'; c.fillRect(s.x-8, s.y-fs, w+16, fs+10);
        c.fillStyle = s.color && s.color.includes('234,179,8') ? '#FEF08A' : '#FFF';
        c.strokeStyle = s.color; c.lineWidth = 2; c.strokeRect(s.x-8, s.y-fs, w+16, fs+10);
        c.fillText(s.text, s.x, s.y);
      }
      c.restore();
    }

    async function saveReport() {
      const site = document.getElementById('fieldSite').value.trim(), title = document.getElementById('fieldTitle').value.trim();
      if (!site || !title) return showToast('請填寫單位及標題');
      const btn = document.getElementById('saveReportBtn'); btn.disabled = true; btn.textContent = '同步相片中...';

      const docId = editingReportId || ('rep-' + Date.now()), ex = reports.find(r => r.id === docId);
      const validDocs = draftDocs.filter(d => d.name.trim() || d.url.trim()).map(d => ({ name: d.name.trim() || '附件檔案', url: d.url.trim() }));

      try {
        const photoMeta = [];
        for (let i = 0; i < draftPhotos.length; i++) {
          const p = draftPhotos[i];
          const pid = p.id || (`ph_${docId}_${i}_${Date.now()}`);
          p.id = pid;
          const rendered = p.base64Annotated || p.base64Raw;
          const smallThumb = await makeSmallThumb(rendered);

          await db.collection(PHOTOS_COL).doc(pid).set({
            reportId: docId,
            order: i,
            base64Raw: (p.shapes && p.shapes.length > 0) ? p.base64Raw : '',
            base64Annotated: rendered,
            shapes: p.shapes || [],
            note: p.note || '',
            updatedAt: Date.now()
          });
          photoMeta.push({ id: pid, thumb: smallThumb, note: p.note || '' });
        }

        const curIds = photoMeta.map(m => m.id);
        for (const oldId of originalPhotoIds) {
          if (!curIds.includes(oldId)) await db.collection(PHOTOS_COL).doc(oldId).delete().catch(() => {});
        }

        await db.collection(COLLECTION_NAME).doc(docId).set({
          site, assignee: document.getElementById('fieldAssignee').value.trim(),
          date: document.getElementById('fieldDate').value || new Date().toISOString().split('T')[0],
          timeRange: formatTimeRange(document.getElementById('fieldTimeStart').value, document.getElementById('fieldTimeEnd').value),
          status: document.getElementById('fieldStatus').value, title,
          docs: validDocs, docName: validDocs[0]?.name || '', docUrl: validDocs[0]?.url || '',
          summary: document.getElementById('fieldSummary').value.trim(),
          followup: document.getElementById('fieldFollowup').value.trim(),
          followupLogs: ex ? (ex.followupLogs || []) : [],
          photoMeta,
          photos: [],
          createdAt: ex ? ex.createdAt : Date.now(), updatedAt: Date.now()
        });
        closeEditor(); showToast(`已成功儲存報告及 ${photoMeta.length} 張相片！`);
      } catch (e) {
        console.error(e);
        showToast('儲存失敗：' + e.message);
      } finally { btn.disabled = false; btn.textContent = '儲存同步'; }
    }

    async function deleteReport(id) {
      if (!confirm('確定刪除此紀錄？')) return;
      const r = reports.find(x => x.id === id);
      if (r && Array.isArray(r.photoMeta)) {
        r.photoMeta.forEach(m => db.collection(PHOTOS_COL).doc(m.id).delete().catch(() => {}));
      }
      await db.collection(COLLECTION_NAME).doc(id).delete();
      showToast('已刪除');
    }

    function escapeHtml(s) { return !s ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function escapeAttr(s) { return escapeHtml(s).replace(/'/g, "\\'"); }

    bootApp();
  </script>
</body>
