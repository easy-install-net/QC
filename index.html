<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>築匠設計 ARTISAN STUDIO — QC 報告</title>
  <link rel="icon" href="data:," />
  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);
      if (p.get('view') === 'public' || p.get('view') === 'brief' || p.get('reportId') || p.get('site')) {
        window.location.replace('view.html' + window.location.search);
      }
    })();
  </script>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="report.css" />
  <style>
    /* 即將標籤與置頂待辦分區（無外框線，避免同輸入框撈亂） */
    .future-tag-pill {
      display: inline-block;
      background: rgba(234, 88, 12, 0.12);
      color: #C2410C;
      border: none;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.35;
      vertical-align: middle;
    }
    .future-diary-box {
      background: #FFFFFF;
      border-left: 3px solid #EA580C;
      margin-top: 6px;
      overflow: hidden;
    }
    .future-diary-head {
      background: #FFFBEB;
      border-bottom: 1px solid #FDE68A;
      padding: 5px 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .future-diary-body {
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 時間表詳細展開掣與內容面板（無框小粗字） */
    .detail-toggle-btn {
      background: transparent;
      color: #64748B;
      border: none;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .detail-toggle-btn:hover {
      color: #0F172A;
      background: rgba(15, 23, 42, 0.06);
    }
    .detail-toggle-btn.is-open {
      background: rgba(234, 88, 12, 0.12);
      color: #C2410C;
    }
    .schedule-detail-panel {
      margin-top: 5px;
      padding: 6px 9px;
      background: #F8FAFC;
      border-left: 2px solid #CBD5E1;
      border-radius: 2px;
      font-size: 12.5px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* 工作紀錄頂部地址快選列（無框小粗字） */
    .site-quick-bar {
      background: #FFFFFF;
      border-left: 3px solid #CBD5E1;
      padding: 6px 10px;
      margin-top: 6px;
    }
    .site-quick-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .site-chip-btn {
      background: transparent;
      color: #475569;
      border: none;
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .site-chip-btn:hover {
      color: #0F172A;
      background: rgba(15, 23, 42, 0.06);
    }
    .site-chip-btn.active {
      background: rgba(234, 88, 12, 0.14);
      color: #C2410C;
      font-weight: 800;
    }

    /* 「全」掣無框，與有框下拉選單清晰區分 */
    .all-filter-split {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: 1 1 auto;
      min-width: 0;
    }
    .all-btn {
      padding: 0 7px;
      height: 26px;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: #475569;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
    }
    .all-btn:hover {
      color: #0F172A;
      background: rgba(15, 23, 42, 0.06);
    }
    .all-btn.active {
      background: rgba(234, 88, 12, 0.14);
      color: #C2410C;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <header class="topbar no-print">
    <div class="container row-between" style="padding-bottom:0;">
      <div class="row">
        <span class="t-site" style="color:#FFFFFF;">築匠設計 ARTISAN STUDIO</span>
        <span id="syncBadge" class="sync-ok">連線中</span>
      </div>
      <div class="row" id="headerQuickActions">
        <button type="button" onclick="lockSystem()" id="lockSystemBtn" class="btn-secondary hidden">鎖定</button>
      </div>
    </div>
  </header>

  <div id="passcodeGate" class="modal-backdrop hidden no-print">
    <div class="modal-box modal-sm">
      <div class="modal-head">
        <span class="t-site">輸入密碼解鎖</span>
      </div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:8px;">
        <div class="t-meta muted">輸入密碼：</div>
        <input type="password" id="passcodeInput" onkeydown="if(event.key==='Enter')unlockSystem()" class="input-ui" placeholder="密碼" />
      </div>
      <div class="modal-foot">
        <button type="button" onclick="unlockSystem()" class="btn-orange">解鎖</button>
      </div>
    </div>
  </div>

  <main class="container">
    <div id="filterBar" class="filter-zone no-print">
      <div class="view-switch-bar" role="tablist">
        <button type="button" id="tabSchedule" onclick="switchMainView('schedule')" class="view-tab-btn active">時間表</button>
        <button type="button" id="tabReports" onclick="switchMainView('reports')" class="view-tab-btn">工作紀錄</button>
      </div>
      <button type="button" onclick="openEditor()" class="btn-orange" title="新增即將或工作紀錄"><span class="btn-sym">＋</span>即將</button>
      <div class="all-filter-split">
        <button type="button" id="btnAllSites" onclick="clickAllSitesBtn()" class="all-btn active">全</button>
        <select id="siteFilter" onchange="onSiteFilterChange()" class="select-site-lg" aria-label="選擇單位">
          <option value="ALL">-- 選擇單位 --</option>
        </select>
      </div>
      <div class="search-eight-wrap">
        <input type="text" id="searchInput" oninput="onSearchInput()" class="search-eight-input" placeholder="搜尋..." />
        <span class="search-lens-icon" aria-hidden="true">🔍</span>
      </div>
    </div>

    <div id="reportListContainer">
      <div style="background:#FFF;padding:16px;margin-top:8px;text-align:center;" class="muted">載入中...</div>
    </div>
  </main>

  <div id="editorModal" class="modal-backdrop hidden no-print">
    <div class="modal-box">
      <div class="modal-head">
        <span class="t-site" id="editorModalTitle">即將</span>
        <button type="button" onclick="closeEditor()" class="btn-link">關閉 <span class="btn-sym">✕</span></button>
      </div>
      <div class="modal-body" style="padding:0;">
        <div class="editor-band band-sec-1">
          <div class="editor-band-title">1. 單位與時間</div>
          <div class="grid-3">
            <div>
              <label class="field-label">屋苑 / 單位 *</label>
              <input type="text" id="fieldSite" autocomplete="off" oninput="onFieldSiteInput()" onfocus="onFieldSiteInput()" class="input-ui" />
              <div id="siteSuggestBox" class="site-suggest-box hidden"></div>
            </div>
            <div><label class="field-label">@負責人</label><input type="text" id="fieldAssignee" class="input-ui" /></div>
            <div><label class="field-label">標題 *</label><input type="text" id="fieldTitle" class="input-ui" /></div>
          </div>
          <div class="grid-2" style="margin-top:6px;">
            <div><label class="field-label">日期（留空＝未定日期）</label><input type="date" id="fieldDate" class="input-ui" /></div>
            <div>
              <div class="row-between" style="margin-bottom:3px;">
                <label class="field-label" style="margin-bottom:0;">開始 / 完成或工時</label>
                <div class="row" style="gap:4px;">
                  <span class="mini-pair">
                    <button type="button" onmousedown="event.preventDefault()" onclick="setMeridiemForStartInput('fieldTimeStart', 'AM')" class="mini-pair-btn">上午</button>
                    <button type="button" onmousedown="event.preventDefault()" onclick="setMeridiemForStartInput('fieldTimeStart', 'PM')" class="mini-pair-btn">下午</button>
                  </span>
                  <span class="mini-pair">
                    <button type="button" onmousedown="event.preventDefault()" onclick="setMinuteForStartInput('fieldTimeStart', '00')" class="mini-pair-btn">:00</button>
                    <button type="button" onmousedown="event.preventDefault()" onclick="setMinuteForStartInput('fieldTimeStart', '30')" class="mini-pair-btn">:30</button>
                  </span>
                </div>
              </div>
              <div class="grid-2">
                <input type="time" id="fieldTimeStart" class="input-ui" />
                <input type="text" id="fieldTimeEnd" class="input-ui" placeholder="完成 / 小數" />
              </div>
              <input type="hidden" id="fieldPeriodLabel" value="" />
            </div>
          </div>
          <div style="margin-top:8px;">
            <label class="row" style="gap:6px;cursor:pointer;user-select:none;">
              <input type="checkbox" id="fieldIsFutureDiary" style="width:15px;height:15px;accent-color:#EA580C;" />
              <span class="t-meta" style="font-weight:700;color:#C2410C;">即將</span>
            </label>
          </div>
        </div>

        <div class="editor-band band-sec-2">
          <div class="editor-band-title">2. 內容與文件</div>
          <div style="margin-bottom:6px;"><label class="field-label">內容</label><textarea id="fieldSummary" rows="3" class="input-ui"></textarea></div>
          <div style="margin-bottom:6px;"><label class="field-label">跟進</label><input type="text" id="fieldFollowup" class="input-ui" /></div>
          <div style="padding-top:6px;border-top:1px solid #E2E8F0;">
            <div class="row-between" style="margin-bottom:5px;">
              <span class="t-meta" style="font-weight:600;">附件</span>
              <div class="row">
                <button type="button" onclick="openAlbumFromEditor()" class="btn-link blue"><span class="btn-sym">📸</span>截圖</button>
                <label class="btn-secondary" style="cursor:pointer;"><span class="btn-sym">＋</span><span>PDF</span><input type="file" accept="application/pdf" multiple class="hidden" onchange="handlePdfUpload(event)" /></label>
                <button type="button" onclick="addDocRow()" class="btn-secondary"><span class="btn-sym">＋</span>連結</button>
              </div>
            </div>
            <div id="docRowsContainer" style="display:flex;flex-direction:column;gap:5px;"></div>
          </div>
        </div>

        <div class="editor-band band-sec-3">
          <div class="row-between" style="margin-bottom:6px;">
            <div>
              <div class="editor-band-title" style="margin-bottom:1px;">3. 相片與標記</div>
              <span id="photoCountHint" class="t-meta muted"></span>
            </div>
            <div class="row">
              <label class="btn-orange" style="cursor:pointer;"><span class="btn-sym">📷</span><span>拍照</span><input type="file" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoUpload(event)" /></label>
              <label class="btn-secondary" style="cursor:pointer;"><span class="btn-sym">🖼</span><span>上傳</span><input type="file" accept="image/*" multiple class="hidden" onchange="handlePhotoUpload(event)" /></label>
              <button type="button" onclick="createBlankSketch()" class="btn-secondary"><span class="btn-sym">✎</span>草圖</button>
            </div>
          </div>

          <div id="annotationWorkspace" class="hidden" style="background:#FFF;padding:6px;border-top:1px solid #CBD5E1;margin-bottom:6px;">
            <div class="row-between" style="margin-bottom:5px;">
              <div class="row">
                <button type="button" onclick="setTool('move')" id="tool-move" class="btn-secondary btn-active"><span class="btn-sym">✋</span>移動</button>
                <button type="button" onclick="setTool('freehand')" id="tool-freehand" class="btn-secondary"><span class="btn-sym">✎</span>手繪</button>
                <button type="button" onclick="setTool('circle')" id="tool-circle" class="btn-secondary"><span class="btn-sym">◯</span>線圈</button>
                <button type="button" onclick="setTool('arrow')" id="tool-arrow" class="btn-secondary"><span class="btn-sym">↗</span>箭咀</button>
                <button type="button" onclick="setTool('text')" id="tool-text" class="btn-secondary"><span class="btn-sym">T</span>打字</button>
                <select id="fontSizeSelect" onchange="onFontSizeChange()" class="select-ui" style="width:auto;">
                  <option value="0.018">字體：細</option>
                  <option value="0.026" selected>字體：中</option>
                  <option value="0.036">字體：大</option>
                  <option value="0.048">字體：特大</option>
                </select>
              </div>
              <div class="row">
                <button type="button" onclick="setColor('rgba(234,88,12,0.95)', this)" class="color-dot active-color" style="background:#EA580C;"></button>
                <button type="button" onclick="setColor('rgba(220,38,38,0.92)', this)" class="color-dot" style="background:#DC2626;"></button>
                <button type="button" onclick="setColor('rgba(37,99,235,0.92)', this)" class="color-dot" style="background:#2563EB;"></button>
                <button type="button" onclick="setColor('rgba(15,23,42,0.92)', this)" class="color-dot" style="background:#0F172A;"></button>
                <button type="button" id="delSelectedShapeBtn" onclick="deleteSelectedShape()" class="btn-danger-outline hidden"><span class="btn-sym">✕</span>刪選取</button>
                <button type="button" onclick="undoShape()" class="btn-secondary"><span class="btn-sym">↶</span>復原</button>
                <button type="button" onclick="clearShapes()" class="btn-danger-outline">全清</button>
              </div>
            </div>

            <div id="textInputBar" class="hidden" style="margin-bottom:5px;">
              <input type="text" id="canvasTextInput" oninput="onTextInputLiveEdit()" class="input-ui t-meta" placeholder="輸入標記文字，再點畫布落字" />
            </div>

            <div class="canvas-wrapper"><canvas id="annotCanvas"></canvas></div>
            <input type="text" id="currentPhotoNote" oninput="syncCurrentPhotoNote()" class="input-ui t-meta" style="margin-top:5px;" placeholder="此張相片備註..." />
          </div>

          <div id="photoThumbList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" onclick="closeEditor()" class="btn-secondary">取消</button>
        <button type="button" id="saveReportBtn" onclick="saveReport()" class="btn-orange">儲存</button>
      </div>
    </div>
  </div>

  <div id="siteManageModal" class="modal-backdrop hidden no-print">
    <div class="modal-box modal-sm">
      <div class="modal-head">
        <span class="t-site">單位改名 / 合併</span>
        <button type="button" onclick="closeSiteManageModal()" class="btn-link">關閉 <span class="btn-sym">✕</span></button>
      </div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:10px;">
        <div style="padding-bottom:8px;border-bottom:1px solid #CBD5E1;display:flex;flex-direction:column;gap:6px;">
          <div style="font-weight:700;font-size:12.5px;">1. 批量修改名稱 / @負責人</div>
          <div><label class="field-label">單位名稱</label><input type="text" id="manageNewSite" class="input-ui t-meta" /></div>
          <div><label class="field-label">@負責人</label><input type="text" id="manageNewAssignee" class="input-ui t-meta" /></div>
          <div style="display:flex;justify-content:flex-end;">
            <button type="button" onclick="submitRenameSite()" class="btn-orange">儲存修改</button>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:6px;">
          <div style="font-weight:700;font-size:12.5px;">2. 合併去現有地址（需輸入 "Y"）</div>
          <div class="t-meta muted" id="mergeHintText"></div>
          <select id="manageMergeTarget" class="select-ui t-meta"></select>
          <div style="display:flex;justify-content:flex-end;">
            <button type="button" onclick="submitMergeSite()" class="btn-orange">合併</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="followupModal" class="modal-backdrop hidden no-print">
    <div class="modal-box modal-sm">
      <div class="modal-head">
        <span class="t-site" id="followupModalTitle">留言</span>
        <button type="button" onclick="closeFollowupModal()" class="btn-link">關閉 <span class="btn-sym">✕</span></button>
      </div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:8px;">
        <div id="followupTargetTitle" class="t-meta" style="font-weight:600;background:#F8FAFC;padding:5px 7px;"></div>
        <div id="followupHistoryList" style="max-height:150px;overflow-y:auto;background:#F8FAFC;padding:5px;"></div>
        <div><label class="field-label">名字 *</label><input type="text" id="fuAuthor" class="input-ui t-meta" /></div>
        <div><label class="field-label">留言 *</label><textarea id="fuMessage" rows="2" class="input-ui"></textarea></div>
      </div>
      <div class="modal-foot">
        <button type="button" onclick="closeFollowupModal()" class="btn-secondary">取消</button>
        <button type="button" id="submitFollowupBtn" onclick="submitFollowupLog()" class="btn-orange">發送</button>
      </div>
    </div>
  </div>

  <div id="shareModal" class="modal-backdrop hidden no-print">
    <div class="modal-box modal-sm">
      <div class="modal-head">
        <span class="t-site" id="shareModalTitle">分享</span>
        <button type="button" onclick="closeShareModal()" class="btn-link">關閉 <span class="btn-sym">✕</span></button>
      </div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:10px;" id="shareModalBody"></div>
    </div>
  </div>

  <div id="toast" class="hidden no-print"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCSRfZdAVh8ADPNtayW5lyDtmE0xDsJXNg",
      authDomain: "gen-lang-client-0208380044.firebaseapp.com",
      databaseURL: "https://gen-lang-client-0208380044-default-rtdb.firebaseio.com",
      projectId: "gen-lang-client-0208380044",
      storageBucket: "gen-lang-client-0208380044.firebasestorage.app",
      messagingSenderId: "17077391191",
      appId: "1:17077391191:web:cb936dd1bfe98b2f3d7812"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    try {
      if (firebase.firestore.persistentLocalCache && firebase.firestore.persistentMultipleTabManager) {
        db.settings({
          localCache: firebase.firestore.persistentLocalCache({
            tabManager: firebase.firestore.persistentMultipleTabManager()
          })
        });
      } else {
        db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
      }
    } catch (_) {
      db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    }

    const COLLECTION_NAME = 'artisan_qc_reports';
    const PHOTOS_COL = 'artisan_qc_photos';
    const PASSCODE = '8888';
    const PASSCODE_STORAGE_KEY = 'artisan_qc_unlocked_v1';
    const WEEKDAYS_HK = ['日', '一', '二', '三', '四', '五', '六'];
    const SCHEDULE_PAGE_SIZE = 10;

    const urlParams = new URLSearchParams(window.location.search);
    let activeMainView = urlParams.get('tab') === 'reports' ? 'reports' : 'schedule';
    let reports = [];
    let expandedSites = new Set();
    let siteChipsExpanded = true;
    let expandedDetailIds = new Set();
    let inlineEditId = null, editingReportId = null, followupTargetId = null;
    let managingOldSite = '';

    let schedulePage = 0;
    let scheduleRangeStart = '';
    let scheduleRangeEnd = '';
    let showScheduleRangeBox = false;

    let draftDocs = [], draftPhotos = [], activePhotoIndex = -1, originalPhotoIds = [];
    let currentTool = 'move', currentColor = 'rgba(234,88,12,0.95)';
    let currentFontScale = 0.026;
    let selectedShapeIdx = -1;
    let isDrawing = false, isDraggingShape = false, startX = 0, startY = 0, lastDragX = 0, lastDragY = 0;
    let currentStroke = [], baseImageObj = null;

    const canvas = document.getElementById('annotCanvas');
    const ctx = canvas.getContext('2d');

    function syncAllButtonState() {
      const sel = document.getElementById('siteFilter');
      const btnAll = document.getElementById('btnAllSites');
      const isAll = !sel || sel.value === 'ALL';
      if (btnAll) btnAll.classList.toggle('active', isAll);
    }

    function clickAllSitesBtn() {
      const sel = document.getElementById('siteFilter');
      if (sel) sel.value = 'ALL';
      schedulePage = 0;
      syncAllButtonState();
      renderCurrentView();
      showToast('已顯示全部');
    }

    function isUnlocked() {
      return localStorage.getItem(PASSCODE_STORAGE_KEY) === '1';
    }

    function checkPasscodeGate() {
      const gate = document.getElementById('passcodeGate');
      const lockBtn = document.getElementById('lockSystemBtn');
      if (isUnlocked()) {
        gate.classList.add('hidden');
        lockBtn.classList.remove('hidden');
        return true;
      }
      lockBtn.classList.add('hidden');
      gate.classList.remove('hidden');
      setTimeout(() => document.getElementById('passcodeInput')?.focus(), 50);
      return false;
    }

    function unlockSystem() {
      const val = (document.getElementById('passcodeInput')?.value || '').trim();
      if (val !== PASSCODE) return showToast('密碼唔啱');
      localStorage.setItem(PASSCODE_STORAGE_KEY, '1');
      document.getElementById('passcodeInput').value = '';
      checkPasscodeGate();
      showToast('已解鎖');
    }

    function lockSystem() {
      localStorage.removeItem(PASSCODE_STORAGE_KEY);
      checkPasscodeGate();
      showToast('已鎖定');
    }

    function isFutureDiaryEntry(r) {
      return Boolean(r?.isFutureDiary || r?.isUpcoming);
    }

    function isUndatedEntry(r) {
      const d = (r?.date || '').trim();
      return !d || d === '未定日期';
    }

    function toggleScheduleDetail(id) {
      if (!id) return;
      if (expandedDetailIds.has(id)) {
        expandedDetailIds.delete(id);
        if (inlineEditId === id) inlineEditId = null;
      } else {
        expandedDetailIds.add(id);
      }
      renderCurrentView();
    }

    function toggleSiteChipsCollapse() {
      siteChipsExpanded = !siteChipsExpanded;
      renderReportList();
    }

    async function convertFutureDiaryToFormal(id) {
      const r = reports.find(x => x.id === id);
      if (!r) return;
      if (!hasValidTimeAndSite(r)) return showToast('需有地址同日期');
      await db.collection(COLLECTION_NAME).doc(id).update({
        isFutureDiary: false,

    function getAllUniqueSites() {

    function scoreSiteSimilarity(candidate, query) {
      const c = candidate.toLowerCase().replace(/\s+/g, '');
      const q = query.toLowerCase().replace(/\s+/g, '');
      if (!q) return 1;
      if (c === q) return 100;
      if (c.includes(q) || q.includes(c)) return 80;
      const tokens = query.toLowerCase().split(/[\s,，/／\-_]+/).filter(Boolean);
      let score = 0;
      tokens.forEach(t => { if (c.includes(t)) score += 25; });
      let charHits = 0;
      for (const ch of new Set(q.split(''))) {
        if (ch.trim() && c.includes(ch)) charHits++;
      }
      const ratio = charHits / Math.max(2, q.length);
      if (ratio >= 0.45) score += Math.round(ratio * 40);
      return score;
    }

    function onFieldSiteInput() {
      const box = document.getElementById('siteSuggestBox');
      if (!box) return;
      const val = (document.getElementById('fieldSite').value || '').trim();
      const allSites = getAllUniqueSites();
      if (!allSites.length) { box.classList.add('hidden'); return; }

      let matched = [];
      if (!val) {
        matched = allSites.slice(0, 12);
      } else {
        matched = allSites
          .map(s => ({ site: s, score: scoreSiteSimilarity(s, val) }))
          .filter(x => x.score >= 18)
          .sort((a, b) => b.score - a.score)
          .slice(0, 10)
          .map(x => x.site);
      }

      if (!matched.length || (matched.length === 1 && matched[0] === val)) {
        box.classList.add('hidden');
        return;
      }

      box.innerHTML = `
        <div class="site-suggest-title">現有地址：</div>
        <div class="site-suggest-list">
          ${matched.map(s => `<button type="button" onclick="pickSuggestedSite('${escapeAttr(s)}')" class="site-suggest-item">${escapeHtml(s)}</button>`).join('')}

      box.classList.remove('hidden');
    }
