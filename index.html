<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>築匠設計 ARTISAN STUDIO — QC 報告</title>
  <link rel="icon" href="data:," />
  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);
      if (p.get('view') === 'public' || p.get('view') === 'brief' || p.get('reportId') || p.get('site')) {
        window.location.replace('view.html' + window.location.search);
      }
    })();
  </script>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="report.css" />
  <style>
    .brand-title-strong {
      color: #FFFFFF;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .brand-sync-badge {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.9);
      background: rgba(15, 23, 42, 0.22);
      padding: 2px 7px;
      border-radius: 3px;
      font-weight: 600;
    }

    .future-tag-pill {
      display: inline-block;
      background: rgba(234, 88, 12, 0.12);
      color: #C2410C;
      border: none;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.35;
      vertical-align: middle;
    }
    .future-diary-box {
      background: #FFFFFF;
      border-left: 3px solid #EA580C;
      margin-top: 6px;
      overflow: hidden;
    }
    .future-diary-head {
      background: #FFFBEB;
      border-bottom: 1px solid #FDE68A;
      padding: 5px 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .future-diary-body {
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .detail-toggle-btn {
      background: transparent;
      color: #64748B;
      border: none;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .detail-toggle-btn:hover {
      color: #0F172A;
      background: rgba(15, 23, 42, 0.06);
    }
    .detail-toggle-btn.is-open {
      background: rgba(234, 88, 12, 0.12);
      color: #C2410C;
    }
    .schedule-detail-panel {
      margin-top: 5px;
      padding: 6px 9px;
      background: #F8FAFC;
      border-left: 2px solid #CBD5E1;
      border-radius: 2px;
      font-size: 12.5px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .site-quick-bar {
      background: #FFFFFF;
      border-left: 3px solid #CBD5E1;
      padding: 6px 10px;
      margin-top: 6px;
    }
    .site-quick-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .site-chip-btn {
      background: transparent;
      color: #475569;
      border: none;
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .site-chip-btn:hover {
      color: #0F172A;
      background: rgba(15, 23, 42, 0.06);
    }
    .site-chip-btn.active {
      background: rgba(234, 88, 12, 0.14);
      color: #C2410C;
      font-weight: 800;
    }

    /* 7 & 8 & 10: 操作掣靠左貼近標籤／檔名，分享與刪除放最右 */
    .unit-header-row,
    .record-header-row,
    .attachment-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .unit-left-cluster,
    .record-left-cluster,
    .attachment-left-cluster {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .record-right-actions,
    .attachment-right-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    .section-share-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <!-- 1. 頂欄保留公司名並清晰突出，同時保留同步／快取／連線狀態 -->
  <header class="topbar no-print">
    <div class="container row-between" style="padding-bottom:0;">
      <div class="row" style="gap:8px;">
        <span class="t-site brand-title-strong">築匠設計 ARTISAN STUDIO</span>
        <span id="syncStatusBadge" class="brand-sync-badge">連線正常 · 已同步</span>
      </div>
      <div class="row" id="headerQuickActions">
        <button type="button" onclick="lockSystem()" id="lockSystemBtn" class="btn-secondary hidden">鎖定</button>
      </div>
    </div>
  </header>

  <div id="passcodeGate" class="modal-backdrop hidden no-print">
    <div class="modal-box modal-sm">
      <div class="modal-head">
        <span class="t-site">輸入密碼解鎖</span>
      </div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:8px;">
        <div class="t-meta muted">輸入密碼：</div>
        <input type="password" id="passcodeInput" onkeydown="if(event.key==='Enter')unlockSystem()" class="input-ui" placeholder="密碼" />
      </div>
      <div class="modal-foot">
        <button type="button" onclick="unlockSystem()" class="btn-orange">解鎖</button>
      </div>
    </div>
  </div>

  <main class="container">
    <!-- 2 & 3: 預設「全部單位」、移除「全」掣、改為「＋即將新單位」 -->
    <div id="filterBar" class="filter-zone no-print">
      <div class="view-switch-bar" role="tablist">
        <button type="button" id="tabSchedule" onclick="switchMainView('schedule')" class="view-tab-btn active">時間表</button>
        <button type="button" id="tabReports" onclick="switchMainView('reports')" class="view-tab-btn">工作紀錄</button>
      </div>
      <button type="button" onclick="openEditor()" class="btn-orange" title="新增即將新單位"><span class="btn-sym">＋</span>即將新單位</button>
      <select id="siteFilter" onchange="onSiteFilterChange()" class="select-site-lg" aria-label="選擇單位">
        <option value="ALL">全部單位</option>
      </select>
      <div class="search-eight-wrap">
        <input type="text" id="searchInput" oninput="onSearchInput()" class="search-eight-input" placeholder="搜尋..." />
        <span class="search-lens-icon" aria-hidden="true">🔍</span>
      </div>
    </div>

    <div id="reportListContainer">
      <div style="background:#FFF;padding:16px;margin-top:8px;text-align:center;" class="muted">載入中...</div>
    </div>
  </main>

  <!-- 編輯／新增視窗（6: 開始 + 工時小數自動算完工時，保留上午/下午/:00/:30與原有輸入方式） -->
  <div id="editorModal" class="modal-backdrop hidden no-print">
    <div class="modal-box">
      <div class="modal-head">
        <span class="t-site" id="editorModalTitle">＋即將新單位</span>
        <button type="button" onclick="closeEditor()" class="btn-link">關閉 <span class="btn-sym">✕</span></button>
      </div>
      <div class="modal-body" style="padding:0;">
        <div class="editor-band band-sec-1">
          <div class="editor-band-title">1. 單位與時間</div>
          <div class="grid-3">
            <div>
              <label class="field-label">屋苑 / 單位 *</label>
              <input type="text" id="fieldSite" autocomplete="off" oninput="onFieldSiteInput()" onfocus="onFieldSiteInput()" class="input-ui" />
              <div id="siteSuggestBox" class="site-suggest-box hidden"></div>
            </div>
            <div><label class="field-label">@負責人</label><input type="text" id="fieldAssignee" class="input-ui" /></div>
            <div><label class="field-label">標題 *</label><input type="text" id="fieldTitle" class="input-ui" /></div>
          </div>
          <div class="grid-2" style="margin-top:6px;">
            <div><label class="field-label">日期（留空＝未定日期）</label><input type="date" id="fieldDate" class="input-ui" /></div>
            <div>
              <div class="row-between" style="margin-bottom:3px;">
                <label class="field-label" style="margin-bottom:0;">開始 / 完成或工時</label>
                <div class="row" style="gap:4px;">
                  <span class="mini-pair">
                    <button type="button" onmousedown="event.preventDefault()" onclick="setMeridiemForStartInput('fieldTimeStart', 'AM')" class="mini-pair-btn">上午</button>
                    <button type="button" onmousedown="event.preventDefault()" onclick="setMeridiemForStartInput('fieldTimeStart', 'PM')" class="mini-pair-btn">下午</button>
                  </span>
                  <span class="mini-pair">
                    <button type="button" onmousedown="event.preventDefault()" onclick="setMinuteForStartInput('fieldTimeStart', '00')" class="mini-pair-btn">:00</button>
                    <button type="button" onmousedown="event.preventDefault()" onclick="setMinuteForStartInput('fieldTimeStart', '30')" class="mini-pair-btn">:30</button>
                  </span>
                </div>
              </div>
              <div class="grid-2">
                <input type="time" id="fieldTimeStart" onchange="syncEndTimeFromDuration()" class="input-ui" />
                <input type="text" id="fieldTimeEnd" onblur="syncEndTimeFromDuration()" class="input-ui" placeholder="完成 / 工時小數（如 1.5）" />
              </div>
              <input type="hidden" id="fieldPeriodLabel" value="" />
            </div>
          </div>
          <div style="margin-top:8px;">
            <label class="row" style="gap:6px;cursor:pointer;user-select:none;">
              <input type="checkbox" id="fieldIsFutureDiary" style="width:15px;height:15px;accent-color:#EA580C;" />
              <span class="t-meta" style="font-weight:700;color:#C2410C;">即將新單位</span>
            </label>
          </div>
        </div>

        <div class="editor-band band-sec-2">
          <div class="editor-band-title">2. 內容與文件</div>
          <div style="margin-bottom:6px;"><label class="field-label">內容</label><textarea id="fieldSummary" rows="3" class="input-ui"></textarea></div>
          <div style="margin-bottom:6px;"><label class="field-label">跟進</label><input type="text" id="fieldFollowup" class="input-ui" /></div>
          <div style="padding-top:6px;border-top:1px solid #E2E8F0;">
            <div class="row-between" style="margin-bottom:5px;">
              <span class="t-meta" style="font-weight:600;">附件</span>
              <div class="row">
                <button type="button" onclick="openAlbumFromEditor()" class="btn-link blue"><span class="btn-sym">📸</span>截圖</button>
                <label class="btn-secondary" style="cursor:pointer;"><span class="btn-sym">＋</span><span>PDF</span><input type="file" accept="application/pdf" multiple class="hidden" onchange="handlePdfUpload(event)" /></label>
                <button type="button" onclick="addDocRow()" class="btn-secondary"><span class="btn-sym">＋</span>連結</button>
              </div>
            </div>
            <div id="docRowsContainer" style="display:flex;flex-direction:column;gap:5px;"></div>
          </div>
        </div>

        <div class="editor-band band-sec-3">
          <div class="row-between" style="margin-bottom:6px;">
            <div>
              <div class="editor-band-title" style="margin-bottom:1px;">3. 相片與標記</div>
              <span id="photoCountHint" class="t-meta muted"></span>
            </div>
            <div class="row">
              <label class="btn-orange" style="cursor:pointer;"><span class="btn-sym">📷</span><span>拍照</span><input type="file" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoUpload(event)" /></label>
              <label class="btn-secondary" style="cursor:pointer;"><span class="btn-sym">＋</span><span>相片</span><input type="file" accept="image/*" multiple class="hidden" onchange="handlePhotoUpload(event)" /></label>
            </div>
          </div>
          <div id="photoGridContainer" class="photo-grid"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" onclick="closeEditor()" class="btn-secondary">取消</button>
        <button type="button" onclick="saveReport()" id="saveReportBtn" class="btn-orange">儲存</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    /* 6. 開始時間 + 工時小數推算完工時間（若輸入純小數工時如 1.5 / 2，自動換算 HH:MM；若已填 HH:MM 或文字則保留） */
    function parseDurationDecimal(val) {
      if (val == null) return null;
      var s = String(val).trim();
      if (!/^\d+(\.\d+)?$/.test(s)) return null;
      var num = parseFloat(s);
      if (isNaN(num) || num <= 0 || num > 48) return null;
      return num;
    }

    function computeEndTimeFromStartAndHours(startHHMM, hoursDecimal) {
      if (!startHHMM || !/^\d{2}:\d{2}$/.test(startHHMM)) return '';
      var parts = startHHMM.split(':');
      var startMins = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
      var addMins = Math.round(hoursDecimal * 60);
      var endMins = (startMins + addMins) % (24 * 60);
      var eh = String(Math.floor(endMins / 60)).padStart(2, '0');
      var em = String(endMins % 60).padStart(2, '0');
      return eh + ':' + em;
    }

    function syncEndTimeFromDuration() {
      var startEl = document.getElementById('fieldTimeStart');
      var endEl = document.getElementById('fieldTimeEnd');
      if (!startEl || !endEl) return;
      var hours = parseDurationDecimal(endEl.value);
      if (hours !== null && startEl.value) {
        var computed = computeEndTimeFromStartAndHours(startEl.value, hours);
        if (computed) {
          endEl.value = computed;
        }
      }
    }

    function setMeridiemForStartInput(inputId, meridiem) {
      var el = document.getElementById(inputId);
      if (!el) return;
      var val = el.value || '09:00';
      var parts = val.split(':');
      var h = parseInt(parts[0] || '9', 10);
      var m = parts[1] || '00';
      if (meridiem === 'AM' && h >= 12) h -= 12;
      if (meridiem === 'PM' && h < 12) h += 12;
      el.value = String(h).padStart(2, '0') + ':' + m;
      syncEndTimeFromDuration();
    }

    function setMinuteForStartInput(inputId, minuteStr) {
      var el = document.getElementById(inputId);
      if (!el) return;
      var val = el.value || '09:00';
      var parts = val.split(':');
      var h = parts[0] || '09';
      el.value = String(h).padStart(2, '0') + ':' + minuteStr;
      syncEndTimeFromDuration();
    }

    /* 4 & 5: 上下區皆有「↗ 分享」，按所選區域分享；時段篩選列內亦備「套用、重設、↗ 分享」 */
    function shareSelectedArea(areaType) {
      var params = new URLSearchParams();
      params.set('view', 'public');
      var siteVal = (document.getElementById('siteFilter') && document.getElementById('siteFilter').value) || 'ALL';
      if (siteVal && siteVal !== 'ALL') params.set('site', siteVal);

      if (areaType === 'unscheduled') {
        params.set('scope', 'unscheduled');
      } else {
        var fromEl = document.getElementById('periodFrom');
        var toEl = document.getElementById('periodTo');
        if (fromEl && fromEl.value) params.set('from', fromEl.value);
        if (toEl && toEl.value) params.set('to', toEl.value);
        params.set('scope', 'period');
      }

      var shareUrl = new URL('view.html?' + params.toString(), window.location.href).href;
      if (typeof copyShareLink === 'function') {
        copyShareLink(shareUrl);
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).catch(function () {});
      }
    }

    /* 12: 單位列「修繕」掣確保正常開啟該單位修繕頁／模組 */
    function openUnitRepair(siteName) {
      var encoded = encodeURIComponent(siteName || '');
      if (typeof window.openRepairModal === 'function') {
        window.openRepairModal(siteName);
        return;
      }
      window.location.href = 'repair.html?site=' + encoded;
    }

    /* 13: 相簿（ALBUM）改制下一步掛載點（保留 album.html?view=public 並於頂欄顯示公司名） */
    var ALBUM_NEXT_PHASE_CONFIG = {
      status: 'pending_confirmation',
      publicPage: 'album.html',
      brandName: '築匠設計 ARTISAN STUDIO'
    };

    /* 7, 8, 9, 10: 渲染強化掛載 — 單位操作掣靠左、紀錄操作掣靠左且分享/刪除在最右、移除「快改」、附件操作掣靠左 */
    function enhanceLayoutActions() {
      var container = document.getElementById('reportListContainer');
      if (!container) return;

      // 移除快改掣（第 9 項）
      container.querySelectorAll('button, a').forEach(function (el) {
        if ((el.textContent || '').trim() === '快改') {
          el.remove();
        }
      });

      // 修復單位列「修繕」掣綁定（第 12 項）
      container.querySelectorAll('button, a').forEach(function (el) {
        if ((el.textContent || '').trim() === '修繕') {
          el.addEventListener('click', function (ev) {
            var card = el.closest('[data-site]');
            var site = (card && card.getAttribute('data-site')) || '';
            if (!site && card) {
              var titleEl = card.querySelector('.t-site, strong, h3, h4');
              if (titleEl) site = (titleEl.textContent || '').trim().split(/\s+/)[0];
            }
            if (site && !el.getAttribute('onclick')) {
              ev.preventDefault();
              openUnitRepair(site);
            }
          });
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      enhanceLayoutActions();
      var target = document.getElementById('reportListContainer');
      if (target && window.MutationObserver) {
        new MutationObserver(function () {
          enhanceLayoutActions();
        }).observe(target, { childList: true, subtree: true });
      }
    });
  </script>
</body>
</html>
