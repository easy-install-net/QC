<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>築匠設計 ARTISAN STUDIO — QC 報告</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="report.css" />
  <style>
    /* 即將標籤與分區（無邊框，避免同輸入框撈亂） */
    .future-tag-pill {
      display: inline-block;
      background: rgba(234, 88, 12, 0.12);
      color: #C2410C;
      border: none;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.35;
      vertical-align: middle;
    }
    .future-diary-box {
      background: #FFFFFF;
      border-left: 3px solid #EA580C;
      margin-top: 8px;
      overflow: hidden;
    }
    .future-diary-head {
      background: #FFFBEB;
      border-bottom: 1px solid #FDE68A;
      padding: 5px 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .future-diary-body {
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 時間表詳細展開掣與內容面板（無框小粗字） */
    .detail-toggle-btn {
      background: transparent;
      color: #64748B;
      border: none;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .detail-toggle-btn:hover {
      color: #0F172A;
      background: rgba(15, 23, 42, 0.06);
    }
    .detail-toggle-btn.is-open {
      background: rgba(234, 88, 12, 0.12);
      color: #C2410C;
    }
    .schedule-detail-panel {
      margin-top: 5px;
      padding: 6px 9px;
      background: #F8FAFC;
      border-left: 2px solid #CBD5E1;
      border-radius: 2px;
      font-size: 12.5px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* 工作紀錄頂部地址快選列（無框小粗字） */
    .site-quick-bar {
      background: #FFFFFF;
      border-left: 3px solid #CBD5E1;
      padding: 6px 10px;
      margin-top: 6px;
    }
    .site-quick-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .site-quick-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .site-chip-btn {
      background: transparent;
      color: #475569;
      border: none;
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .site-chip-btn:hover {
      color: #0F172A;
      background: rgba(15, 23, 42, 0.06);
    }
    .site-chip-btn.active {
      background: rgba(234, 88, 12, 0.14);
      color: #C2410C;
      font-weight: 800;
    }

    /* 「全」掣無框，與有框下拉選單清晰區分 */
    .all-filter-split {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: 1 1 auto;
      min-width: 0;
    }
    .all-btn {
      padding: 0 7px;
      height: 26px;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: #475569;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
    }
    .all-btn:hover {
      color: #0F172A;
      background: rgba(15, 23, 42, 0.06);
    }
    .all-btn.active {
      background: rgba(234, 88, 12, 0.14);
      color: #C2410C;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <header class="topbar no-print">
    <div class="container row-between" style="padding-bottom:0;">
      <div class="row">
        <span class="t-site" style="color:#FFFFFF;">築匠設計 ARTISAN STUDIO</span>
        <span class="topbar-sep hidden" id="headerSubSep">|</span>
        <span class="topbar-sub hidden" id="headerSubTitle"></span>
        <span id="syncBadge" class="sync-ok">連線中</span>
      </div>
      <div class="row" id="headerQuickActions">
        <button type="button" onclick="lockSystem()" id="lockSystemBtn" class="btn-secondary hidden">鎖定</button>
        <button type="button" onclick="window.print()" class="btn-secondary hidden" id="standalonePrintBtn">列印 / PDF</button>
      </div>
    </div>
  </header>

  <div id="passcodeGate" class="modal-backdrop hidden no-print">
    <div class="modal-box modal-sm">
      <div class="modal-head">
        <span class="t-site">輸入密碼解鎖</span>
      </div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:8px;">
        <div class="t-meta muted">輸入密碼：</div>
        <input type="password" id="passcodeInput" onkeydown="if(event.key==='Enter')unlockSystem()" class="input-ui" placeholder="密碼" />
      </div>
      <div class="modal-foot">
        <button type="button" onclick="unlockSystem()" class="btn-orange">解鎖</button>
      </div>
    </div>
  </div>

  <main class="container">
    <div id="filterBar" class="filter-zone no-print">
      <div class="view-switch-bar" role="tablist">
        <button type="button" id="tabSchedule" onclick="switchMainView('schedule')" class="view-tab-btn active">時間表</button>
        <button type="button" id="tabReports" onclick="switchMainView('reports')" class="view-tab-btn">工作紀錄</button>
      </div>
      <button type="button" onclick="openEditor()" class="btn-orange" title="新增即將或工作紀錄"><span class="btn-sym">＋</span>即將</button>
      <div class="all-filter-split">
        <button type="button" id="btnAllSites" onclick="clickAllSitesBtn()" class="all-btn active">全</button>
        <select id="siteFilter" onchange="onSiteFilterChange()" class="select-site-lg" aria-label="選擇單位">
          <option value="ALL">-- 選擇單位 --</option>
        </select>
      </div>
      <div class="search-eight-wrap">
        <input type="text" id="searchInput" oninput="onSearchInput()" class="search-eight-input" placeholder="搜尋..." />
        <span class="search-lens-icon" aria-hidden="true">🔍</span>
      </div>
    </div>

    <div id="reportListContainer">
      <div style="background:#FFF;padding:16px;margin-top:8px;text-align:center;" class="muted">載入中...</div>
    </div>
  </main>

  <div id="editorModal" class="modal-backdrop hidden no-print">
    <div class="modal-box">
      <div class="modal-head">
        <span class="t-site" id="editorModalTitle">即將</span>
        <button type="button" onclick="closeEditor()" class="btn-link">關閉 <span class="btn-sym">✕</span></button>
      </div>
      <div class="modal-body" style="padding:0;">
        <div class="editor-band band-sec-1">
          <div class="editor-band-title">1. 單位與時間</div>
          <div class="grid-3">
            <div>
              <label class="field-label">屋苑 / 單位 *</label>
              <input type="text" id="fieldSite" autocomplete="off" oninput="onFieldSiteInput()" onfocus="onFieldSiteInput()" class="input-ui" />
              <div id="siteSuggestBox" class="site-suggest-box hidden"></div>
            </div>
            <div><label class="field-label">@負責人</label><input type="text" id="fieldAssignee" class="input-ui" /></div>
            <div><label class="field-label">標題 *</label><input type="text" id="fieldTitle" class="input-ui" /></div>
          </div>
          <div class="grid-2" style="margin-top:6px;">
            <div><label class="field-label">日期</label><input type="date" id="fieldDate" class="input-ui" /></div>
            <div>
              <div class="row-between" style="margin-bottom:3px;">
                <label class="field-label" style="margin-bottom:0;">開始 / 完成或工時</label>
                <div class="row" style="gap:4px;">
                  <span class="mini-pair">
                    <button type="button" onmousedown="event.preventDefault()" onclick="setMeridiemForStartInput('fieldTimeStart', 'AM')" class="mini-pair-btn">上午</button>
                    <button type="button" onmousedown="event.preventDefault()" onclick="setMeridiemForStartInput('fieldTimeStart', 'PM')" class="mini-pair-btn">下午</button>
                  </span>
                  <span class="mini-pair">
                    <button type="button" onmousedown="event.preventDefault()" onclick="setMinuteForStartInput('fieldTimeStart', '00')" class="mini-pair-btn">:00</button>
                    <button type="button" onmousedown="event.preventDefault()" onclick="setMinuteForStartInput('fieldTimeStart', '30')" class="mini-pair-btn">:30</button>
                  </span>
                </div>
              </div>
              <div class="grid-2">
                <input type="time" id="fieldTimeStart" class="input-ui" />
                <input type="text" id="fieldTimeEnd" class="input-ui" placeholder="完成 / 小數" />
              </div>
              <input type="hidden" id="fieldPeriodLabel" value="" />
            </div>
          </div>
          <div style="margin-top:8px;">
            <label class="row" style="gap:6px;cursor:pointer;user-select:none;">
              <input type="checkbox" id="fieldIsFutureDiary" style="width:15px;height:15px;accent-color:#EA580C;" />
              <span class="t-meta" style="font-weight:700;color:#C2410C;">即將</span>
            </label>
          </div>
        </div>

        <div class="editor-band band-sec-2">
          <div class="editor-band-title">2. 內容與文件</div>
          <div style="margin-bottom:6px;"><label class="field-label">內容</label><textarea id="fieldSummary" rows="3" class="input-ui"></textarea></div>
          <div style="margin-bottom:6px;"><label class="field-label">跟進</label><input type="text" id="fieldFollowup" class="input-ui" /></div>
          <div style="padding-top:6px;border-top:1px solid #E2E8F0;">
            <div class="row-between" style="margin-bottom:5px;">
              <span class="t-meta" style="font-weight:600;">附件</span>
              <div class="row">
                <button type="button" onclick="openAlbumFromEditor()" class="btn-link blue"><span class="btn-sym">📸</span>截圖</button>
                <label class="btn-secondary" style="cursor:pointer;"><span class="btn-sym">＋</span><span>PDF</span><input type="file" accept="application/pdf" multiple class="hidden" onchange="handlePdfUpload(event)" /></label>
                <button type="button" onclick="addDocRow()" class="btn-secondary"><span class="btn-sym">＋</span>連結</button>
              </div>
            </div>
            <div id="docRowsContainer" style="display:flex;flex-direction:column;gap:5px;"></div>
          </div>
        </div>

        <div class="editor-band band-sec-3">
          <div class="row-between" style="margin-bottom:6px;">
            <div>
              <div class="editor-band-title" style="margin-bottom:1px;">3. 相片與標記</div>
              <span id="photoCountHint" class="t-meta muted"></span>
            </div>
            <div class="row">
              <label class="btn-orange" style="cursor:pointer;"><span class="btn-sym">📷</span><span>拍照</span><input type="file" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoUpload(event)" /></label>
              <label class="btn-secondary" style="cursor:pointer;"><span class="btn-sym">🖼</span><span>上傳</span><input type="file" accept="image/*" multiple class="hidden" onchange="handlePhotoUpload(event)" /></label>
              <button type="button" onclick="createBlankSketch()" class="btn-secondary"><span class="btn-sym">✎</span>草圖</button>
            </div>
          </div>

          <div id="annotationWorkspace" class="hidden" style="background:#FFF;padding:6px;border-top:1px solid #CBD5E1;margin-bottom:6px;">
            <div class="row-between" style="margin-bottom:5px;">
              <div class="row">
                <button type="button" onclick="setTool('move')" id="tool-move" class="btn-secondary btn-active"><span class="btn-sym">✋</span>移動</button>
                <button type="button" onclick="setTool('freehand')" id="tool-freehand" class="btn-secondary"><span class="btn-sym">✎</span>手繪</button>
                <button type="button" onclick="setTool('circle')" id="tool-circle" class="btn-secondary"><span class="btn-sym">◯</span>線圈</button>
                <button type="button" onclick="setTool('arrow')" id="tool-arrow" class="btn-secondary"><span class="btn-sym">↗</span>箭咀</button>
                <button type="button" onclick="setTool('text')" id="tool-text" class="btn-secondary"><span class="btn-sym">T</span>打字</button>
                <select id="fontSizeSelect" onchange="onFontSizeChange()" class="select-ui" style="width:auto;">
                  <option value="0.018">字體：細</option>
                  <option value="0.026" selected>字體：中</option>
                  <option value="0.036">字體：大</option>
                  <option value="0.048">字體：特大</option>
                </select>
              </div>
              <div class="row">
                <button type="button" onclick="setColor('rgba(234,88,12,0.95)', this)" class="color-dot active-color" style="background:#EA580C;"></button>
                <button type="button" onclick="setColor('rgba(220,38,38,0.92)', this)" class="color-dot" style="background:#DC2626;"></button>
                <button type="button" onclick="setColor('rgba(37,99,235,0.92)', this)" class="color-dot" style="background:#2563EB;"></button>
                <button type="button" onclick="setColor('rgba(15,23,42,0.92)', this)" class="color-dot" style="background:#0F172A;"></button>
                <button type="button" id="delSelectedShapeBtn" onclick="deleteSelectedShape()" class="btn-danger-outline hidden"><span class="btn-sym">✕</span>刪選取</button>
                <button type="button" onclick="undoShape()" class="btn-secondary"><span class="btn-sym">↶</span>復原</button>
                <button type="button" onclick="clearShapes()" class="btn-danger-outline">全清</button>
              </div>
            </div>

            <div id="textInputBar" class="hidden" style="margin-bottom:5px;">
              <input type="text" id="canvasTextInput" oninput="onTextInputLiveEdit()" class="input-ui t-meta" placeholder="輸入標記文字，再點畫布落字" />
            </div>

            <div class="canvas-wrapper"><canvas id="annotCanvas"></canvas></div>
            <input type="text" id="currentPhotoNote" oninput="syncCurrentPhotoNote()" class="input-ui t-meta" style="margin-top:5px;" placeholder="此張相片備註..." />
          </div>

          <div id="photoThumbList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" onclick="closeEditor()" class="btn-secondary">取消</button>
        <button type="button" id="saveReportBtn" onclick="saveReport()" class="btn-orange">儲存</button>
      </div>
    </div>
  </div>

  <div id="siteManageModal" class="modal-backdrop hidden no-print">
    <div class="modal-box modal-sm">
      <div class="modal-head">
        <span class="t-site">單位改名 / 合併</span>
        <button type="button" onclick="closeSiteManageModal()" class="btn-link">關閉 <span class="btn-sym">✕</span></button>
      </div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:10px;">
        <div style="padding-bottom:8px;border-bottom:1px solid #CBD5E1;display:flex;flex-direction:column;gap:6px;">
          <div style="font-weight:700;font-size:12.5px;">1. 批量修改名稱 / @負責人</div>
          <div><label class="field-label">單位名稱</label><input type="text" id="manageNewSite" class="input-ui t-meta" /></div>
          <div><label class="field-label">@負責人</label><input type="text" id="manageNewAssignee" class="input-ui t-meta" /></div>
          <div style="display:flex;justify-content:flex-end;">
            <button type="button" onclick="submitRenameSite()" class="btn-orange">儲存修改</button>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:6px;">
          <div style="font-weight:700;font-size:12.5px;">2. 合併去現有地址（需輸入 "Y"）</div>
          <div class="t-meta muted" id="mergeHintText"></div>
          <select id="manageMergeTarget" class="select-ui t-meta"></select>
          <div style="display:flex;justify-content:flex-end;">
            <button type="button" onclick="submitMergeSite()" class="btn-orange">合併</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="followupModal" class="modal-backdrop hidden no-print">
    <div class="modal-box modal-sm">
      <div class="modal-head">
        <span class="t-site" id="followupModalTitle">留言</span>
        <button type="button" onclick="closeFollowupModal()" class="btn-link">關閉 <span class="btn-sym">✕</span></button>
      </div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:8px;">
        <div id="followupTargetTitle" class="t-meta" style="font-weight:600;background:#F8FAFC;padding:5px 7px;"></div>
        <div id="followupHistoryList" style="max-height:150px;overflow-y:auto;background:#F8FAFC;padding:5px;"></div>
        <div><label class="field-label">名字 *</label><input type="text" id="fuAuthor" class="input-ui t-meta" /></div>
        <div><label class="field-label">留言 *</label><textarea id="fuMessage" rows="2" class="input-ui"></textarea></div>
      </div>
      <div class="modal-foot">
        <button type="button" onclick="closeFollowupModal()" class="btn-secondary">取消</button>
        <button type="button" id="submitFollowupBtn" onclick="submitFollowupLog()" class="btn-orange">發送</button>
      </div>
    </div>
  </div>

  <div id="shareModal" class="modal-backdrop hidden no-print">
    <div class="modal-box modal-sm">
      <div class="modal-head">
        <span class="t-site" id="shareModalTitle">分享</span>
        <button type="button" onclick="closeShareModal()" class="btn-link">關閉 <span class="btn-sym">✕</span></button>
      </div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:10px;" id="shareModalBody"></div>
    </div>
  </div>

  <div id="toast" class="hidden no-print"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCSRfZdAVh8ADPNtayW5lyDtmE0xDsJXNg",
      authDomain: "gen-lang-client-0208380044.firebaseapp.com",
      databaseURL: "https://gen-lang-client-0208380044-default-rtdb.firebaseio.com",
      projectId: "gen-lang-client-0208380044",
      storageBucket: "gen-lang-client-0208380044.firebasestorage.app",
      messagingSenderId: "17077391191",
      appId: "1:17077391191:web:cb936dd1bfe98b2f3d7812"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    try {
      if (firebase.firestore.persistentLocalCache && firebase.firestore.persistentMultipleTabManager) {
        db.settings({
          localCache: firebase.firestore.persistentLocalCache({
            tabManager: firebase.firestore.persistentMultipleTabManager()
          })
        });
      } else {
        db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
      }
    } catch (_) {
      db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    }

    const COLLECTION_NAME = 'artisan_qc_reports';
    const PHOTOS_COL = 'artisan_qc_photos';
    const ALBUMS_COL = 'artisan_qc_albums';
    const PASSCODE = '8888';
    const PASSCODE_STORAGE_KEY = 'artisan_qc_unlocked_v1';
    const WEEKDAYS_HK = ['日', '一', '二', '三', '四', '五', '六'];
    const SCHEDULE_PAGE_SIZE = 10;

    const urlParams = new URLSearchParams(window.location.search);
    const SINGLE_REPORT_ID = urlParams.get('reportId') || '';
    const SINGLE_SITE = urlParams.get('site') || '';
    const VIEW_MODE = urlParams.get('view') || '';
    const IS_BOSS_BRIEF = VIEW_MODE === 'brief';
    const IS_PUBLIC = VIEW_MODE === 'public' || IS_BOSS_BRIEF || Boolean(SINGLE_REPORT_ID) || Boolean(SINGLE_SITE);

    let activeMainView = urlParams.get('tab') === 'reports' ? 'reports' : 'schedule';
    let reports = [];
    let singleReportData = null;
    let expandedSites = new Set();
    let siteChipsExpanded = true;
    let expandedDetailIds = new Set();
    let onlyUpcomingNewUnits = false;
    let inlineEditId = null, editingReportId = null, followupTargetId = null;
    let managingOldSite = '';

    let schedulePage = 0;
    let scheduleRangeStart = '';
    let scheduleRangeEnd = '';
    let showScheduleRangeBox = false;

    let draftDocs = [], draftPhotos = [], activePhotoIndex = -1, originalPhotoIds = [];
    let currentTool = 'move', currentColor = 'rgba(234,88,12,0.95)';
    let currentFontScale = 0.026;
    let selectedShapeIdx = -1;
    let isDrawing = false, isDraggingShape = false, startX = 0, startY = 0, lastDragX = 0, lastDragY = 0;
    let currentStroke = [], baseImageObj = null;

    const canvas = document.getElementById('annotCanvas');
    const ctx = canvas.getContext('2d');

    function syncAllButtonState() {
      const sel = document.getElementById('siteFilter');
      const btnAll = document.getElementById('btnAllSites');
      const isAll = !onlyUpcomingNewUnits && (!sel || sel.value === 'ALL');
      if (btnAll) btnAll.classList.toggle('active', isAll);
    }

    function clickAllSitesBtn() {
      onlyUpcomingNewUnits = false;
      const sel = document.getElementById('siteFilter');
      if (sel) sel.value = 'ALL';
      schedulePage = 0;
      syncAllButtonState();
      renderCurrentView();
      showToast('已顯示全部');
    }

    function isUnlocked() {
      if (IS_PUBLIC) return true;
      return localStorage.getItem(PASSCODE_STORAGE_KEY) === '1';
    }

    function checkPasscodeGate() {
      const gate = document.getElementById('passcodeGate');
      const lockBtn = document.getElementById('lockSystemBtn');
      if (IS_PUBLIC) {
        gate.classList.add('hidden');
        lockBtn.classList.add('hidden');
        return true;
      }
      if (isUnlocked()) {
        gate.classList.add('hidden');
        lockBtn.classList.remove('hidden');
        return true;
      }
      lockBtn.classList.add('hidden');
      gate.classList.remove('hidden');
      setTimeout(() => document.getElementById('passcodeInput')?.focus(), 50);
      return false;
    }

    function unlockSystem() {
      const val = (document.getElementById('passcodeInput')?.value || '').trim();
      if (val !== PASSCODE) {
        return showToast('密碼唔啱');
      }
      localStorage.setItem(PASSCODE_STORAGE_KEY, '1');
      document.getElementById('passcodeInput').value = '';
      checkPasscodeGate();
      showToast('已解鎖');
    }

    function lockSystem() {
      localStorage.removeItem(PASSCODE_STORAGE_KEY);
      checkPasscodeGate();
      showToast('已鎖定');
    }

    function isFutureDiaryEntry(r) {
      return Boolean(r?.isFutureDiary || r?.isUpcoming);
    }

    function toggleScheduleDetail(id) {
      if (!id) return;

    function formatMonthDayWeekday(dateStr) {
      if (!dateStr || dateStr === '未定日期') return dateStr || '未定日期';
      const m = String(dateStr).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (!m) return String(dateStr);
      const yr = parseInt(m[1], 10);
      const mo = parseInt(m[2], 10);
      const dy = parseInt(m[3], 10);
      const dt = new Date(yr, mo - 1, dy);
      const wd = WEEKDAYS_HK[dt.getDay()] || '';
      return `${mo}月${dy}日(${wd})`;
    }

    function setMeridiemForStartInput(inputId, period) {
      const inputEl = document.getElementById(inputId);
      if (!inputEl) return;
      const cur = (inputEl.value || '').trim();
      let hh = period === 'AM' ? 9 : 14;
      let mm = '00';
      const m = cur.match(/^(\d{1,2}):(\d{2})$/);
      if (m) {
        let hNum = parseInt(m[1], 10);
        mm = m[2];
        if (period === 'AM') {
          if (hNum >= 12) hNum -= 12;
        } else {
          if (hNum < 12) hNum += 12;
        }
        hh = hNum;
      }
      inputEl.value = `${String(hh).padStart(2, '0')}:${mm}`;
      showToast(period === 'AM' ? `上午 ${inputEl.value}` : `下午 ${inputEl.value}`);
    }

    function setMinuteForStartInput(inputId, mm) {
      const inputEl = document.getElementById(inputId);
      if (!inputEl || (mm !== '00' && mm !== '30')) return;
      const cur = (inputEl.value || '').trim();
      const m = cur.match(/^(\d{1,2}):(\d{2})$/);
      if (m) {
        const hh = String(parseInt(m[1], 10)).padStart(2, '0');
        inputEl.value = `${hh}:${mm}`;
      } else {
        inputEl.value = `09:${mm}`;
      }
      showToast(`:${mm}`);
    }

    function buildEditorTimeValue() {
      const s = (document.getElementById('fieldTimeStart').value || '').trim();
      const e = (document.getElementById('fieldTimeEnd').value || '').trim();

      return s || e || '';

    function getAllUniqueSites() {
      return [...new Set(reports.map(r => (r.site || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-Hant'));
    }

    function scoreSiteSimilarity(candidate, query) {
      const c = candidate.toLowerCase().replace(/\s+/g, '');
      const q = query.toLowerCase().replace(/\s+/g, '');
      if (!q) return 1;
      if (c === q) return 100;
      if (c.includes(q) || q.includes(c)) return 80;
      const tokens = query.toLowerCase().split(/[\s,，/／\-_]+/).filter(Boolean);
      let score = 0;
      tokens.forEach(t => { if (c.includes(t)) score += 25; });
      let charHits = 0;
      for (const ch of new Set(q.split(''))) {
        if (ch.trim() && c.includes(ch)) charHits++;
      }
      const ratio = charHits / Math.max(2, q.length);
      if (ratio >= 0.45) score += Math.round(ratio * 40);
      return score;
    }

    function onFieldSiteInput() {
      const box = document.getElementById('siteSuggestBox');
      if (!box) return;
      const val = (document.getElementById('fieldSite').value || '').trim();
      const allSites = getAllUniqueSites();
      if (!allSites.length) { box.classList.add('hidden'); return; }

      let matched = [];
      if (!val) {
        matched = allSites.slice(0, 12);
      } else {
        matched = allSites
          .map(s => ({ site: s, score: scoreSiteSimilarity(s, val) }))
          .filter(x => x.score >= 18)
          .sort((a, b) => b.score - a.score)
          .slice(0, 10)
          .map(x => x.site);
      }

      if (!matched.length || (matched.length === 1 && matched[0] === val)) {
        box.classList.add('hidden');
        return;
      }

      box.innerHTML = `
        <div class="site-suggest-title">現有地址：</div>
        <div class="site-suggest-list">
          ${matched.map(s => `<button type="button" onclick="pickSuggestedSite('${escapeAttr(s)}')" class="site-suggest-item">${escapeHtml(s)}</button>`).join('')}
        </div>`;
      box.classList.remove('hidden');
    }

    async function fetchFullPhotosForReport(r) {
      if (Array.isArray(r.photoMeta) && r.photoMeta.length > 0) {
        const docs = await Promise.all(r.photoMeta.map(m => db.collection(PHOTOS_COL).doc(m.id).get().catch(() => null)));
        return r.photoMeta.map((m, idx) => {
          const d = docs[idx] && docs[idx].exists ? docs[idx].data() : null;
          return {
            id: m.id,
            base64Raw: d ? (d.base64Raw || '') : '',
            base64Annotated: d ? (d.base64Annotated || d.base64Raw || m.thumb) : m.thumb,
            shapes: d ? (d.shapes || []) : [],
            note: d ? (d.note ?? m.note ?? '') : (m.note || '')
          };
        });
      }
      return Array.isArray(r.photos) ? r.photos : [];
    }

    function getReportThumbs(r) {
      if (Array.isArray(r.photoMeta) && r.photoMeta.length > 0) {
        return r.photoMeta.map(m => ({ id: m.id, src: m.thumb, note: m.note || '' }));
      }
      if (Array.isArray(r.photos) && r.photos.length > 0) {
        return r.photos.map(p => ({ id: p.id, src: p.base64Annotated || p.base64Raw, note: p.note || '' }));

      return [];

    function getFilteredReports() {

        if (!onlyUpcomingNewUnits && siteVal && siteVal !== 'ALL' && r.site !== siteVal) return false;
        if (!SINGLE_SITE && kw) {
          const hay = `${r.site} ${r.assignee||''} ${r.date||''} ${formatMonthDayWeekday(r.date||'')} ${r.timeRange||''} ${r.title} ${r.summary||''} ${r.followup||''} ${getDocsList(r).map(d=>d.name).join(' ')} ${(r.followupLogs||[]).map(l=>l.message).join(' ')}`.toLowerCase();
          if (!hay.includes(kw)) return false;
        }
        return true;
      });

    function getScheduleDayGroups(filtered) {
      const normalEntries = filtered.filter(r => !isFutureDiaryEntry(r));
      const dayMap = {};
      normalEntries.forEach(r => {
        const dKey = r.date || '未定日期';
        if (scheduleRangeStart && dKey !== '未定日期' && dKey < scheduleRangeStart) return;
        if (scheduleRangeEnd && dKey !== '未定日期' && dKey > scheduleRangeEnd) return;
        if (!dayMap[dKey]) dayMap[dKey] = [];
        dayMap[dKey].push(r);
      });

      return Object.keys(dayMap)
        .sort((a, b) => {
          if (a === '未定日期') return 1;
          if (b === '未定日期') return -1;
          return b.localeCompare(a);
        })
        .map(dKey => ({
          date: dKey,
          items: dayMap[dKey].sort((a, b) => (a.timeRange || '').localeCompare(b.timeRange || '') || (a.createdAt || 0) - (b.createdAt || 0))
        }));
    }

    function getFutureDiaryEntries(filtered) {
      return filtered
        .filter(r => isFutureDiaryEntry(r))
        .sort((a, b) => (a.date || '9999-99-99').localeCompare(b.date || '9999-99-99') || (a.timeRange || '').localeCompare(b.timeRange || ''));

    function renderScheduleTimeline() {
      const container = document.getElementById('reportListContainer');
      const filtered = getFilteredReports();
      const allDayGroups = getScheduleDayGroups(filtered);
      const futureItems = getFutureDiaryEntries(filtered);

      const isCustomRange = Boolean(scheduleRangeStart || scheduleRangeEnd);
      const totalPages = isCustomRange ? 1 : Math.max(1, Math.ceil(allDayGroups.length / SCHEDULE_PAGE_SIZE));
      if (schedulePage >= totalPages) schedulePage = totalPages - 1;

      const visibleDays = isCustomRange
        ? allDayGroups
        : allDayGroups.slice(schedulePage * SCHEDULE_PAGE_SIZE, (schedulePage + 1) * SCHEDULE_PAGE_SIZE);

      const rangeInfoText = isCustomRange
        ? `${scheduleRangeStart ? formatMonthDayWeekday(scheduleRangeStart) : '起'} ～ ${scheduleRangeEnd ? formatMonthDayWeekday(scheduleRangeEnd) : '止'}（${allDayGroups.length}日）`
        : `${schedulePage + 1}/${totalPages}頁（${allDayGroups.length}日）`;

      const toolbarHtml = `<div class="schedule-toolbar no-print">
        <div class="row">
          <button type="button" onclick="toggleScheduleRangeBox()" class="btn-secondary ${showScheduleRangeBox ? 'btn-active' : ''}">時段</button>
          <button type="button" onclick="jumpToUpcomingNewUnit()" class="btn-orange ${onlyUpcomingNewUnits ? 'btn-active' : ''}">即將</button>
          <span class="t-meta muted" style="font-weight:500;">${escapeHtml(rangeInfoText)}</span>
          ${!isCustomRange && totalPages > 1 ? `
            <button type="button" onclick="stepSchedulePage(-1)" class="btn-secondary" ${schedulePage <= 0 ? 'disabled' : ''}><span class="btn-sym">‹</span>上一頁</button>
            <button type="button" onclick="stepSchedulePage(1)" class="btn-secondary" ${schedulePage >= totalPages - 1 ? 'disabled' : ''}>下一頁<span class="btn-sym">›</span></button>

        <span class="t-meta" style="font-weight:700;">時段：</span>
        <input type="date" id="schedRangeStart" value="${escapeHtml(scheduleRangeStart)}" class="input-ui" style="width:auto;" />
        <span class="t-meta" style="font-weight:700;">至</span>
        <input type="date" id="schedRangeEnd" value="${escapeHtml(scheduleRangeEnd)}" class="input-ui" style="width:auto;" />

      const futureSectionHtml = futureItems.length ? `<div class="future-diary-box">

            <span class="future-tag-pill">即將</span>
            <span class="t-site" style="font-size:13px;">${futureItems.length} 項</span>

        </div>
        <div class="future-diary-body">

            return `<div class="schedule-slot-row">
              <div class="schedule-time-col" style="flex-direction:column;">

                <span class="t-meta t-mono muted">${escapeHtml(tStr)}</span>

              <div class="schedule-slot-main">

          let pages = [];

          if (albDoc.exists) {
            const pSnap = await db.collection(ALBUMS_COL).doc(albumId).collection('pages').orderBy('order', 'asc').get();

          }
          if (pages.length && embedWrap) {
            const sec = document.createElement('div');
            sec.style.marginTop = '12px';
            sec.innerHTML = `
              <div style="font-weight:700;padding-bottom:4px;border-bottom:2px solid #EA580C;margin-bottom:6px;">${escapeHtml(ad.name)}</div>

          }
        } catch (e) { console.warn(e); }

    function getDocsList(r) {
      if (Array.isArray(r.docs) && r.docs.length > 0) return r.docs;
      if (r.docName) return [{ name: r.docName, url: r.docUrl || '' }];
      return [];
    }

    async function replaceReportDoc(reportId, idx, e) {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      const rep = reports.find(r => r.id === reportId);
      if (!rep) return;
      const docs = [...getDocsList(rep)];
      if (!docs[idx]) return;

      if (file.type === 'application/pdf' && file.size <= 650 * 1024) {
        const rd = new FileReader();
        rd.onload = async ev => {
          docs[idx] = { name: file.name, url: ev.target.result };
          await db.collection(COLLECTION_NAME).doc(reportId).update({
            docs, docName: docs[0]?.name || '', docUrl: docs[0]?.url || '', updatedAt: Date.now()
          });
          showToast('已換檔');
        };
        rd.readAsDataURL(file);
        return;
      }

      const newUrl = prompt('新連結：', docs[idx].url || '');
      if (newUrl === null) return;
      const newName = prompt('新檔名：', file.name || docs[idx].name || '');
      if (newName === null) return;
      docs[idx] = { name: newName.trim() || file.name || '附件', url: newUrl.trim() };
      await db.collection(COLLECTION_NAME).doc(reportId).update({
        docs, docName: docs[0]?.name || '', docUrl: docs[0]?.url || '', updatedAt: Date.now()
      });
      showToast('已換檔');
    }

    async function removeReportDoc(reportId, idx) {
      const rep = reports.find(r => r.id === reportId);
      if (!rep) return;
      const docs = [...getDocsList(rep)];
      const target = docs[idx];
      if (!target) return;
      if (!confirmYAction(`刪除「${target.name}」？`)) return;
      docs.splice(idx, 1);
      await db.collection(COLLECTION_NAME).doc(reportId).update({
        docs, docName: docs[0]?.name || '', docUrl: docs[0]?.url || '', updatedAt: Date.now()
      });
      showToast('已刪除');
    }

    function parseTimeRange(str) {
      const raw = (str || '').trim();
      const rangeM = raw.match(/(\d{1,2}:\d{2})\s*-\s*(.+)$/);
      if (rangeM) return { start: rangeM[1].padStart(5, '0'), end: rangeM[2].trim() };
      const singleM = raw.match(/^(\d{1,2}:\d{2})$/);
      if (singleM) return { start: singleM[1].padStart(5, '0'), end: '' };
      return { start: '', end: raw };
    }

    function formatTimeRange(s, e) {
      const st = (s || '').trim();
      const en = (e || '').trim();
      if (st && en) return `${st} - ${en}`;
      return st || en || '';
    }

    function openSiteManageModal(oldSite, oldAssignee) {
      managingOldSite = oldSite;
      document.getElementById('manageNewSite').value = oldSite || '';
      document.getElementById('manageNewAssignee').value = oldAssignee || '';
      const count = reports.filter(r => r.site === oldSite).length;
      document.getElementById('mergeHintText').textContent = `「${oldSite}」（${count}條）合併至：`;

      const otherSites = getAllUniqueSites()
        .filter(s => s !== oldSite)
        .sort((a, b) => scoreSiteSimilarity(b, oldSite) - scoreSiteSimilarity(a, oldSite));

      const sel = document.getElementById('manageMergeTarget');
      if (!otherSites.length) {
        sel.innerHTML = `<option value="">無其他單位</option>`;
      } else {
        sel.innerHTML = `<option value="">-- 選擇地址 --</option>` +
          otherSites.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
      }
      document.getElementById('siteManageModal').classList.remove('hidden');
    }

    function closeSiteManageModal() {
      document.getElementById('siteManageModal').classList.add('hidden');
    }

    async function submitRenameSite() {
      const newSite = document.getElementById('manageNewSite').value.trim();
      const newAss = document.getElementById('manageNewAssignee').value.trim();
      if (!newSite) return showToast('名稱不能為空');

      const batch = db.batch();
      reports.filter(r => r.site === managingOldSite).forEach(r => {
        batch.update(db.collection(COLLECTION_NAME).doc(r.id), {
          site: newSite,
          assignee: newAss,
          updatedAt: Date.now()
        });
      });
      await batch.commit();

      const sel = document.getElementById('siteFilter');
      if (sel.value === managingOldSite) sel.value = newSite;
      closeSiteManageModal();
      showToast('已更新');
    }

    async function submitMergeSite() {
      const targetSite = document.getElementById('manageMergeTarget').value;
      if (!targetSite) return showToast('請選地址');
      const itemsToMerge = reports.filter(r => r.site === managingOldSite);
      if (!confirmYAction(`合併「${managingOldSite}」至「${targetSite}」？`)) return;

      const targetRefItem = reports.find(r => r.site === targetSite && r.assignee);
      const batch = db.batch();
      itemsToMerge.forEach(r => {
        const upd = { site: targetSite, updatedAt: Date.now() };
        if (!r.assignee && targetRefItem?.assignee) upd.assignee = targetRefItem.assignee;
        batch.update(db.collection(COLLECTION_NAME).doc(r.id), upd);
      });
      await batch.commit();

      const sel = document.getElementById('siteFilter');
      if (sel.value === managingOldSite) sel.value = targetSite;
      expandedSites.add(targetSite);
      closeSiteManageModal();
      showToast('已合併');
    }

    function handlePhotoUpload(e) {
      const files = Array.from(e.target.files || []);
      files.forEach(processImageFile);
      e.target.value = '';
    }

    function processImageFile(file) {
      if (!file) return;
      const rd = new FileReader();
      rd.onload = ev => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height, m = 1150;
          if (w > m || h > m) { if (w > h) { h = Math.round(h * m / w); w = m; } else { w = Math.round(w * m / h); h = m; } }
          const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
          const b64 = c.toDataURL('image/jpeg', 0.78);
          draftPhotos.push({ id: 'ph_' + Date.now() + '_' + Math.random().toString(36).slice(2,6), base64Raw: b64, base64Annotated: b64, shapes: [], note: '' });
          renderPhotoThumbList();
          selectPhotoForAnnotation(draftPhotos.length - 1);
          showToast(`第 ${draftPhotos.length} 張`);
        };
        img.src = ev.target.result;
      };
      rd.readAsDataURL(file);
    }

    function createBlankSketch() {
      const c = document.createElement('canvas'); c.width = 900; c.height = 620;
      const cx = c.getContext('2d'); cx.fillStyle = '#FFF'; cx.fillRect(0,0,900,620);
      const b64 = c.toDataURL('image/jpeg', 0.85);
      draftPhotos.push({ id: 'sk_' + Date.now(), base64Raw: b64, base64Annotated: b64, shapes: [], note: '' });
      renderPhotoThumbList(); selectPhotoForAnnotation(draftPhotos.length - 1);
    }

    function makeSmallThumb(dataUrl) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height, m = 180;
          if (w > m || h > m) { if (w > h) { h = Math.round(h * m / w); w = m; } else { w = Math.round(w * m / h); h = m; } }
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', 0.6));
        };
        img.onerror = () => resolve('');
        img.src = dataUrl;
      });
    }

    function renderPhotoThumbList() {
      document.getElementById('photoCountHint').textContent = `${draftPhotos.length} 張`;
      document.getElementById('photoThumbList').innerHTML = draftPhotos.map((p, i) => `
        <div onclick="selectPhotoForAnnotation(${i})" style="border:2px solid ${i===activePhotoIndex?'#EA580C':'#CBD5E1'};border-radius:3px;overflow:hidden;cursor:pointer;background:#FFF;">
          <img src="${p.base64Annotated||p.base64Raw}" style="width:100%;height:72px;object-fit:cover;display:block;" />
          <div class="row-between t-meta" style="padding:2px 5px;"><b>#${i+1}</b><button type="button" onclick="removeDraftPhoto(event,${i})" class="btn-link danger"><span class="btn-sym">✕</span></button></div>
        </div>`).join('');

    function removeDraftPhoto(e, i) {
      e.stopPropagation();
      if (!confirmYAction(`刪除第 #${i + 1} 張？`)) return;
      draftPhotos.splice(i, 1); selectedShapeIdx = -1;
      activePhotoIndex = draftPhotos.length ? Math.min(i, draftPhotos.length - 1) : -1;
      renderPhotoThumbList();
      if (activePhotoIndex >= 0) selectPhotoForAnnotation(activePhotoIndex);
      else document.getElementById('annotationWorkspace').classList.add('hidden');
    }

    function selectPhotoForAnnotation(i) {
      activePhotoIndex = i; selectedShapeIdx = -1; updateSelectionUI();
      const p = draftPhotos[i]; if (!p) return;
      if (!p.base64Raw) p.base64Raw = p.base64Annotated;
      document.getElementById('annotationWorkspace').classList.remove('hidden');
      document.getElementById('currentPhotoNote').value = p.note || '';
      renderPhotoThumbList();
      baseImageObj = new Image();
      baseImageObj.onload = () => { canvas.width = baseImageObj.width; canvas.height = baseImageObj.height; redrawCanvas(false); };
      baseImageObj.src = p.base64Raw;
    }

    function syncCurrentPhotoNote() { if (activePhotoIndex >= 0) draftPhotos[activePhotoIndex].note = document.getElementById('currentPhotoNote').value; }

    function setTool(t) {
      currentTool = t;
      ['move','freehand','circle','arrow','text'].forEach(k => document.getElementById('tool-'+k).classList.toggle('btn-active', k===t));
      canvas.style.cursor = t === 'move' ? 'grab' : 'crosshair';
      if (t !== 'move') { selectedShapeIdx = -1; redrawCanvas(false); }
      updateSelectionUI();
    }

    function updateSelectionUI() {
      const shapes = activePhotoIndex >= 0 ? (draftPhotos[activePhotoIndex]?.shapes || []) : [];
      const sel = selectedShapeIdx >= 0 ? shapes[selectedShapeIdx] : null;
      document.getElementById('delSelectedShapeBtn').classList.toggle('hidden', !sel);
      const showTextBar = currentTool === 'text' || (sel && sel.type === 'text');
      document.getElementById('textInputBar').classList.toggle('hidden', !showTextBar);
      if (sel && sel.type === 'text') {
        document.getElementById('canvasTextInput').value = sel.text || '';
        if (sel.scale) document.getElementById('fontSizeSelect').value = String(sel.scale);
      }
    }

    function onFontSizeChange() {
      currentFontScale = parseFloat(document.getElementById('fontSizeSelect').value) || 0.026;
      const shapes = activePhotoIndex >= 0 ? (draftPhotos[activePhotoIndex]?.shapes || []) : [];
      if (selectedShapeIdx >= 0 && shapes[selectedShapeIdx]?.type === 'text') {
        shapes[selectedShapeIdx].scale = currentFontScale;
        redrawCanvas(true);
      }
    }

    function onTextInputLiveEdit() {
      const shapes = activePhotoIndex >= 0 ? (draftPhotos[activePhotoIndex]?.shapes || []) : [];
      if (currentTool === 'move' && selectedShapeIdx >= 0 && shapes[selectedShapeIdx]?.type === 'text') {
        shapes[selectedShapeIdx].text = document.getElementById('canvasTextInput').value;
        redrawCanvas(true);
      }
    }

    function setColor(c, btnEl) {
      currentColor = c;
      document.querySelectorAll('#annotationWorkspace .color-dot').forEach(b => b.classList.remove('active-color'));
      if (btnEl) btnEl.classList.add('active-color');
      const shapes = activePhotoIndex >= 0 ? (draftPhotos[activePhotoIndex]?.shapes || []) : [];
      if (selectedShapeIdx >= 0 && shapes[selectedShapeIdx]) {
        shapes[selectedShapeIdx].color = c;
        redrawCanvas(true);
      }
    }

    function deleteSelectedShape() {
      if (activePhotoIndex < 0 || selectedShapeIdx < 0) return;
      draftPhotos[activePhotoIndex].shapes.splice(selectedShapeIdx, 1);
      selectedShapeIdx = -1;
      updateSelectionUI();
      redrawCanvas(true);
    }

    function undoShape() { if (activePhotoIndex >= 0) { draftPhotos[activePhotoIndex].shapes.pop(); selectedShapeIdx = -1; updateSelectionUI(); redrawCanvas(true); } }
    function clearShapes() { if (activePhotoIndex >= 0) { draftPhotos[activePhotoIndex].shapes = []; selectedShapeIdx = -1; updateSelectionUI(); redrawCanvas(true); } }

    function getShapeBounds(c, s) {
      if (s.type === 'text') {
        const fs = Math.max(16, Math.round(canvas.width * (s.scale || 0.026)));
        c.save(); c.font = `bold ${fs}px sans-serif`; const w = c.measureText(s.text || '').width; c.restore();
        return { x1: s.x - 10, y1: s.y - fs - 4, x2: s.x + w + 10, y2: s.y + 10 };
      }
      if (s.type === 'freehand' && s.points?.length) {
        const xs = s.points.map(p => p.x), ys = s.points.map(p => p.y);
        return { x1: Math.min(...xs) - 10, y1: Math.min(...ys) - 10, x2: Math.max(...xs) + 10, y2: Math.max(...ys) + 10 };
      }
      return { x1: Math.min(s.x1, s.x2) - 10, y1: Math.min(s.y1, s.y2) - 10, x2: Math.max(s.x1, s.x2) + 10, y2: Math.max(s.y1, s.y2) + 10 };
    }

    function hitTestShape(shapes, x, y) {
      for (let i = shapes.length - 1; i >= 0; i--) {
        const b = getShapeBounds(ctx, shapes[i]);
        if (x >= b.x1 && x <= b.x2 && y >= b.y1 && y <= b.y2) return i;
      }
      return -1;
    }

    function moveShapeBy(s, dx, dy) {
      if (s.type === 'text') { s.x += dx; s.y += dy; }
      else if (s.type === 'freehand' && s.points) { s.points.forEach(p => { p.x += dx; p.y += dy; }); }
      else { s.x1 += dx; s.y1 += dy; s.x2 += dx; s.y2 += dy; }
    }

    function getCoords(e) { const r = canvas.getBoundingClientRect(), cx = e.touches ? e.touches[0].clientX : e.clientX, cy = e.touches ? e.touches[0].clientY : e.clientY; return { x: (cx - r.left) * (canvas.width / r.width), y: (cy - r.top) * (canvas.height / r.height) }; }
    canvas.addEventListener('mousedown', pDown); canvas.addEventListener('mousemove', pMove); canvas.addEventListener('mouseup', pUp);
    canvas.addEventListener('touchstart', pDown, { passive: false }); canvas.addEventListener('touchmove', pMove, { passive: false }); canvas.addEventListener('touchend', pUp);

    function pDown(e) {
      if (activePhotoIndex < 0) return; e.preventDefault();
      const pos = getCoords(e);
      const shapes = draftPhotos[activePhotoIndex].shapes || [];

      if (currentTool === 'move') {
        const hit = hitTestShape(shapes, pos.x, pos.y);
        selectedShapeIdx = hit;
        updateSelectionUI();
        redrawCanvas(false);
        if (hit >= 0) { isDraggingShape = true; lastDragX = pos.x; lastDragY = pos.y; }
        return;
      }

      if (currentTool === 'text') {
        const hit = hitTestShape(shapes, pos.x, pos.y);
        if (hit >= 0 && shapes[hit].type === 'text') {
          setTool('move'); selectedShapeIdx = hit; updateSelectionUI(); redrawCanvas(false);
          isDraggingShape = true; lastDragX = pos.x; lastDragY = pos.y;
          return;
        }
        const txt = document.getElementById('canvasTextInput').value.trim();
        if (!txt) return showToast('請先輸入文字');
        shapes.push({ type: 'text', x: pos.x, y: pos.y, text: txt, color: currentColor, scale: currentFontScale });
        document.getElementById('canvasTextInput').value = '';
        setTool('move');
        selectedShapeIdx = shapes.length - 1;
        updateSelectionUI();
        redrawCanvas(true);
        return;
      }

      isDrawing = true; startX = pos.x; startY = pos.y;
      if (currentTool === 'freehand') currentStroke = [pos];
    }

    function pMove(e) {
      if (activePhotoIndex < 0) return;
      if (isDraggingShape && selectedShapeIdx >= 0) {
        e.preventDefault();
        const pos = getCoords(e);
        moveShapeBy(draftPhotos[activePhotoIndex].shapes[selectedShapeIdx], pos.x - lastDragX, pos.y - lastDragY);
        lastDragX = pos.x; lastDragY = pos.y;
        redrawCanvas(false);
        return;
      }
      if (!isDrawing) return; e.preventDefault();
      const pos = getCoords(e); redrawCanvas(false);
      if (currentTool === 'freehand') { currentStroke.push(pos); drawShape(ctx, { type: 'freehand', points: currentStroke, color: currentColor }); }
      else drawShape(ctx, { type: currentTool, x1: startX, y1: startY, x2: pos.x, y2: pos.y, color: currentColor });
    }

    function pUp(e) {
      if (isDraggingShape) { isDraggingShape = false; redrawCanvas(true); return; }
      if (!isDrawing || activePhotoIndex < 0) return; isDrawing = false;
      if (currentTool === 'freehand') { if (currentStroke.length > 1) draftPhotos[activePhotoIndex].shapes.push({ type: 'freehand', points: currentStroke, color: currentColor }); currentStroke = []; redrawCanvas(true); return; }
      const r = canvas.getBoundingClientRect(), cx = e.changedTouches ? e.changedTouches[0].clientX : e.clientX, cy = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
      const ex = (cx - r.left) * (canvas.width / r.width), ey = (cy - r.top) * (canvas.height / r.height);
      if (Math.hypot(ex - startX, ey - startY) > 6) draftPhotos[activePhotoIndex].shapes.push({ type: currentTool, x1: startX, y1: startY, x2: ex, y2: ey, color: currentColor });
      redrawCanvas(true);
    }

    function redrawCanvas(save = false) {
      if (!baseImageObj || activePhotoIndex < 0) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(baseImageObj, 0, 0);
      const shapes = draftPhotos[activePhotoIndex].shapes || [];
      shapes.forEach(s => drawShape(ctx, s));
      if (save) {
        draftPhotos[activePhotoIndex].base64Annotated = canvas.toDataURL('image/jpeg', 0.8);
        renderPhotoThumbList();
      }
      if (selectedShapeIdx >= 0 && shapes[selectedShapeIdx]) {
        const b = getShapeBounds(ctx, shapes[selectedShapeIdx]);
        ctx.save();
        ctx.strokeStyle = '#EA580C';
        ctx.lineWidth = Math.max(2, Math.round(canvas.width * 0.003));
        ctx.setLineDash([8, 6]);
        ctx.strokeRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);
        ctx.restore();
      }
    }

    function drawShape(c, s) {
      c.save(); const lw = Math.max(4, Math.round(canvas.width * 0.005)); c.strokeStyle = s.color; c.fillStyle = s.color; c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round';
      if (s.type === 'freehand' && s.points?.length > 1) { c.beginPath(); c.moveTo(s.points[0].x, s.points[0].y); s.points.slice(1).forEach(p => c.lineTo(p.x, p.y)); c.stroke(); }
      else if (s.type === 'circle') { c.beginPath(); c.ellipse((s.x1+s.x2)/2, (s.y1+s.y2)/2, Math.max(Math.abs(s.x2-s.x1)/2,4), Math.max(Math.abs(s.y2-s.y1)/2,4), 0, 0, Math.PI*2); c.stroke(); }
      else if (s.type === 'arrow') { const hl = lw*4, a = Math.atan2(s.y2-s.y1, s.x2-s.x1); c.beginPath(); c.moveTo(s.x1,s.y1); c.lineTo(s.x2,s.y2); c.stroke(); c.beginPath(); c.moveTo(s.x2,s.y2); c.lineTo(s.x2-hl*Math.cos(a-Math.PI/6), s.y2-hl*Math.sin(a-Math.PI/6)); c.lineTo(s.x2-hl*Math.cos(a+Math.PI/6), s.y2-hl*Math.sin(a+Math.PI/6)); c.closePath(); c.fill(); }
      else if (s.type === 'text') {
        const fs = Math.max(16, Math.round(canvas.width * (s.scale || 0.026)));
        c.font = `bold ${fs}px sans-serif`; const w = c.measureText(s.text).width;
        c.fillStyle = 'rgba(15,23,42,0.85)'; c.fillRect(s.x-8, s.y-fs, w+16, fs+10);
        c.fillStyle = s.color && s.color.includes('234,179,8') ? '#FEF08A' : '#FFF';
        c.strokeStyle = s.color; c.lineWidth = 2; c.strokeRect(s.x-8, s.y-fs, w+16, fs+10);
        c.fillText(s.text, s.x, s.y);
      }
      c.restore();
    }

    async function saveReport() {
      const site = document.getElementById('fieldSite').value.trim(), title = document.getElementById('fieldTitle').value.trim();
      if (!site || !title) return showToast('請填寫單位及標題');
      const btn = document.getElementById('saveReportBtn'); btn.disabled = true; btn.textContent = '同步中...';

      const docId = editingReportId || ('rep-' + Date.now()), ex = reports.find(r => r.id === docId);
      const isFutureVal = Boolean(document.getElementById('fieldIsFutureDiary')?.checked);
      const validDocs = draftDocs.filter(d => d.name.trim() || d.url.trim()).map(d => ({ name: d.name.trim() || '附件', url: d.url.trim() }));

      try {
        const photoMeta = [];
        for (let i = 0; i < draftPhotos.length; i++) {
          const p = draftPhotos[i];
          const pid = p.id || (`ph_${docId}_${i}_${Date.now()}`);
          p.id = pid;
          const rendered = p.base64Annotated || p.base64Raw;
          const smallThumb = await makeSmallThumb(rendered);

          await db.collection(PHOTOS_COL).doc(pid).set({
            reportId: docId,
            order: i,
            base64Raw: (p.shapes && p.shapes.length > 0) ? p.base64Raw : '',
            base64Annotated: rendered,
            shapes: p.shapes || [],
            note: p.note || '',
            updatedAt: Date.now()
          });
          photoMeta.push({ id: pid, thumb: smallThumb, note: p.note || '' });
        }

        const curIds = photoMeta.map(m => m.id);
        for (const oldId of originalPhotoIds) {
          if (!curIds.includes(oldId)) await db.collection(PHOTOS_COL).doc(oldId).delete().catch(() => {});
        }

        await db.collection(COLLECTION_NAME).doc(docId).set({
          site, assignee: document.getElementById('fieldAssignee').value.trim(),
          date: document.getElementById('fieldDate').value || new Date().toISOString().split('T')[0],
          timeRange: buildEditorTimeValue(),
          isFutureDiary: isFutureVal,
          isUpcoming: isFutureVal,
          title,
          docs: validDocs, docName: validDocs[0]?.name || '', docUrl: validDocs[0]?.url || '',
          summary: document.getElementById('fieldSummary').value.trim(),
          followup: document.getElementById('fieldFollowup').value.trim(),
          followupLogs: ex ? (ex.followupLogs || []) : [],
          photoMeta,
          photos: [],
          createdAt: ex ? ex.createdAt : Date.now(), updatedAt: Date.now()
        });
        closeEditor(); showToast(`已儲存（${photoMeta.length}張）`);
      } catch (e) {
        console.error(e);
        showToast('儲存失敗：' + e.message);
      } finally { btn.disabled = false; btn.textContent = '儲存'; }
    }

    async function deleteReport(id) {
      if (!confirmYAction('刪除此紀錄？')) return;
      const r = reports.find(x => x.id === id);
      if (r && Array.isArray(r.photoMeta)) {
        r.photoMeta.forEach(m => db.collection(PHOTOS_COL).doc(m.id).delete().catch(() => {}));
      }
      await db.collection(COLLECTION_NAME).doc(id).delete();
      showToast('已刪除');
    }

    function escapeHtml(s) { return !s ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function escapeAttr(s) { return escapeHtml(s).replace(/'/g, "\\'"); }

    bootApp();
  </script>
</body>
</html>
