<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>築匠設計 ARTISAN STUDIO — QC 總報告</title>
  <link rel="icon" href="data:," />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
      background: #F1F5F9; color: #0F172A; font-size: 14px; line-height: 1.5; margin: 0;
    }
    a { color: inherit; }
    .container { max-width: 1024px; margin: 0 auto; padding: 0 12px; }
    .topbar { background: #FFF; border-bottom: 1px solid #E2E8F0; position: sticky; top: 0; z-index: 30; padding: 8px 0; }
    .row-between { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .t-site { font-size: 16px; font-weight: 700; line-height: 1.35; }
    .t-meta { font-size: 12px; line-height: 1.4; }
    .t-mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { color: #64748B; }

    .btn-primary { background: #0F172A; color: #FFF; border: 1px solid #0F172A; border-radius: 6px; font-size: 12px; font-weight: 500; padding: 5px 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
    .btn-primary:hover { background: #334155; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #FFF; color: #334155; border: 1px solid #CBD5E1; border-radius: 6px; font-size: 12px; font-weight: 500; padding: 5px 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
    .btn-secondary:hover { background: #F8FAFC; color: #0F172A; }
    .btn-active { background: #0F172A !important; color: #FFF !important; border-color: #0F172A !important; }
    .btn-link { background: none; border: none; padding: 2px 3px; font-size: 12px; font-weight: 500; color: #334155; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .btn-link:hover { color: #0F172A; }
    .btn-link.blue { color: #1D4ED8; }
    .btn-link.danger:hover { color: #DC2626; }

    /* 唯一淺橙色：輸入框 */
    .input-ui { border: 1px solid #FDBA74; border-radius: 6px; padding: 6px 10px; font-size: 14px; background: #FFF7ED; color: #0F172A; width: 100%; font-family: inherit; }
    .input-ui:focus { outline: none; border-color: #0F172A; background: #FFEDD5; }
    .select-ui { border: 1px solid #CBD5E1; border-radius: 6px; padding: 6px 8px; font-size: 12px; background: #FFF; color: #0F172A; }

    .filter-bar { background: #FFF; border: 1px solid #E2E8F0; border-radius: 8px; padding: 8px; margin: 12px 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-bar .search-wrap { flex: 1 1 220px; }
    .site-card { background: #FFF; border: 1px solid #CBD5E1; border-left: 4px solid #0F172A; border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
    .site-header { background: #F8FAFC; border-bottom: 1px solid #E2E8F0; padding: 8px 14px; }
    .site-body { padding: 12px 14px; }

    /* 左日期、右內容梯級排版 */
    .entry-row { display: flex; gap: 14px; }
    .entry-row + .entry-row { margin-top: 12px; padding-top: 12px; border-top: 1px solid #E2E8F0; }
    .step-left { width: 112px; flex-shrink: 0; padding-top: 2px; }
    .step-right { flex: 1; min-width: 0; border-left: 1px solid #E2E8F0; padding-left: 14px; }
    .entry-main { display: flex; gap: 12px; justify-content: space-between; margin-top: 4px; }
    .entry-content { flex: 1; min-width: 0; }
    .docs-col { width: 200px; flex-shrink: 0; border-left: 1px solid #E2E8F0; padding-left: 12px; }

    @media (max-width: 640px) {
      .entry-row { flex-direction: column; gap: 4px; }
      .step-left { width: auto; display: flex; align-items: baseline; gap: 8px; }
      .step-right { border-left: none; padding-left: 0; }
      .entry-main { flex-direction: column; }
      .docs-col { width: 100%; border-left: none; padding-left: 0; border-top: 1px solid #F1F5F9; padding-top: 6px; }
    }

    .badge { font-size: 12px; padding: 2px 7px; border-radius: 4px; border: 1px solid transparent; font-weight: 500; display: inline-block; }
    .st-todo { background: #FEF2F2; color: #B91C1C; border-color: #FECACA; }
    .st-appoint { background: #EFF6FF; color: #1D4ED8; border-color: #BFDBFE; }
    .st-wait { background: #FFFBEB; color: #B45309; border-color: #FDE68A; }
    .st-done { background: #ECFDF5; color: #047857; border-color: #A7F3D0; }
    .sync-ok { background: #ECFDF5; color: #047857; border-color: #A7F3D0; }
    .sync-err { background: #FEF2F2; color: #B91C1C; border-color: #FECACA; }

    .thumbs { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 2px; }
    .thumb-box { width: 56px; height: 56px; border-radius: 4px; border: 1px solid #CBD5E1; overflow: hidden; flex-shrink: 0; cursor: pointer; background: #F1F5F9; }
    .thumb-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .fu-box { margin-top: 8px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 6px 10px; font-size: 12px; }
    .fu-log { background: #FFF; border: 1px solid #E2E8F0; border-radius: 4px; padding: 4px 8px; margin-top: 4px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,0.55); z-index: 50; overflow-y: auto; padding: 16px 10px; display: flex; align-items: flex-start; justify-content: center; }
    .modal-box { background: #FFF; border: 1px solid #CBD5E1; border-radius: 8px; width: 100%; max-width: 740px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    .modal-sm { max-width: 500px; }
    .modal-head { background: #F8FAFC; border-bottom: 1px solid #E2E8F0; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; }
    .modal-body { padding: 14px; }
    .modal-foot { background: #F8FAFC; border-top: 1px solid #E2E8F0; padding: 10px 14px; display: flex; justify-content: flex-end; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .field-label { display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 4px; }

    .canvas-wrapper { width: 100%; background: #E2E8F0; border: 1px solid #CBD5E1; border-radius: 6px; overflow: hidden; touch-action: none; display: flex; justify-content: center; }
    canvas { max-width: 100%; max-height: 52vh; display: block; cursor: crosshair; }
    .color-dot { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #64748B; cursor: pointer; padding: 0; }
    .hidden { display: none !important; }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 90; background: #0F172A; color: #FFF; padding: 8px 14px; border-radius: 6px; font-size: 12px; }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="container row-between">
      <div class="row">
        <span class="t-site">築匠設計 ARTISAN STUDIO</span>
        <span style="color:#CBD5E1">|</span>
        <span class="t-meta muted">QC 總報告</span>
        <span id="syncBadge" class="badge" style="background:#F1F5F9;border-color:#E2E8F0;">載入快取...</span>
      </div>
      <div class="row">
        <a href="album.html" target="_blank" class="btn-secondary">截圖工作台 ↗</a>
        <button type="button" onclick="copyPublicLink()" class="btn-secondary">總公開Link</button>
        <button type="button" onclick="openEditor()" id="newReportBtn" class="btn-primary">+ 新增報告</button>
      </div>
    </div>
  </header>

  <div id="publicBanner" class="hidden" style="background:#1E293B;color:#F8FAFC;padding:6px 0;">
    <div class="container row-between t-meta">
      <span id="bannerText">唯讀檢視模式</span>
      <button type="button" onclick="exitPublicMode()" class="btn-link" style="color:#FFF;">切換編輯模式</button>
    </div>
  </div>

  <main class="container">
    <div class="filter-bar">
      <div class="search-wrap">
        <input type="text" id="searchInput" oninput="renderReportList()" placeholder="搜尋屋苑、負責人、約期或關鍵字..." class="input-ui" />
      </div>
      <select id="siteFilter" onchange="renderReportList()" class="select-ui">
        <option value="ALL">全部單位</option>
      </select>
      <select id="statusFilter" onchange="renderReportList()" class="select-ui">
        <option value="ALL">全部狀態</option>
        <option value="需跟進">需跟進</option>
        <option value="已約期">已約期</option>
        <option value="待確認">待確認</option>
        <option value="已完成">已完成</option>
      </select>
    </div>

    <div id="reportListContainer">
      <div style="background:#FFF;border:1px solid #E2E8F0;border-radius:8px;padding:24px;text-align:center;" class="muted">載入中...</div>
    </div>
  </main>

  <!-- 彈窗 1：新增 / 編輯報告 -->
  <div id="editorModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-head">
        <span class="t-site" id="editorModalTitle">新增報告</span>
        <button type="button" onclick="closeEditor()" class="btn-link">關閉 ✕</button>
      </div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:10px;">
        <div class="grid-3">
          <div><label class="field-label">屋苑 / 單位 *</label><input type="text" id="fieldSite" placeholder="例如：屯門良景邨良智樓412室" class="input-ui" /></div>
          <div><label class="field-label">@負責人</label><input type="text" id="fieldAssignee" placeholder="例如：@Johnny" class="input-ui" /></div>
          <div>
            <label class="field-label">狀態</label>
            <select id="fieldStatus" class="select-ui" style="width:100%;padding:7px 8px;">
              <option value="需跟進">需跟進</option><option value="已約期">已約期</option><option value="待確認">待確認</option><option value="已完成">已完成</option>
            </select>
          </div>
        </div>

        <div class="grid-3">
          <div><label class="field-label">日期</label><input type="date" id="fieldDate" class="input-ui" /></div>
          <div>
            <label class="field-label">時段（開始 / 結束）</label>
            <div class="grid-2"><input type="time" id="fieldTimeStart" class="input-ui" /><input type="time" id="fieldTimeEnd" class="input-ui" /></div>
          </div>
          <div><label class="field-label">項目重點標題 *</label><input type="text" id="fieldTitle" placeholder="例如：現場睇位及覆尺" class="input-ui" /></div>
        </div>

        <div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:6px;padding:10px;">
          <div class="row-between" style="margin-bottom:6px;">
            <span class="t-meta" style="font-weight:600;">關聯文件 / Google 連結 / 截圖檔（顯示於右側）</span>
            <div class="row">
              <button type="button" onclick="openAlbumFromEditor()" class="btn-primary">+ 開截圖工作台</button>
              <label class="btn-secondary"><span>+ 小PDF</span><input type="file" accept="application/pdf" multiple class="hidden" onchange="handlePdfUpload(event)" /></label>
              <button type="button" onclick="addDocRow()" class="btn-secondary">+ 加網址連結</button>
            </div>
          </div>
          <div id="docRowsContainer" style="display:flex;flex-direction:column;gap:6px;"></div>
        </div>

        <div><label class="field-label">檢查要點 / 事項內容</label><textarea id="fieldSummary" rows="3" placeholder="輸入檢查內容..." class="input-ui"></textarea></div>
        <div><label class="field-label">後續摘要（可留空）</label><input type="text" id="fieldFollowup" placeholder="例如：待工廠回覆修改確認圖" class="input-ui" /></div>

        <div style="border-top:1px solid #E2E8F0;padding-top:10px;">
          <div class="row-between" style="margin-bottom:8px;">
            <span style="font-weight:600;">單張相片與手繪（支援 Ctrl+V 貼圖；多張連續截圖請用上方「截圖工作台」）</span>
            <div class="row">
              <label class="btn-secondary"><span>拍照</span><input type="file" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoUpload(event)" /></label>
              <label class="btn-secondary"><span>上傳相片</span><input type="file" accept="image/*" multiple class="hidden" onchange="handlePhotoUpload(event)" /></label>
              <button type="button" onclick="createBlankSketch()" class="btn-secondary">+ 草圖板</button>
            </div>
          </div>

          <div id="annotationWorkspace" class="hidden" style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:6px;padding:8px;margin-bottom:8px;">
            <div class="row-between" style="margin-bottom:6px;">
              <div class="row">
                <button type="button" onclick="setTool('freehand')" id="tool-freehand" class="btn-secondary btn-active">✎ 手繪</button>
                <button type="button" onclick="setTool('circle')" id="tool-circle" class="btn-secondary">◯ 線圈</button>
                <button type="button" onclick="setTool('arrow')" id="tool-arrow" class="btn-secondary">↗ 箭咀</button>
                <button type="button" onclick="setTool('text')" id="tool-text" class="btn-secondary">T 打字</button>
              </div>
              <div class="row">
                <button type="button" onclick="setColor('rgba(220,38,38,0.9)')" class="color-dot" style="background:#DC2626;"></button>
                <button type="button" onclick="setColor('rgba(37,99,235,0.9)')" class="color-dot" style="background:#2563EB;"></button>
                <button type="button" onclick="setColor('rgba(234,179,8,0.95)')" class="color-dot" style="background:#EAB308;"></button>
                <button type="button" onclick="setColor('rgba(15,23,42,0.9)')" class="color-dot" style="background:#0F172A;"></button>
                <button type="button" onclick="undoShape()" class="btn-secondary">復原</button>
                <button type="button" onclick="clearShapes()" class="btn-secondary">清除</button>
              </div>
            </div>
            <div id="textInputBar" class="hidden" style="margin-bottom:6px;">
              <input type="text" id="canvasTextInput" placeholder="輸入尺寸或文字後，點擊畫布貼上..." class="input-ui t-meta" />
            </div>
            <div class="canvas-wrapper"><canvas id="annotCanvas"></canvas></div>
            <input type="text" id="currentPhotoNote" oninput="syncCurrentPhotoNote()" placeholder="相片說明..." class="input-ui t-meta" style="margin-top:6px;" />
          </div>
          <div id="photoThumbList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" onclick="closeEditor()" class="btn-secondary">取消</button>
        <button type="button" id="saveReportBtn" onclick="saveReport()" class="btn-primary">儲存同步</button>
      </div>
    </div>
  </div>

  <!-- 彈窗 2：約期 / 留言 -->
  <div id="followupModal" class="modal-backdrop hidden">
    <div class="modal-box modal-sm">
      <div class="modal-head">
        <span class="t-site" id="followupModalTitle">新增留言</span>
        <button type="button" onclick="closeFollowupModal()" class="btn-link">關閉 ✕</button>
      </div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:10px;">
        <div id="followupTargetTitle" class="t-meta" style="font-weight:600;background:#F8FAFC;padding:6px 8px;border-radius:4px;border:1px solid #E2E8F0;"></div>
        <div id="followupHistoryList" style="max-height:160px;overflow-y:auto;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:6px;padding:6px;"></div>
        <div class="grid-2">
          <div><label class="field-label">名字 *</label><input type="text" id="fuAuthor" placeholder="例如：Johnny" class="input-ui t-meta" /></div>
          <div>
            <label class="field-label">更新狀態</label>
            <select id="fuNewStatus" class="select-ui" style="width:100%;padding:7px 8px;">
              <option value="KEEP">保持原狀態</option><option value="已約期">已約期</option><option value="需跟進">需跟進</option><option value="待確認">待確認</option><option value="已完成">已完成</option>
            </select>
          </div>
        </div>
        <div id="appointFieldsWrap" class="grid-2 hidden">
          <div><label class="field-label">預約日期 *</label><input type="date" id="fuDate" class="input-ui t-meta" /></div>
          <div>
            <label class="field-label">時段（開始 / 結束）</label>
            <div class="grid-2"><input type="time" id="fuTimeStart" class="input-ui t-meta" style="padding:5px;" /><input type="time" id="fuTimeEnd" class="input-ui t-meta" style="padding:5px;" /></div>
          </div>
        </div>
        <div><label class="field-label" id="fuMsgLabel">留言內容 *</label><textarea id="fuMessage" rows="2" placeholder="輸入內容..." class="input-ui"></textarea></div>
      </div>
      <div class="modal-foot">
        <button type="button" onclick="closeFollowupModal()" class="btn-secondary">取消</button>
        <button type="button" id="submitFollowupBtn" onclick="submitFollowupLog()" class="btn-primary">發送</button>
      </div>
    </div>
  </div>

  <!-- 彈窗 3：單份檢視 -->
  <div id="viewModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-head">
        <span class="t-site" id="viewModalHeader">報告詳情</span>
        <div class="row">
          <button type="button" onclick="copySingleReportSummary()" class="btn-link">複製重點</button>
          <button type="button" onclick="copySingleReportLink()" class="btn-link blue">複製Link</button>
          <button type="button" onclick="closeViewModal()" class="btn-link">關閉 ✕</button>
        </div>
      </div>
      <div id="viewModalBody" class="modal-body" style="display:flex;flex-direction:column;gap:12px;"></div>
    </div>
  </div>

  <!-- 彈窗 4：地址自選分享（整個地址 / 單一日期 / 獨立檔案） -->
  <div id="shareModal" class="modal-backdrop hidden">
    <div class="modal-box modal-sm">
      <div class="modal-head">
        <span class="t-site" id="shareModalTitle">分享單位內容</span>
        <button type="button" onclick="closeShareModal()" class="btn-link">關閉 ✕</button>
      </div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:12px;" id="shareModalBody"></div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCSRfZdAVh8ADPNtayW5lyDtmE0xDsJXNg",
      authDomain: "gen-lang-client-0208380044.firebaseapp.com",
      databaseURL: "https://gen-lang-client-0208380044-default-rtdb.firebaseio.com",
      projectId: "gen-lang-client-0208380044",
      storageBucket: "gen-lang-client-0208380044.firebasestorage.app",
      messagingSenderId: "17077391191",
      appId: "1:17077391191:web:cb936dd1bfe98b2f3d7812"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(() => {});

    const COLLECTION_NAME = 'artisan_qc_reports';
    const STATUS_ORDER = ['需跟進', '已約期', '待確認', '已完成'];

    let reports = [];
    let expandedSites = new Set();
    let inlineEditId = null, editingReportId = null, viewingReportId = null, followupTargetId = null;
    let followupModalMode = 'comment', initialRouteHandled = false;
    let draftDocs = [], draftPhotos = [], activePhotoIndex = -1;
    let currentTool = 'freehand', currentColor = 'rgba(220,38,38,0.9)';
    let isDrawing = false, startX = 0, startY = 0, currentStroke = [], baseImageObj = null;

    const canvas = document.getElementById('annotCanvas');
    const ctx = canvas.getContext('2d');

    function setSyncStatus(text, ok = true) {
      const el = document.getElementById('syncBadge');
      el.textContent = text;
      el.className = 'badge ' + (ok ? 'sync-ok' : 'sync-err');
    }

    function startRealtimeSync() {
      db.collection(COLLECTION_NAME).orderBy('createdAt', 'desc').onSnapshot((snap) => {
        setSyncStatus(snap.metadata.fromCache ? '快取秒開' : '已同步', true);
        reports = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        updateSiteFilterOptions();
        renderReportList();
        if (!initialRouteHandled) { initialRouteHandled = true; checkUrlParams(); }
      }, () => setSyncStatus('離線', false));
    }

    window.addEventListener('paste', (e) => {
      if (document.getElementById('editorModal').classList.contains('hidden')) return;
      for (const item of (e.clipboardData || window.clipboardData).items) {
        if (item.type.indexOf('image') !== -1) processImageFile(item.getAsFile());
      }
    });

    function openAlbumWorkspace(siteName = '', dateStr = '', reportId = '') {
      const url = new URL('album.html', window.location.href);
      if (siteName) url.searchParams.set('site', siteName);
      if (dateStr) url.searchParams.set('date', dateStr);
      if (reportId) url.searchParams.set('reportId', reportId);
      window.open(url.toString(), '_blank');
    }

    function openAlbumFromEditor() {
      const site = document.getElementById('fieldSite').value.trim();
      const date = document.getElementById('fieldDate').value;
      openAlbumWorkspace(site, date, editingReportId || '');
    }

    function checkUrlParams() {
      const params = new URLSearchParams(window.location.search);
      const isPublic = params.get('view') === 'public';
      const reportId = params.get('reportId');
      const siteParam = params.get('site');
      const dateParam = params.get('date');

      if (siteParam) {
        const sel = document.getElementById('siteFilter');
        if ([...sel.options].some(o => o.value === siteParam)) sel.value = siteParam;
      }
      if (dateParam) document.getElementById('searchInput').value = dateParam;

      if (isPublic || reportId) {
        document.getElementById('publicBanner').classList.remove('hidden');
        document.getElementById('newReportBtn').classList.add('hidden');
        document.getElementById('bannerText').textContent = siteParam ? `唯讀檢視：${siteParam}${dateParam ? ' (' + dateParam + ')' : ''}` : '唯讀檢視模式';
      }
      renderReportList();
      if (reportId && reports.find(r => r.id === reportId)) openViewModal(reportId);
    }

    function exitPublicMode() {
      const url = new URL(window.location.href);
      url.search = '';
      window.history.replaceState({}, '', url);
      document.getElementById('publicBanner').classList.add('hidden');
      document.getElementById('newReportBtn').classList.remove('hidden');
      document.getElementById('searchInput').value = '';
      renderReportList();
    }

    function copyPublicLink() {
      const url = new URL(window.location.href); url.search = '?view=public';
      copyText(url.toString(), '已複製總公開 Link');
    }

    function copySingleReportLink() {
      if (!viewingReportId) return;
      const url = new URL(window.location.href); url.search = `?view=public&reportId=${viewingReportId}`;
      copyText(url.toString(), '已複製單日報告 Link');
    }

    // 自選分享彈窗：整個單位 / 指定日期 / 獨立檔案
    function openShareModal(siteName) {
      const items = reports.filter(r => r.site === siteName).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      const base = new URL(window.location.href);
      base.search = `?view=public&site=${encodeURIComponent(siteName)}`;

      const allDocs = [];
      items.forEach(r => getDocsList(r).forEach(d => { if (d.url) allDocs.push({ date: r.date, name: d.name, url: d.url }); }));

      document.getElementById('shareModalTitle').textContent = `分享：${siteName}`;
      document.getElementById('shareModalBody').innerHTML = `
        <div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:6px;padding:10px;">
          <div style="font-weight:700;margin-bottom:6px;">1. 分享整個地址（共 ${items.length} 條日期紀錄）</div>
          <div class="row">
            <button type="button" onclick="copyText('${escapeAttr(base.toString())}', '已複製整個地址 Link')" class="btn-primary">複製地址 Link</button>
            <button type="button" onclick="copySiteClipboardSummary(decodeURIComponent('${encodeURIComponent(siteName)}'))" class="btn-secondary">複製文字重點</button>
          </div>
        </div>
        <div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:6px;padding:10px;">
          <div style="font-weight:700;margin-bottom:6px;">2. 只分享單一日期紀錄</div>
          <div style="display:flex;flex-direction:column;gap:6px;max-height:150px;overflow-y:auto;">
            ${items.map(r => {
              const rUrl = new URL(window.location.href); rUrl.search = `?view=public&reportId=${r.id}`;
              return `<div class="row-between" style="background:#FFF;padding:5px 8px;border:1px solid #E2E8F0;border-radius:4px;">
                <span class="t-meta"><b class="t-mono">${escapeHtml(r.date)}</b> ${escapeHtml(r.title)}</span>
                <button type="button" onclick="copyText('${escapeAttr(rUrl.toString())}', '已複製 ${escapeAttr(r.date)} Link')" class="btn-link blue">複製Link</button>
              </div>`;
            }).join('')}
          </div>
        </div>
        <div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:6px;padding:10px;">
          <div style="font-weight:700;margin-bottom:6px;">3. 只分享獨立檔案 / 截圖相簿</div>
          ${allDocs.length === 0 ? `<div class="t-meta muted">此地址暫無獨立附件檔案</div>` : `
            <div style="display:flex;flex-direction:column;gap:6px;max-height:150px;overflow-y:auto;">
              ${allDocs.map(d => {
                const fullUrl = d.url.startsWith('http') ? d.url : new URL(d.url, window.location.href).toString();
                return `<div class="row-between" style="background:#FFF;padding:5px 8px;border:1px solid #E2E8F0;border-radius:4px;">
                  <span class="t-meta"><span class="muted t-mono">${escapeHtml(d.date)}</span> ${escapeHtml(d.name)}</span>
                  <button type="button" onclick="copyText('${escapeAttr(fullUrl)}', '已複製檔案 Link')" class="btn-link blue">複製檔案Link</button>
                </div>`;
              }).join('')}
            </div>`}
        </div>`;
      document.getElementById('shareModal').classList.remove('hidden');
    }
    function closeShareModal() { document.getElementById('shareModal').classList.add('hidden'); }

    function copySiteClipboardSummary(siteName) {
      const items = reports.filter(r => r.site === siteName).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      if (!items.length) return;
      const shareUrl = new URL(window.location.href); shareUrl.search = `?view=public&site=${encodeURIComponent(siteName)}`;
      const lines = [`【築匠設計 QC 重點】${siteName}${items[0].assignee ? ' (' + items[0].assignee + ')' : ''}`];
      items.forEach(r => {
        lines.push(`▸ ${r.date}${r.timeRange ? ' ' + r.timeRange : ''} [${r.status}] ${r.title}`);
        if (r.summary) lines.push(`  內容：${r.summary.replace(/\n/g, ' / ')}`);
        getDocsList(r).forEach(d => {
          if (d.url && !d.url.startsWith('data:')) lines.push(`  檔案：${d.name} -> ${d.url.startsWith('http') ? d.url : new URL(d.url, window.location.href).toString()}`);
        });
      });
      lines.push(`總覽連結：${shareUrl.toString()}`);
      copyText(lines.join('\n'), '已複製重點記錄');
    }

    function copySingleReportSummary() {
      const r = reports.find(rep => rep.id === viewingReportId); if (!r) return;
      const shareUrl = new URL(window.location.href); shareUrl.search = `?view=public&reportId=${r.id}`;
      const lines = [`【築匠設計 QC 重點】${r.site}`, `日期：${r.date} [${r.status}] ${r.title}`];
      if (r.summary) lines.push(r.summary);
      lines.push(`連結：${shareUrl.toString()}`);
      copyText(lines.join('\n'), '已複製重點');
    }

    function copyText(text, msg) {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => showToast(msg));
      else { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast(msg); }
    }

    function showToast(msg) {
      const el = document.getElementById('toast'); el.textContent = msg; el.classList.remove('hidden');
      clearTimeout(window._t); window._t = setTimeout(() => el.classList.add('hidden'), 2000);
    }

    function updateSiteFilterOptions() {
      const select = document.getElementById('siteFilter'), cur = select.value;
      const sites = [...new Set(reports.map(r => r.site).filter(Boolean))];
      select.innerHTML = '<option value="ALL">全部單位</option>' + sites.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
      if (sites.includes(cur)) select.value = cur;
    }

    function getStatusClass(st) {
      if (st === '需跟進') return 'st-todo';
      if (st === '已約期') return 'st-appoint';
      if (st === '待確認') return 'st-wait';
      return 'st-done';
    }

    function getDocsList(r) {
      if (Array.isArray(r.docs) && r.docs.length > 0) return r.docs;
      if (r.docName) return [{ name: r.docName, url: r.docUrl || '' }];
      return [];
    }

    function parseTimeRange(str) {
      const m = (str || '').match(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/);
      return m ? { start: m[1].padStart(5, '0'), end: m[2].padStart(5, '0') } : { start: '', end: '' };
    }

    function formatTimeRange(s, e) { return (s && e) ? `${s} - ${e}` : (s || e || ''); }

    async function cycleStatus(id) {
      const rep = reports.find(r => r.id === id); if (!rep) return;
      const next = STATUS_ORDER[(STATUS_ORDER.indexOf(rep.status) + 1) % STATUS_ORDER.length];
      await db.collection(COLLECTION_NAME).doc(id).update({ status: next, updatedAt: Date.now() });
      showToast(`狀態：${next}`);
    }

    async function quickEditSiteHeader(oldSite, oldAssignee) {
      const newSite = prompt('修改單位名稱：', oldSite);
      if (!newSite || !newSite.trim()) return;
      const newAssignee = prompt('修改 @負責人：', oldAssignee || '');
      if (newAssignee === null) return;
      const batch = db.batch();
      reports.filter(r => r.site === oldSite).forEach(r => batch.update(db.collection(COLLECTION_NAME).doc(r.id), { site: newSite.trim(), assignee: newAssignee.trim(), updatedAt: Date.now() }));
      await batch.commit(); showToast('已更新');
    }

    function startInlineEdit(id) { inlineEditId = id; renderReportList(); }
    function cancelInlineEdit() { inlineEditId = null; renderReportList(); }
    async function saveInlineEdit(id) {
      const title = document.getElementById(`ie-title-${id}`).value.trim();
      if (!title) return showToast('標題不能為空');
      await db.collection(COLLECTION_NAME).doc(id).update({
        date: document.getElementById(`ie-date-${id}`).value,
        timeRange: formatTimeRange(document.getElementById(`ie-ts-${id}`).value, document.getElementById(`ie-te-${id}`).value),
        title,
        summary: document.getElementById(`ie-sum-${id}`).value.trim(),
        followup: document.getElementById(`ie-fu-${id}`).value.trim(),
        updatedAt: Date.now()
      });
      inlineEditId = null; showToast('已儲存');
    }

    function toggleExpandSite(s) { expandedSites.has(s) ? expandedSites.delete(s) : expandedSites.add(s); renderReportList(); }

    function renderFollowupBlock(r) {
      const logs = Array.isArray(r.followupLogs) ? r.followupLogs : [];
      const head = (r.followup && r.followup.trim()) ? escapeHtml(r.followup) : (logs.length ? `共 ${logs.length} 條紀錄` : `<span class="muted">暫無跟進</span>`);
      return `<div class="fu-box">
        <div class="row"><button type="button" onclick="openFollowupModal('${r.id}','comment')" class="btn-link">+ 留言</button><span style="color:#CBD5E1">|</span><span><b>後續：</b>${head}</span></div>
        ${logs.map(l => `<div class="fu-log"><span><b>${escapeHtml(l.author)}</b> ${l.appointDate ? `<span class="badge st-appoint">約期 ${escapeHtml(l.appointDate)} ${escapeHtml(l.appointTime||'')}</span> ` : ''}${escapeHtml(l.message)}</span><span class="muted t-mono">${escapeHtml(l.createdAtStr||'')}</span></div>`).join('')}
      </div>`;
    }

    function renderReportList() {
      const container = document.getElementById('reportListContainer');
      const kw = document.getElementById('searchInput').value.trim().toLowerCase();
      const siteVal = document.getElementById('siteFilter').value;
      const statusVal = document.getElementById('statusFilter').value;
      const isPublic = new URLSearchParams(window.location.search).get('view') === 'public';

      const filtered = reports.filter(r => {
        if (siteVal !== 'ALL' && r.site !== siteVal) return false;
        if (statusVal !== 'ALL' && r.status !== statusVal) return false;
        if (kw) {
          const hay = `${r.site} ${r.assignee||''} ${r.date||''} ${r.title} ${r.summary||''} ${getDocsList(r).map(d=>d.name).join(' ')} ${(r.followupLogs||[]).map(l=>l.message+' '+l.appointDate).join(' ')}`.toLowerCase();
          if (!hay.includes(kw)) return false;
        }
        return true;
      });

      if (!filtered.length) {
        container.innerHTML = `<div style="background:#FFF;border:1px solid #E2E8F0;border-radius:8px;padding:24px;text-align:center;" class="muted">暫無紀錄</div>`;
        return;
      }

      const groups = [], map = {};
      filtered.forEach(r => {
        const k = r.site || '未分類單位';
        if (!map[k]) { map[k] = { site: k, assignee: r.assignee || '', items: [] }; groups.push(map[k]); }
        map[k].items.push(r);
      });
      groups.forEach(g => g.items.sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0)));

      container.innerHTML = groups.map(g => {
        const encSite = encodeURIComponent(g.site), encAss = encodeURIComponent(g.assignee || g.items[0].assignee || '');
        const isExp = expandedSites.has(g.site);
        const vis = isExp ? g.items : g.items.slice(0, 3);

        const rowsHtml = vis.map((r, idx) => {
          const pCount = (r.photos || []).length, docs = getDocsList(r), stCls = getStatusClass(r.status);
          if (!isPublic && inlineEditId === r.id) {
            const pt = parseTimeRange(r.timeRange);
            return `<div class="entry-row">
              <div class="step-left"><input type="date" id="ie-date-${r.id}" value="${escapeHtml(r.date||'')}" class="input-ui t-meta" style="margin-bottom:4px;" />
                <div class="grid-2"><input type="time" id="ie-ts-${r.id}" value="${pt.start}" class="input-ui t-meta" style="padding:3px;" /><input type="time" id="ie-te-${r.id}" value="${pt.end}" class="input-ui t-meta" style="padding:3px;" /></div>
              </div>
              <div class="step-right" style="display:flex;flex-direction:column;gap:6px;">
                <input type="text" id="ie-title-${r.id}" value="${escapeHtml(r.title||'')}" class="input-ui" style="font-weight:700;" />
                <textarea id="ie-sum-${r.id}" rows="2" class="input-ui">${escapeHtml(r.summary||'')}</textarea>
                <input type="text" id="ie-fu-${r.id}" value="${escapeHtml(r.followup||'')}" placeholder="後續摘要" class="input-ui t-meta" />
                <div class="row" style="justify-content:flex-end;"><button type="button" onclick="cancelInlineEdit()" class="btn-link">取消</button><button type="button" onclick="saveInlineEdit('${r.id}')" class="btn-link blue">✓ 儲存</button></div>
              </div>
            </div>`;
          }

          const docsHtml = docs.length ? `<div class="docs-col"><div class="t-meta muted" style="font-weight:600;margin-bottom:4px;">文件 / 截圖檔</div>
            ${docs.map(d => d.url ? `<a href="${escapeHtml(d.url)}" target="_blank" class="btn-link blue" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(d.name)}">📄 ${escapeHtml(d.name)} ↗</a>` : `<span class="t-meta">${escapeHtml(d.name)}</span>`).join('')}
          </div>` : '';

          const thumbsHtml = pCount ? `<div class="thumbs">${r.photos.map(p => `<div onclick="openViewModal('${r.id}')" class="thumb-box"><img loading="lazy" decoding="async" src="${p.base64Annotated||p.base64Raw}" /></div>`).join('')}</div>` : '';

          return `<div class="entry-row">
            <div class="step-left">
              <div class="t-mono" style="font-weight:700;">${escapeHtml(r.date)}</div>
              ${r.timeRange ? `<div class="t-meta t-mono muted">${escapeHtml(r.timeRange)}</div>` : ''}
            </div>
            <div class="step-right">
              <div class="row-between">
                ${!isPublic ? `<button type="button" onclick="cycleStatus('${r.id}')" class="badge ${stCls}" style="cursor:pointer;">${escapeHtml(r.status)} ↻</button>` : `<span class="badge ${stCls}">${escapeHtml(r.status)}</span>`}
                <div class="row">
                  ${idx === 0 ? `<button type="button" onclick="openFollowupModal('${r.id}','appoint')" class="btn-link blue">+ 約期</button>` : ''}
                  ${!isPublic ? `<button type="button" onclick="openAlbumWorkspace(decodeURIComponent('${encSite}'),'${escapeAttr(r.date)}','${r.id}')" class="btn-link blue">+ 截圖檔</button>` : ''}
                  <button type="button" onclick="openViewModal('${r.id}')" class="btn-link">檢視(${pCount})</button>
                  ${!isPublic ? `<button type="button" onclick="startInlineEdit('${r.id}')" class="btn-link">快改</button><button type="button" onclick="openEditor('${r.id}')" class="btn-link">詳編</button><button type="button" onclick="deleteReport('${r.id}')" class="btn-link danger muted">刪</button>` : ''}
                </div>
              </div>
              <div class="entry-main">
                <div class="entry-content">
                  <div style="font-weight:700;">${escapeHtml(r.title)}</div>
                  ${r.summary ? `<div style="color:#475569;white-space:pre-line;margin-top:2px;">${escapeHtml(r.summary)}</div>` : ''}
                  ${thumbsHtml}
                  ${renderFollowupBlock(r)}
                </div>
                ${docsHtml}
              </div>
            </div>
          </div>`;
        }).join('');

        return `<div class="site-card">
          <div class="site-header row-between">
            <div class="row">
              <span class="t-site">${escapeHtml(g.site)}</span>
              ${g.assignee ? `<span class="badge" style="background:#E2E8F0;color:#1E293B;">${escapeHtml(g.assignee)}</span>` : ''}
              ${!isPublic ? `<button type="button" onclick="quickEditSiteHeader(decodeURIComponent('${encSite}'),decodeURIComponent('${encAss}'))" class="btn-link muted" style="text-decoration:none;">✎</button>` : ''}
            </div>
            <div class="row">
              ${!isPublic ? `<button type="button" onclick="openEditorForSite(decodeURIComponent('${encSite}'),decodeURIComponent('${encAss}'))" class="btn-primary">+ 新增日期</button>` : ''}
              <button type="button" onclick="openAlbumWorkspace(decodeURIComponent('${encSite}'))" class="btn-link blue">截圖工作台 ↗</button>
              <button type="button" onclick="copySiteClipboardSummary(decodeURIComponent('${encSite}'))" class="btn-link">複製重點</button>
              <button type="button" onclick="openShareModal(decodeURIComponent('${encSite}'))" class="btn-link">分享</button>
            </div>
          </div>
          <div class="site-body">
            ${rowsHtml}
            ${g.items.length > 3 ? `<div style="text-align:center;margin-top:10px;padding-top:8px;border-top:1px solid #F1F5F9;"><button type="button" onclick="toggleExpandSite(decodeURIComponent('${encSite}'))" class="btn-link muted">${isExp ? '收合舊紀錄 ▴' : `展開其餘 ${g.items.length - 3} 條紀錄 ▾`}</button></div>` : ''}
          </div>
        </div>`;
      }).join('');
    }

    function openFollowupModal(id, mode = 'comment') {
      const r = reports.find(x => x.id === id); if (!r) return;
      followupTargetId = id; followupModalMode = mode;
      const isAp = mode === 'appoint';
      document.getElementById('followupModalTitle').textContent = isAp ? '預約跟進時間' : '新增留言';
      document.getElementById('fuMsgLabel').textContent = isAp ? '約期說明 *' : '留言內容 *';
      document.getElementById('appointFieldsWrap').classList.toggle('hidden', !isAp);
      document.getElementById('followupTargetTitle').textContent = `${r.site} (${r.date}) — ${r.title}`;
      document.getElementById('fuAuthor').value = localStorage.getItem('artisan_user_name') || '';
      document.getElementById('fuDate').value = ''; document.getElementById('fuTimeStart').value = ''; document.getElementById('fuTimeEnd').value = '';
      document.getElementById('fuNewStatus').value = isAp ? '已約期' : 'KEEP';
      document.getElementById('fuMessage').value = '';
      const logs = r.followupLogs || [];
      document.getElementById('followupHistoryList').innerHTML = logs.length ? logs.map(l => `<div class="fu-log"><span><b>${escapeHtml(l.author)}</b> ${l.appointDate ? `[約期 ${escapeHtml(l.appointDate)}] ` : ''}${escapeHtml(l.message)}</span><span class="muted t-mono">${escapeHtml(l.createdAtStr||'')}</span></div>`).join('') : '<div class="t-meta muted" style="text-align:center;">暫無紀錄</div>';
      document.getElementById('followupModal').classList.remove('hidden');
    }
    function closeFollowupModal() { document.getElementById('followupModal').classList.add('hidden'); }

    async function submitFollowupLog() {
      const author = document.getElementById('fuAuthor').value.trim(), message = document.getElementById('fuMessage').value.trim();
      const newSt = document.getElementById('fuNewStatus').value;
      let appointDate = '', appointTime = '';
      if (followupModalMode === 'appoint') {
        appointDate = document.getElementById('fuDate').value;
        appointTime = formatTimeRange(document.getElementById('fuTimeStart').value, document.getElementById('fuTimeEnd').value);
        if (!appointDate) return showToast('請揀選預約日期');
      }
      if (!author || !message) return showToast('請填寫名字及內容');
      localStorage.setItem('artisan_user_name', author);
      const now = new Date(), timeStr = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      const rep = reports.find(r => r.id === followupTargetId);
      const upd = { followupLogs: [...(rep.followupLogs||[]), { id: 'log-'+Date.now(), author, appointDate, appointTime, message, createdAtStr: timeStr }], updatedAt: Date.now() };
      if (newSt !== 'KEEP') upd.status = newSt;
      await db.collection(COLLECTION_NAME).doc(followupTargetId).update(upd);
      closeFollowupModal(); showToast('已同步');
    }

    function renderDocRows() {
      const c = document.getElementById('docRowsContainer');
      if (!draftDocs.length) { c.innerHTML = `<div class="t-meta muted">未附加檔案（可開截圖工作台或貼 Google Drive 連結）</div>`; return; }
      c.innerHTML = draftDocs.map((d, i) => `<div style="display:grid;grid-template-columns:5fr 6fr 28px;gap:6px;align-items:center;">
        <input type="text" value="${escapeHtml(d.name)}" oninput="draftDocs[${i}].name=this.value" placeholder="檔案名稱" class="input-ui t-meta" />
        <input type="text" value="${escapeHtml(d.url)}" oninput="draftDocs[${i}].url=this.value" placeholder="https://..." class="input-ui t-meta" />
        <button type="button" onclick="removeDocRow(${i})" class="btn-link danger">✕</button>
      </div>`).join('');
    }
    function addDocRow(name = '', url = '') { draftDocs.push({ name, url }); renderDocRows(); }
    function removeDocRow(i) { draftDocs.splice(i, 1); renderDocRows(); }
    function handlePdfUpload(e) {
      Array.from(e.target.files || []).forEach(f => {
        if (f.size > 650 * 1024) return showToast('超過 650KB 請貼 Google Drive 連結或用截圖工作台');
        const rd = new FileReader(); rd.onload = ev => { addDocRow(f.name, ev.target.result); showToast('已載入'); }; rd.readAsDataURL(f);
      });
      e.target.value = '';
    }

    function openEditorForSite(site, ass) { openEditor(null); document.getElementById('fieldSite').value = site; document.getElementById('fieldAssignee').value = ass || ''; }
    function openEditor(id = null) {
      editingReportId = id; draftPhotos = []; draftDocs = []; activePhotoIndex = -1;
      if (id) {
        const r = reports.find(x => x.id === id); if (!r) return;
        document.getElementById('editorModalTitle').textContent = '編輯報告';
        document.getElementById('fieldSite').value = r.site || ''; document.getElementById('fieldAssignee').value = r.assignee || '';
        document.getElementById('fieldDate').value = r.date || '';
        const pt = parseTimeRange(r.timeRange); document.getElementById('fieldTimeStart').value = pt.start; document.getElementById('fieldTimeEnd').value = pt.end;
        document.getElementById('fieldStatus').value = r.status || '需跟進'; document.getElementById('fieldTitle').value = r.title || '';
        document.getElementById('fieldSummary').value = r.summary || ''; document.getElementById('fieldFollowup').value = r.followup || '';
        draftDocs = JSON.parse(JSON.stringify(getDocsList(r))); draftPhotos = JSON.parse(JSON.stringify(r.photos || []));
      } else {
        document.getElementById('editorModalTitle').textContent = '新增報告';
        ['fieldSite','fieldAssignee','fieldTimeStart','fieldTimeEnd','fieldTitle','fieldSummary','fieldFollowup'].forEach(k => document.getElementById(k).value = '');
        document.getElementById('fieldDate').value = new Date().toISOString().split('T')[0]; document.getElementById('fieldStatus').value = '需跟進';
      }
      renderDocRows(); renderPhotoThumbList();
      if (draftPhotos.length) selectPhotoForAnnotation(0); else document.getElementById('annotationWorkspace').classList.add('hidden');
      document.getElementById('editorModal').classList.remove('hidden');
    }
    function closeEditor() { document.getElementById('editorModal').classList.add('hidden'); }

    function handlePhotoUpload(e) { Array.from(e.target.files || []).forEach(processImageFile); e.target.value = ''; }
    function processImageFile(file) {
      if (!file) return;
      const rd = new FileReader();
      rd.onload = ev => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height, m = 960;
          if (w > m || h > m) { if (w > h) { h = Math.round(h * m / w); w = m; } else { w = Math.round(w * m / h); h = m; } }
          const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
          const b64 = c.toDataURL('image/jpeg', 0.72);
          draftPhotos.push({ id: 'ph-'+Date.now(), base64Raw: b64, base64Annotated: b64, shapes: [], note: '' });
          renderPhotoThumbList(); selectPhotoForAnnotation(draftPhotos.length - 1);
        };
        img.src = ev.target.result;
      };
      rd.readAsDataURL(file);
    }

    function createBlankSketch() {
      const c = document.createElement('canvas'); c.width = 800; c.height = 550;
      const cx = c.getContext('2d'); cx.fillStyle = '#FFF'; cx.fillRect(0,0,800,550);
      const b64 = c.toDataURL('image/jpeg', 0.85);
      draftPhotos.push({ id: 'sk-'+Date.now(), base64Raw: b64, base64Annotated: b64, shapes: [], note: '草圖' });
      renderPhotoThumbList(); selectPhotoForAnnotation(draftPhotos.length - 1);
    }

    function renderPhotoThumbList() {
      document.getElementById('photoThumbList').innerHTML = draftPhotos.map((p, i) => `
        <div onclick="selectPhotoForAnnotation(${i})" style="border:2px solid ${i===activePhotoIndex?'#0F172A':'#CBD5E1'};border-radius:6px;overflow:hidden;cursor:pointer;">
          <img src="${p.base64Annotated||p.base64Raw}" style="width:100%;height:72px;object-fit:cover;display:block;" />
          <div class="row-between t-meta" style="padding:2px 6px;background:#FFF;"><span>#${i+1}</span><button type="button" onclick="removeDraftPhoto(event,${i})" class="btn-link danger">✕</button></div>
        </div>`).join('');
    }
    function removeDraftPhoto(e, i) { e.stopPropagation(); draftPhotos.splice(i, 1); activePhotoIndex = draftPhotos.length ? 0 : -1; renderPhotoThumbList(); if (activePhotoIndex >= 0) selectPhotoForAnnotation(0); else document.getElementById('annotationWorkspace').classList.add('hidden'); }
    function selectPhotoForAnnotation(i) {
      activePhotoIndex = i; const p = draftPhotos[i]; if (!p) return;
      if (!p.base64Raw) p.base64Raw = p.base64Annotated;
      document.getElementById('annotationWorkspace').classList.remove('hidden');
      document.getElementById('currentPhotoNote').value = p.note || ''; renderPhotoThumbList();
      baseImageObj = new Image(); baseImageObj.onload = () => { canvas.width = baseImageObj.width; canvas.height = baseImageObj.height; redrawCanvas(); }; baseImageObj.src = p.base64Raw;
    }
    function syncCurrentPhotoNote() { if (activePhotoIndex >= 0) draftPhotos[activePhotoIndex].note = document.getElementById('currentPhotoNote').value; }
    function setTool(t) { currentTool = t; ['freehand','circle','arrow','text'].forEach(k => document.getElementById('tool-'+k).classList.toggle('btn-active', k===t)); document.getElementById('textInputBar').classList.toggle('hidden', t!=='text'); }
    function setColor(c) { currentColor = c; }
    function undoShape() { if (activePhotoIndex >= 0) { draftPhotos[activePhotoIndex].shapes.pop(); redrawCanvas(true); } }
    function clearShapes() { if (activePhotoIndex >= 0) { draftPhotos[activePhotoIndex].shapes = []; redrawCanvas(true); } }

    function getCoords(e) { const r = canvas.getBoundingClientRect(), cx = e.touches ? e.touches[0].clientX : e.clientX, cy = e.touches ? e.touches[0].clientY : e.clientY; return { x: (cx - r.left) * (canvas.width / r.width), y: (cy - r.top) * (canvas.height / r.height) }; }
    canvas.addEventListener('mousedown', pDown); canvas.addEventListener('mousemove', pMove); canvas.addEventListener('mouseup', pUp);
    canvas.addEventListener('touchstart', pDown, { passive: false }); canvas.addEventListener('touchmove', pMove, { passive: false }); canvas.addEventListener('touchend', pUp);

    function pDown(e) {
      if (activePhotoIndex < 0) return; e.preventDefault(); const pos = getCoords(e);
      if (currentTool === 'text') { const txt = document.getElementById('canvasTextInput').value.trim(); if (!txt) return showToast('請輸入文字'); draftPhotos[activePhotoIndex].shapes.push({ type: 'text', x: pos.x, y: pos.y, text: txt, color: currentColor }); redrawCanvas(true); return; }
      isDrawing = true; startX = pos.x; startY = pos.y; if (currentTool === 'freehand') currentStroke = [pos];
    }
    function pMove(e) {
      if (!isDrawing || activePhotoIndex < 0) return; e.preventDefault(); const pos = getCoords(e); redrawCanvas(false);
      if (currentTool === 'freehand') { currentStroke.push(pos); drawShape(ctx, { type: 'freehand', points: currentStroke, color: currentColor }); }
      else drawShape(ctx, { type: currentTool, x1: startX, y1: startY, x2: pos.x, y2: pos.y, color: currentColor });
    }
    function pUp(e) {
      if (!isDrawing || activePhotoIndex < 0) return; isDrawing = false;
      if (currentTool === 'freehand') { if (currentStroke.length > 1) draftPhotos[activePhotoIndex].shapes.push({ type: 'freehand', points: currentStroke, color: currentColor }); currentStroke = []; redrawCanvas(true); return; }
      const r = canvas.getBoundingClientRect(), cx = e.changedTouches ? e.changedTouches[0].clientX : e.clientX, cy = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
      const ex = (cx - r.left) * (canvas.width / r.width), ey = (cy - r.top) * (canvas.height / r.height);
      if (Math.hypot(ex - startX, ey - startY) > 6) draftPhotos[activePhotoIndex].shapes.push({ type: currentTool, x1: startX, y1: startY, x2: ex, y2: ey, color: currentColor });
      redrawCanvas(true);
    }
    function redrawCanvas(save = false) {
      if (!baseImageObj || activePhotoIndex < 0) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(baseImageObj, 0, 0);
      (draftPhotos[activePhotoIndex].shapes || []).forEach(s => drawShape(ctx, s));
      if (save) { draftPhotos[activePhotoIndex].base64Annotated = canvas.toDataURL('image/jpeg', 0.78); renderPhotoThumbList(); }
    }
    function drawShape(c, s) {
      c.save(); const lw = Math.max(4, Math.round(canvas.width * 0.005)); c.strokeStyle = s.color; c.fillStyle = s.color; c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round';
      if (s.type === 'freehand' && s.points?.length > 1) { c.beginPath(); c.moveTo(s.points[0].x, s.points[0].y); s.points.slice(1).forEach(p => c.lineTo(p.x, p.y)); c.stroke(); }
      else if (s.type === 'circle') { c.beginPath(); c.ellipse((s.x1+s.x2)/2, (s.y1+s.y2)/2, Math.max(Math.abs(s.x2-s.x1)/2,4), Math.max(Math.abs(s.y2-s.y1)/2,4), 0, 0, Math.PI*2); c.stroke(); }
      else if (s.type === 'arrow') { const hl = lw*4, a = Math.atan2(s.y2-s.y1, s.x2-s.x1); c.beginPath(); c.moveTo(s.x1,s.y1); c.lineTo(s.x2,s.y2); c.stroke(); c.beginPath(); c.moveTo(s.x2,s.y2); c.lineTo(s.x2-hl*Math.cos(a-Math.PI/6), s.y2-hl*Math.sin(a-Math.PI/6)); c.lineTo(s.x2-hl*Math.cos(a+Math.PI/6), s.y2-hl*Math.sin(a+Math.PI/6)); c.closePath(); c.fill(); }
      else if (s.type === 'text') { const fs = Math.max(20, Math.round(canvas.width * 0.026)); c.font = `bold ${fs}px sans-serif`; const w = c.measureText(s.text).width; c.fillStyle = 'rgba(15,23,42,0.82)'; c.fillRect(s.x-8, s.y-fs, w+16, fs+10); c.fillStyle = '#FFF'; c.fillText(s.text, s.x, s.y); }
      c.restore();
    }

    async function saveReport() {
      const site = document.getElementById('fieldSite').value.trim(), title = document.getElementById('fieldTitle').value.trim();
      if (!site || !title) return showToast('請填寫單位及標題');
      const btn = document.getElementById('saveReportBtn'); btn.disabled = true;
      const docId = editingReportId || ('rep-' + Date.now()), ex = reports.find(r => r.id === docId);
      const validDocs = draftDocs.filter(d => d.name.trim() || d.url.trim()).map(d => ({ name: d.name.trim() || '附件檔案', url: d.url.trim() }));
      try {
        await db.collection(COLLECTION_NAME).doc(docId).set({
          site, assignee: document.getElementById('fieldAssignee').value.trim(),
          date: document.getElementById('fieldDate').value || new Date().toISOString().split('T')[0],
          timeRange: formatTimeRange(document.getElementById('fieldTimeStart').value, document.getElementById('fieldTimeEnd').value),
          status: document.getElementById('fieldStatus').value, title,
          docs: validDocs, docName: validDocs[0]?.name || '', docUrl: validDocs[0]?.url || '',
          summary: document.getElementById('fieldSummary').value.trim(),
          followup: document.getElementById('fieldFollowup').value.trim(),
          followupLogs: ex ? (ex.followupLogs || []) : [],
          photos: draftPhotos.map(p => ({ id: p.id, base64Raw: p.shapes?.length ? p.base64Raw : '', base64Annotated: p.base64Annotated || p.base64Raw, shapes: p.shapes || [], note: p.note || '' })),
          createdAt: ex ? ex.createdAt : Date.now(), updatedAt: Date.now()
        });
        closeEditor(); showToast('已儲存同步');
      } catch (e) { showToast('相片過多，請改用「截圖工作台」無限貼圖'); }
      finally { btn.disabled = false; }
    }

    async function deleteReport(id) { if (confirm('確定刪除此紀錄？')) { await db.collection(COLLECTION_NAME).doc(id).delete(); showToast('已刪除'); } }

    function openViewModal(id) {
      const r = reports.find(x => x.id === id); if (!r) return; viewingReportId = id;
      const docs = getDocsList(r);
      document.getElementById('viewModalHeader').textContent = `${r.site} — ${r.title}`;
      document.getElementById('viewModalBody').innerHTML = `
        <div><span class="t-mono" style="font-weight:700;">${escapeHtml(r.date)} ${escapeHtml(r.timeRange||'')}</span> <span class="badge ${getStatusClass(r.status)}">${escapeHtml(r.status)}</span></div>
        ${r.summary ? `<div style="white-space:pre-line;">${escapeHtml(r.summary)}</div>` : ''}
        ${docs.length ? `<div class="row">${docs.map(d => `<a href="${escapeHtml(d.url)}" target="_blank" class="btn-link blue">📄 ${escapeHtml(d.name)} ↗</a>`).join('')}</div>` : ''}
        ${renderFollowupBlock(r)}
        ${(r.photos||[]).map((p,i) => `<div style="border:1px solid #E2E8F0;border-radius:6px;overflow:hidden;"><img src="${p.base64Annotated||p.base64Raw}" style="width:100%;max-height:60vh;object-fit:contain;background:#F8FAFC;display:block;" /><div style="padding:8px;" class="t-meta"><b>#${i+1}</b> ${escapeHtml(p.note||'')}</div></div>`).join('')}`;
      document.getElementById('viewModal').classList.remove('hidden');
    }
    function closeViewModal() { document.getElementById('viewModal').classList.add('hidden'); }
    function escapeHtml(s) { return !s ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function escapeAttr(s) { return escapeHtml(s).replace(/'/g, "\\'"); }

    startRealtimeSync();
  </script>
</body>
</html>
