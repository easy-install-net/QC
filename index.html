<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>築匠設計 ARTISAN STUDIO — QC 報告</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="report.css" />
</head>
<body>

  <header class="topbar no-print">
    <div class="container row-between" style="padding-bottom:0;">
      <div class="row">
        <span class="t-site brand-name">築匠設計 ARTISAN STUDIO</span>
        <span class="topbar-sep">|</span>
        <span class="topbar-sub" id="headerSubTitle">QC 總報告</span>
        <span id="syncBadge" class="sync-ok">連線中</span>
      </div>
      <div class="row hidden" id="standaloneHeaderBtns">
        <button type="button" onclick="window.print()" class="btn-top-white">列印 / 儲存 PDF</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="filterBar" class="filter-zone no-print">
      <button type="button" onclick="openEditor()" class="btn-orange">+ 新增單位</button>
      <select id="siteFilter" onchange="renderReportList()" class="select-site-lg">
        <option value="ALL">全部單位</option>
      </select>
      <select id="statusFilter" onchange="renderReportList()" class="select-status-sm">
        <option value="ALL">全部狀態</option>
        <option value="需跟進">需跟進</option>
        <option value="已約期">已約期</option>
        <option value="待確認">待確認</option>
        <option value="已完成">已完成</option>
      </select>
      <div class="search-eight-wrap">
        <input type="text" id="searchInput" oninput="renderReportList()" class="search-eight-input" />
        <span class="search-lens-icon" aria-hidden="true">🔍</span>
      </div>
    </div>

    <div id="reportListContainer">
      <div style="background:#FFF;padding:24px;margin-top:14px;text-align:center;" class="muted">載入中...</div>
    </div>
  </main>

  <div id="editorModal" class="modal-backdrop hidden no-print">
    <div class="modal-box">
      <div class="modal-head">
        <span class="t-site" id="editorModalTitle">新增單位</span>
        <button type="button" onclick="closeEditor()" class="btn-link">關閉 ✕</button>
      </div>
      <div class="modal-body" style="padding:0;">
        <div class="editor-band">
          <div class="editor-band-title">1. 單位與時間</div>
          <div class="grid-3">
            <div><label class="field-label">屋苑 / 單位 *</label><input type="text" id="fieldSite" class="input-ui" /></div>
            <div><label class="field-label">@負責人</label><input type="text" id="fieldAssignee" class="input-ui" /></div>
            <div>
              <label class="field-label">狀態</label>
              <select id="fieldStatus" class="select-ui" style="width:100%;">
                <option value="需跟進">需跟進</option><option value="已約期">已約期</option><option value="待確認">待確認</option><option value="已完成">已完成</option>
              </select>
            </div>
          </div>
          <div class="grid-3" style="margin-top:8px;">
            <div><label class="field-label">日期</label><input type="date" id="fieldDate" class="input-ui" /></div>
            <div>
              <label class="field-label">時段（開始 / 結束）</label>
              <div class="grid-2"><input type="time" id="fieldTimeStart" class="input-ui" /><input type="time" id="fieldTimeEnd" class="input-ui" /></div>
            </div>
            <div><label class="field-label">項目重點標題 *</label><input type="text" id="fieldTitle" class="input-ui" /></div>
          </div>
        </div>

        <div class="editor-band" style="background:#FFF;">
          <div class="editor-band-title">2. 工程內容與文件</div>
          <div style="margin-bottom:8px;"><label class="field-label">檢查要點 / 事項內容</label><textarea id="fieldSummary" rows="3" class="input-ui"></textarea></div>
          <div style="margin-bottom:8px;"><label class="field-label">後續跟進</label><input type="text" id="fieldFollowup" class="input-ui" /></div>
          <div style="padding-top:6px;border-top:1px solid #E2E8F0;">
            <div class="row-between" style="margin-bottom:6px;">
              <span class="t-meta" style="font-weight:600;">關聯文件 / 截圖檔</span>
              <div class="row">
                <button type="button" onclick="openAlbumFromEditor()" class="btn-orange">+ 開截圖工作台</button>
                <label class="btn-secondary" style="cursor:pointer;"><span>+ 小PDF</span><input type="file" accept="application/pdf" multiple class="hidden" onchange="handlePdfUpload(event)" /></label>
                <button type="button" onclick="addDocRow()" class="btn-secondary">+ 加網址連結</button>
              </div>
            </div>
            <div id="docRowsContainer" style="display:flex;flex-direction:column;gap:6px;"></div>
          </div>
        </div>

        <div class="editor-band">
          <div class="row-between" style="margin-bottom:8px;">
            <div>
              <div class="editor-band-title" style="margin-bottom:2px;">3. 現場相片與標記</div>
              <span id="photoCountHint" class="t-meta muted"></span>
            </div>
            <div class="row">
              <label class="btn-orange" style="cursor:pointer;"><span>📷 連續拍照</span><input type="file" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoUpload(event)" /></label>
              <label class="btn-secondary" style="cursor:pointer;"><span>🖼 批量上傳相片</span><input type="file" accept="image/*" multiple class="hidden" onchange="handlePhotoUpload(event)" /></label>
              <button type="button" onclick="createBlankSketch()" class="btn-secondary">+ 草圖板</button>
            </div>
          </div>

          <div id="annotationWorkspace" class="hidden" style="background:#FFF;padding:8px;border-top:1px solid #CBD5E1;margin-bottom:8px;">
            <div class="row-between" style="margin-bottom:6px;">
              <div class="row">
                <button type="button" onclick="setTool('move')" id="tool-move" class="btn-secondary btn-active">✋ 移動</button>
                <button type="button" onclick="setTool('freehand')" id="tool-freehand" class="btn-secondary">✎ 手繪</button>
                <button type="button" onclick="setTool('circle')" id="tool-circle" class="btn-secondary">◯ 線圈</button>
                <button type="button" onclick="setTool('arrow')" id="tool-arrow" class="btn-secondary">↗ 箭咀</button>
                <button type="button" onclick="setTool('text')" id="tool-text" class="btn-secondary
