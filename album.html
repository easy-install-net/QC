<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>築匠設計 — 截圖工作台</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="album.css" />
</head>
<body>

  <header class="topbar no-print">
    <div class="row">
      <a href="index.html" id="backToMainBtn" onclick="handleBackToMain(event)" class="btn-secondary">退回</a>
      <select id="historyAlbumSelect" onchange="onSelectHistoryAlbum(this.value)" class="select-ui" style="max-width:210px;">
        <option value="">載入</option>
      </select>
      <button type="button" id="deleteAlbumBtn" onclick="deleteCurrentAlbumWithConfirm()" class="btn-danger-outline hidden">刪檔</button>
      <span id="statusTag" class="topbar-status"></span>
    </div>
    <div class="row" id="adminAlbumBtns">
      <button type="button" onclick="copyAlbumWhatsApp('client')" class="btn-wa">💬 Share</button>
      <button type="button" onclick="copyAlbumWhatsApp('factory')" class="btn-secondary">師傅/廠</button>
      <button type="button" onclick="copyPureAlbumLink()" class="btn-link">純網址</button>
      <button type="button" onclick="exportPdf()" class="btn-secondary">出PDF</button>
      <button type="button" id="saveAlbumBtn" onclick="saveAlbumToCloud()" class="btn-orange">儲存</button>
    </div>
    <div class="row hidden" id="publicAlbumBtns">
      <button type="button" onclick="exportPdf()" class="btn-secondary">出PDF</button>
    </div>
  </header>

  <div id="editShell" class="no-print">
    <div class="meta-bar">
      <input type="text" id="albumSite" list="siteSuggestions" class="input-ui" />
      <datalist id="siteSuggestions"></datalist>
      <input type="text" id="albumTitle" class="input-ui" />
      <input type="date" id="albumDate" class="input-ui" />
    </div>

    <div class="workspace">
      <aside class="sidebar" id="thumbSidebar"></aside>

      <section class="stage">
        <div class="strip-line">
          <div class="row">
            <button type="button" id="modeShootBtn" onclick="setCaptureMode('shoot')" class="btn-mode">📸 連續</button>
            <button type="button" id="modeStickerBtn" onclick="setCaptureMode('sticker')" class="btn-mode">📌 貼小圖</button>
          </div>
          <div class="row">
            <label class="btn-secondary" style="cursor:pointer;"><span>🖼 揀相</span><input type="file" accept="image/*" multiple class="hidden" onchange="handleAlbumFiles(event)" /></label>
            <button type="button" onclick="addBlankPage()" class="btn-secondary">+ 空白</button>
          </div>
        </div>

        <div id="canvasArea" class="hidden" style="display:flex;flex-direction:column;gap:5px;">
          <div class="strip-line">
            <div class="row">
              <button type="button" onclick="setTool('move')" id="t-move" class="btn-secondary btn-active">✋ 移動</button>
              <button type="button" onclick="setTool('pan')" id="t-pan" class="btn-secondary">🔍 拖動</button>
              <div class="tool-sep"></div>
              <button type="button" onclick="setTool('freehand')" id="t-freehand" class="btn-secondary">✎ 手繪</button>
              <button type="button" onclick="setTool('circle')" id="t-circle" class="btn-secondary">◯ 線圈</button>
              <button type="button" onclick="setTool('arrow')" id="t-arrow" class="btn-secondary">↗ 箭咀</button>
              <button type="button" onclick="setTool('text')" id="t-text" class="btn-secondary">T 打字</button>
              <select id="fontSizeSelect" onchange="onFontSizeChange()" class="select-ui">
                <option value="0.016">字體：細</option>
                <option value="0.024" selected>字體：中</option>
                <option value="0.034">字體：大</option>
                <option value="0.046">字體：特大</option>
              </select>
              <button type="button" onclick="setColor('rgba(234,88,12,0.95)', this)" class="color-dot active-color" style="background:#EA580C;"></button>
              <button type="button" onclick="setColor('rgba(220,38,38,0.92)', this)" class="color-dot" style="background:#DC2626;"></button>
              <button type="button" onclick="setColor('rgba(37,99,235,0.92)', this)" class="color-dot" style="background:#2563EB;"></button>
              <button type="button" onclick="setColor('rgba(15,23,42,0.92)', this)" class="color-dot" style="background:#0F172A;"></button>
            </div>

            <div class="row">
              <button type="button" onclick="stepZoom(-0.25)" class="btn-secondary">－</button>
              <span id="zoomPercentLabel" class="zoom-pill">100%</span>
              <button type="button" onclick="stepZoom(0.25)" class="btn-secondary">＋</button>
              <button type="button" onclick="setZoomLevel(1)" class="btn-secondary">適應</button>
              <div class="tool-sep"></div>
              <button type="button" id="delSelBtn" onclick="deleteSelectedShape()" class="btn-danger-outline hidden">刪選取</button>
              <button type="button" onclick="undoShape()" class="btn-secondary">復原</button>
              <button type="button" onclick="clearShapes()" class="btn-secondary">全清</button>
              <button type="button" onclick="deleteCurrentPageWithConfirm()" class="btn-danger-outline">刪此頁</button>
            </div>
          </div>

          <input type="text" id="textLabelInput" oninput="onTextLiveEdit()" onkeydown="onTextInputKeyDown(event)" class="input-ui hidden" placeholder="輸入標記文字，按 Enter 直接放上畫布或點畫布落字" />

          <div class="canvas-scroll" id="canvasScrollBox">
            <div class="canvas-stage-inner">
              <canvas id="workCanvas"></canvas>
            </div>
          </div>

          <input type="text" id="pageNoteInput" oninput="syncPageNote()" class="input-ui" />
        </div>
      </section>
    </div>
  </div>

  <div id="printReportView"></div>
  <div id="toast" class="hidden no-print"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCSRfZdAVh8ADPNtayW5lyDtmE0xDsJXNg",
      authDomain: "gen-lang-client-0208380044.firebaseapp.com",
      databaseURL: "https://gen-lang-client-0208380044-default-rtdb.firebaseio.com",
      projectId: "gen-lang-client-0208380044",
      storageBucket: "gen-lang-client-0208380044.firebasestorage.app",
      messagingSenderId: "17077391191",
      appId: "1:17077391191:web:cb936dd1bfe98b2f3d7812"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    try {
      if (firebase.firestore.persistentLocalCache && firebase.firestore.persistentMultipleTabManager) {
        db.settings({
          localCache: firebase.firestore.persistentLocalCache({
            tabManager: firebase.firestore.persistentMultipleTabManager()
          })
        });
      } else {
        db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
      }
    } catch (_) {
      db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    }

    const REPORTS_COL = 'artisan_qc_reports';
    const ALBUMS_COL = 'artisan_qc_albums';

    let currentAlbumId = null, linkedReportId = null;
    let pages = [], activeIdx = -1;
    let captureMode = 'shoot';
    let tool = 'move', color = 'rgba(234,88,12,0.95)', fontScale = 0.024;
    let zoomLevel = 1, fitScale = 1, baseCanvasW = 1000, baseCanvasH = 700;
    let selectedIdx = -1, drawing = false, draggingShape = false, panningView = false;
    let sx = 0, sy = 0, lx = 0, ly = 0, panStartClientX = 0, panStartClientY = 0, panStartScrollL = 0, panStartScrollT = 0;
    let stroke = [], baseImg = null;
    let isSavingAlbum = false;

    const canvas = document.getElementById('workCanvas');
    const ctx = canvas.getContext('2d');
    const scrollBox = document.getElementById('canvasScrollBox');

    function confirmYAction(promptMsg) {
      const ans = prompt(`${promptMsg}\n請輸入 "Y" 確認：`);
      return ans !== null && ans.trim().toUpperCase() === 'Y';
    }

    function isInputFocused(el) {
      if (!el) return false;
      const tag = el.tagName;
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
    }

    function applyCaptureModeUI() {
      const shootBtn = document.getElementById('modeShootBtn');
      const stickerBtn = document.getElementById('modeStickerBtn');
      shootBtn.classList.toggle('shoot-mode', captureMode === 'shoot');
      stickerBtn.classList.toggle('shoot-mode', captureMode === 'sticker');
      document.getElementById('deleteAlbumBtn').classList.toggle('hidden', !currentAlbumId);
    }

    function setCaptureMode(m) {
      captureMode = m;
      applyCaptureModeUI();
      showToast(m === 'shoot' ? '📸 連續' : '📌 貼小圖');
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const site = params.get('site') || '';
      const date = params.get('date') || new Date().toISOString().split('T')[0];
      linkedReportId = params.get('reportId') || null;
      currentAlbumId = params.get('albumId') || null;
      const isPublic = params.get('view') === 'public';

      if (isPublic) {
        document.getElementById('backToMainBtn').classList.add('hidden');
        document.getElementById('historyAlbumSelect').classList.add('hidden');
        document.getElementById('deleteAlbumBtn').classList.add('hidden');
        document.getElementById('statusTag').classList.add('hidden');
        document.getElementById('adminAlbumBtns').classList.add('hidden');
        document.getElementById('publicAlbumBtns').classList.remove('hidden');
        document.getElementById('editShell').classList.add('hidden');
      } else {
        db.collection(REPORTS_COL).limit(50).get().then(snap => {
          const sites = [...new Set(snap.docs.map(d => d.data().site).filter(Boolean))];
          document.getElementById('siteSuggestions').innerHTML = sites.map(s => `<option value="${escapeHtml(s)}"></option>`).join('');
        });
        await refreshAlbumListDropdown();
      }

      document.getElementById('albumSite').value = site;
      document.getElementById('albumDate').value = date;
      if (site && !currentAlbumId) document.getElementById('albumTitle').value = `${date.slice(2).replace(/-/g,'')} 截圖標記紀錄`;

      if (currentAlbumId) {
        captureMode = 'sticker';
        await loadExistingAlbum(currentAlbumId, isPublic);
      } else {
        captureMode = 'shoot';
        renderSidebar();
      }
      applyCaptureModeUI();
    }

    window.addEventListener('resize', () => {
      if (activeIdx >= 0 && !document.getElementById('canvasArea').classList.contains('hidden')) {
        computeFitAndApplyZoom(zoomLevel);
      }
    });

    function computeFitAndApplyZoom(newZoom) {
      zoomLevel = Math.max(0.5, Math.min(4, newZoom));
      const boxW = Math.max(260, scrollBox.clientWidth - 20);
      const boxH = Math.max(220, scrollBox.clientHeight - 20);
      fitScale = Math.min(boxW / baseCanvasW, boxH / baseCanvasH, 1);
      const displayScale = fitScale * zoomLevel;
      canvas.style.width = `${Math.round(baseCanvasW * displayScale)}px`;
      canvas.style.height = `${Math.round(baseCanvasH * displayScale)}px`;
      document.getElementById('zoomPercentLabel').textContent = `${Math.round(zoomLevel * 100)}%`;
    }

    function setZoomLevel(z) { computeFitAndApplyZoom(z); }
    function stepZoom(delta) { computeFitAndApplyZoom(zoomLevel + delta); }

    scrollBox.addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        stepZoom(e.deltaY < 0 ? 0.2 : -0.2);
      }
    }, { passive: false });

    async function refreshAlbumListDropdown() {
      try {
        const snap = await db.collection(ALBUMS_COL).orderBy('updatedAt', 'desc').limit(80).get();
        const sel = document.getElementById('historyAlbumSelect');
        const opts = ['<option value="">載入</option>'];
        snap.docs.forEach(d => {
          const data = d.data();
          const label = `${data.site || ''} — ${data.title || ''} (${data.pageCount || 0}頁)`;
          opts.push(`<option value="${escapeHtml(d.id)}" ${d.id === currentAlbumId ? 'selected' : ''}>${escapeHtml(label)}</option>`);
        });
        sel.innerHTML = opts.join('');
      } catch (e) { console.warn(e); }
    }

    async function onSelectHistoryAlbum(albId) {
      if (!albId) return;
      if (pages.length > 0 && albId !== currentAlbumId) {
        await saveAlbumToCloud({ silent: true, autoDefaultTitle: true });
      }
      currentAlbumId = albId;
      captureMode = 'sticker';
      applyCaptureModeUI();
      const newUrl = new URL(window.location.href);
      newUrl.search = `?albumId=${encodeURIComponent(albId)}`;
      window.history.replaceState({}, '', newUrl);
      await loadExistingAlbum(albId, false);
    }

    async function handleBackToMain(e) {
      const isPublic = new URLSearchParams(window.location.search).get('view') === 'public';
      if (isPublic) return;
      if (pages.length > 0) {
        e.preventDefault();
        await saveAlbumToCloud({ silent: true, autoDefaultTitle: true });
        window.location.href = 'index.html';
      }
    }

    window.addEventListener('pagehide', () => {
      const isPublic = new URLSearchParams(window.location.search).get('view') === 'public';
      if (!isPublic && pages.length > 0) {
        saveAlbumToCloud({ silent: true, autoDefaultTitle: true });
      }
    });

    async function deleteCurrentAlbumWithConfirm() {
      if (!currentAlbumId) return;
      if (!confirmYAction('確定要刪除整份截圖檔嗎？')) return;
      const albId = currentAlbumId;
      try {
        const pSnap = await db.collection(ALBUMS_COL).doc(albId).collection('pages').get();
        const batch = db.batch();
        pSnap.docs.forEach(d => batch.delete(d.ref));
        batch.delete(db.collection(ALBUMS_COL).doc(albId));
        await batch.commit();

        if (linkedReportId) {
          const repDoc = await db.collection(REPORTS_COL).doc(linkedReportId).get();
          if (repDoc.exists) {
            const rData = repDoc.data();
            const newDocs = (rData.docs || []).filter(d => !d.url || !d.url.includes(albId));
            await repDoc.ref.update({ docs: newDocs, updatedAt: Date.now() });
          }
        }

        currentAlbumId = null; linkedReportId = null; pages = []; activeIdx = -1; selectedIdx = -1;
        document.getElementById('albumTitle').value = '';
        document.getElementById('statusTag').textContent = '';
        window.history.replaceState({}, '', new URL('album.html', window.location.href));
        applyCaptureModeUI();
        await refreshAlbumListDropdown();
        renderSidebar();
        showToast('已刪除截圖檔');
      } catch (e) {
        showToast('刪除失敗：' + e.message);
      }
    }

    async function loadExistingAlbum(albumId, isPublic) {
      document.getElementById('statusTag').textContent = '載入中...';
      const doc = await db.collection(ALBUMS_COL).doc(albumId).get();
      if (!doc.exists) return showToast('找不到此截圖檔案');
      const data = doc.data();
      document.getElementById('albumSite').value = data.site || '';
      document.getElementById('albumTitle').value = data.title || '';
      document.getElementById('albumDate').value = data.date || '';
      linkedReportId = data.linkedReportId || linkedReportId;

      const pSnap = await db.collection(ALBUMS_COL).doc(albumId).collection('pages').orderBy('order', 'asc').get();
      pages = pSnap.docs.map(d => d.data());
      document.getElementById('statusTag').textContent = `${pages.length} 頁`;
      applyCaptureModeUI();

      if (isPublic) {
        document.title = `${data.site || ''} — ${data.title || ''}`;
        buildPrintView();
        document.getElementById('printReportView').style.display = 'block';
      } else {
        document.getElementById('historyAlbumSelect').value = albumId;
        renderSidebar();
        if (pages.length) selectPage(0);
      }
    }

    window.addEventListener('paste', (e) => {
      if (document.getElementById('editShell').classList.contains('hidden')) return;
      if (isInputFocused(document.activeElement) || isInputFocused(e.target)) return;
      const items = (e.clipboardData || window.clipboardData)?.items || [];
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          e.preventDefault();
          handleIncomingImageFile(item.getAsFile());
          return;
        }
      }
    });

    function handleAlbumFiles(e) {
      Array.from(e.target.files || []).forEach(f => handleIncomingImageFile(f));
      e.target.value = '';
    }

    function handleIncomingImageFile(file) {
      if (!file) return;
      const asSticker = (captureMode === 'sticker' && activeIdx >= 0);
      addImageBlob(file, asSticker);
    }

    function addImageBlob(file, asStickerOnCurrentPage = false) {
      if (!file) return;
      const rd = new FileReader();
      rd.onload = ev => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height, max = asStickerOnCurrentPage ? 650 : 1280;
          if (w > max || h > max) { if (w > h) { h = Math.round(h * max / w); w = max; } else { w = Math.round(w * max / h); h = max; } }
          const off = document.createElement('canvas'); off.width = w; off.height = h;
          off.getContext('2d').drawImage(img, 0, 0, w, h);
          const b64 = off.toDataURL('image/jpeg', 0.82);

          if (asStickerOnCurrentPage && activeIdx >= 0) {
            const targetW = Math.min(w, Math.round(canvas.width * 0.36));
            const targetH = Math.round(h * (targetW / w));
            const px = Math.round((canvas.width - targetW) / 2);
            const py = Math.round((canvas.height - targetH) / 2);
            pages[activeIdx].shapes = pages[activeIdx].shapes || [];
            pages[activeIdx].shapes.push({ type: 'image', imgSrc: b64, x1: px, y1: py, x2: px + targetW, y2: py + targetH });
            setTool('move');
            selectedIdx = pages[activeIdx].shapes.length - 1;
            syncSelUI();
            redraw(true);
            showToast('已貼做小圖');
            return;
          }

          pages.push({ id: 'pg-' + Date.now() + '-' + Math.random().toString(36).slice(2,5), raw: b64, rendered: b64, shapes: [], note: '' });
          renderSidebar();
          selectPage(pages.length - 1);
          showToast(`第 ${pages.length} 頁`);
        };
        img.src = ev.target.result;
      };
      rd.readAsDataURL(file);
    }

    function addBlankPage() {
      const off = document.createElement('canvas'); off.width = 1000; off.height = 700;
      const ox = off.getContext('2d'); ox.fillStyle = '#FFF'; ox.fillRect(0,0,1000,700);
      const b64 = off.toDataURL('image/jpeg', 0.85);
      pages.push({ id: 'pg-' + Date.now(), raw: b64, rendered: b64, shapes: [], note: '' });
      renderSidebar(); selectPage(pages.length - 1);
    }

    function movePage(e, idx, delta) {
      e.stopPropagation();
      const target = idx + delta;
      if (target < 0 || target >= pages.length) return;
      const item = pages.splice(idx, 1)[0];
      pages.splice(target, 0, item);
      if (activeIdx === idx) activeIdx = target;
      else if (activeIdx > idx && activeIdx <= target) activeIdx--;
      else if (activeIdx < idx && activeIdx >= target) activeIdx++;
      renderSidebar();
      if (activeIdx >= 0) selectPage(activeIdx);
    }

    function renderSidebar() {
      const sb = document.getElementById('thumbSidebar');
      if (!pages.length) {
        sb.innerHTML = `<div style="color:#64748B;text-align:center;padding:14px 4px;">Ctrl+V</div>`;
        document.getElementById('canvasArea').classList.add('hidden');
        return;
      }
      sb.innerHTML = pages.map((p, i) => `
        <div onclick="selectPage(${i})" class="page-thumb ${i===activeIdx?'active':''}">
          <img src="${p.rendered || p.raw}" />
          <div class="row" style="justify-content:space-between;padding:2px 4px;background:#FFF;">
            <b>#${i+1}</b>
            <div class="row" style="gap:1px;">
              <button type="button" onclick="movePage(event,${i},-1)" class="ord-btn">↑</button>
              <button type="button" onclick="movePage(event,${i},1)" class="ord-btn">↓</button>
              <button type="button" onclick="deletePage(event,${i})" class="btn-link" style="color:#DC2626;padding:0 2px;">刪</button>
            </div>
          </div>
        </div>`).join('');
    }

    function removePageAtIndex(i) {
      pages.splice(i, 1); selectedIdx = -1;
      activeIdx = pages.length ? Math.max(0, i - 1) : -1;
      renderSidebar();
      if (activeIdx >= 0) selectPage(activeIdx);
      showToast('已刪頁');
    }

    function deletePage(e, i) {
      e.stopPropagation();
      if (!confirmYAction(`確定要刪除第 #${i + 1} 頁嗎？`)) return;
      removePageAtIndex(i);
    }

    function deleteCurrentPageWithConfirm() {
      if (activeIdx < 0) return;
      if (!confirmYAction(`確定要刪除目前第 #${activeIdx + 1} 頁嗎？`)) return;
      removePageAtIndex(activeIdx);
    }

    function selectPage(i) {
      activeIdx = i; selectedIdx = -1; syncSelUI();
      const p = pages[i]; if (!p) return;
      if (!p.raw) p.raw = p.rendered;
      document.getElementById('canvasArea').classList.remove('hidden');
      document.getElementById('pageNoteInput').value = p.note || '';
      renderSidebar();

      (p.shapes || []).forEach(s => {
        if (s.type === 'image' && s.imgSrc && !s._imgObj) {
          const im = new Image();
          im.onload = () => { s._imgObj = im; redraw(false); };
          im.src = s.imgSrc;
        }
      });

      baseImg = new Image();
      baseImg.onload = () => {
        baseCanvasW = baseImg.width;
        baseCanvasH = baseImg.height;
        canvas.width = baseCanvasW;
        canvas.height = baseCanvasH;
        computeFitAndApplyZoom(1);
        redraw(false);
      };
      baseImg.src = p.raw;
    }

    function syncPageNote() { if (activeIdx >= 0) pages[activeIdx].note = document.getElementById('pageNoteInput').value; }

    function placeTextAt(txt, x, y) {
      if (activeIdx < 0 || !txt) return;
      pages[activeIdx].shapes = pages[activeIdx].shapes || [];
      const existingCount = pages[activeIdx].shapes.length;
      const px = typeof x === 'number' ? x : Math.round(canvas.width * (0.2 + ((existingCount % 5) * 0.08)));
      const py = typeof y === 'number' ? y : Math.round(canvas.height * (0.2 + ((existingCount % 5) * 0.08)));
      pages[activeIdx].shapes.push({ type: 'text', x: px, y: py, text: txt, color, scale: fontScale });
      document.getElementById('textLabelInput').value = '';
      setTool('move');
      selectedIdx = pages[activeIdx].shapes.length - 1;
      syncSelUI();
      redraw(true);
    }

    function onTextInputKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const inp = document.getElementById('textLabelInput');
        const txt = (inp.value || '').trim();
        if (!txt) return showToast('請先輸入文字');
        placeTextAt(txt);
        showToast('已放上畫布');
      }
    }

    function setTool(t) {
      tool = t;
      ['move','pan','freehand','circle','arrow','text'].forEach(k => document.getElementById('t-'+k).classList.toggle('btn-active', k===t));
      canvas.classList.toggle('draw-cursor', ['freehand','circle','arrow','text'].includes(t));
      if (t !== 'move') { selectedIdx = -1; redraw(false); }
      syncSelUI();
      if (t === 'text') {
        const inp = document.getElementById('textLabelInput');
        inp.classList.remove('hidden');
        inp.focus();
      }
    }

    function syncSelUI() {
      const shapes = activeIdx >= 0 ? (pages[activeIdx]?.shapes || []) : [];
      const sel = selectedIdx >= 0 ? shapes[selectedIdx] : null;
      document.getElementById('delSelBtn').classList.toggle('hidden', !sel);
      const showInput = tool === 'text' || (sel && sel.type === 'text');
      document.getElementById('textLabelInput').classList.toggle('hidden', !showInput);
      if (sel && sel.type === 'text') {
        document.getElementById('textLabelInput').value = sel.text || '';
        if (sel.scale) document.getElementById('fontSizeSelect').value = String(sel.scale);
      }
    }

    function onFontSizeChange() {
      fontScale = parseFloat(document.getElementById('fontSizeSelect').value) || 0.024;
      const shapes = activeIdx >= 0 ? (pages[activeIdx]?.shapes || []) : [];
      if (selectedIdx >= 0 && shapes[selectedIdx]?.type === 'text') {
        shapes[selectedIdx].scale = fontScale;
        redraw(true);
      }
    }

    function onTextLiveEdit() {
      const shapes = activeIdx >= 0 ? (pages[activeIdx]?.shapes || []) : [];
      if (tool === 'move' && selectedIdx >= 0 && shapes[selectedIdx]?.type === 'text') {
        shapes[selectedIdx].text = document.getElementById('textLabelInput').value;
        redraw(true);
      }
    }

    function setColor(c, btnEl) {
      color = c;
      document.querySelectorAll('.color-dot').forEach(b => b.classList.remove('active-color'));
      if (btnEl) btnEl.classList.add('active-color');
      const shapes = activeIdx >= 0 ? (pages[activeIdx]?.shapes || []) : [];
      if (selectedIdx >= 0 && shapes[selectedIdx] && shapes[selectedIdx].type !== 'image') {
        shapes[selectedIdx].color = c;
        redraw(true);
      }
    }

    function deleteSelectedShape() {
      if (activeIdx < 0 || selectedIdx < 0) return;
      pages[activeIdx].shapes.splice(selectedIdx, 1);
      selectedIdx = -1; syncSelUI(); redraw(true);
    }

    function undoShape() { if (activeIdx >= 0) { pages[activeIdx].shapes.pop(); selectedIdx = -1; syncSelUI(); redraw(true); } }
    function clearShapes() { if (activeIdx >= 0) { pages[activeIdx].shapes = []; selectedIdx = -1; syncSelUI(); redraw(true); } }

    function bounds(c, s) {
      if (s.type === 'text') {
        const fs = Math.max(16, Math.round(canvas.width * (s.scale || 0.024)));
        c.save(); c.font = `bold ${fs}px sans-serif`; const w = c.measureText(s.text || '').width; c.restore();
        return { x1: s.x - 10, y1: s.y - fs - 4, x2: s.x + w + 10, y2: s.y + 10 };
      }
      if (s.type === 'freehand' && s.points?.length) {
        const xs = s.points.map(p => p.x), ys = s.points.map(p => p.y);
        return { x1: Math.min(...xs) - 10, y1: Math.min(...ys) - 10, x2: Math.max(...xs) + 10, y2: Math.max(...ys) + 10 };
      }
      return { x1: Math.min(s.x1, s.x2) - 8, y1: Math.min(s.y1, s.y2) - 8, x2: Math.max(s.x1, s.x2) + 8, y2: Math.max(s.y1, s.y2) + 8 };
    }

    function hitTest(shapes, x, y) {
      for (let i = shapes.length - 1; i >= 0; i--) {
        const b = bounds(ctx, shapes[i]);
        if (x >= b.x1 && x <= b.x2 && y >= b.y1 && y <= b.y2) return i;
      }
      return -1;
    }

    function shiftShape(s, dx, dy) {
      if (s.type === 'text') { s.x += dx; s.y += dy; }
      else if (s.type === 'freehand' && s.points) { s.points.forEach(p => { p.x += dx; p.y += dy; }); }
      else { s.x1 += dx; s.y1 += dy; s.x2 += dx; s.y2 += dy; }
    }

    function coords(e) {
      const r = canvas.getBoundingClientRect(), cx = e.touches ? e.touches[0].clientX : e.clientX, cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: (cx - r.left) * (canvas.width / r.width), y: (cy - r.top) * (canvas.height / r.height) };
    }

    canvas.addEventListener('mousedown', down);
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    canvas.addEventListener('touchstart', down, { passive: false });
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('touchend', up);

    function down(e) {
      if (activeIdx < 0) return; e.preventDefault();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;

      if (tool === 'pan') {
        panningView = true;
        panStartClientX = cx; panStartClientY = cy;
        panStartScrollL = scrollBox.scrollLeft; panStartScrollT = scrollBox.scrollTop;
        return;
      }

      const pos = coords(e);
      const shapes = pages[activeIdx].shapes || [];

      if (tool === 'move') {
        const hit = hitTest(shapes, pos.x, pos.y);
        selectedIdx = hit; syncSelUI(); redraw(false);
        if (hit >= 0) { draggingShape = true; lx = pos.x; ly = pos.y; }
        else {
          panningView = true;
          panStartClientX = cx; panStartClientY = cy;
          panStartScrollL = scrollBox.scrollLeft; panStartScrollT = scrollBox.scrollTop;
        }
        return;
      }

      if (tool === 'text') {
        const hit = hitTest(shapes, pos.x, pos.y);
        if (hit >= 0 && shapes[hit].type === 'text') {
          setTool('move'); selectedIdx = hit; syncSelUI(); redraw(false);
          draggingShape = true; lx = pos.x; ly = pos.y;
          return;
        }
        const txt = document.getElementById('textLabelInput').value.trim();
        if (!txt) return showToast('請先輸入文字再點畫布');
        placeTextAt(txt, pos.x, pos.y);
        return;
      }

      drawing = true; sx = pos.x; sy = pos.y;
      if (tool === 'freehand') stroke = [pos];
    }

    function move(e) {
      if (panningView) {
        e.preventDefault();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        scrollBox.scrollLeft = panStartScrollL - (cx - panStartClientX);
        scrollBox.scrollTop = panStartScrollT - (cy - panStartClientY);
        return;
      }
      if (activeIdx < 0) return;
      if (draggingShape && selectedIdx >= 0) {
        e.preventDefault();
        const pos = coords(e);
        shiftShape(pages[activeIdx].shapes[selectedIdx], pos.x - lx, pos.y - ly);
        lx = pos.x; ly = pos.y;
        redraw(false);
        return;
      }
      if (!drawing) return; e.preventDefault();
      const pos = coords(e); redraw(false);
      if (tool === 'freehand') { stroke.push(pos); draw(ctx, { type: 'freehand', points: stroke, color }); }
      else draw(ctx, { type: tool, x1: sx, y1: sy, x2: pos.x, y2: pos.y, color });
    }

    function up(e) {
      if (panningView) { panningView = false; return; }
      if (draggingShape) { draggingShape = false; redraw(true); return; }
      if (!drawing || activeIdx < 0) return; drawing = false;
      if (tool === 'freehand') { if (stroke.length > 1) pages[activeIdx].shapes.push({ type: 'freehand', points: stroke, color }); stroke = []; redraw(true); return; }
      const r = canvas.getBoundingClientRect(), cx = e.changedTouches ? e.changedTouches[0].clientX : e.clientX, cy = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
      const ex = (cx - r.left) * (canvas.width / r.width), ey = (cy - r.top) * (canvas.height / r.height);
      if (Math.hypot(ex - sx, ey - sy) > 6) pages[activeIdx].shapes.push({ type: tool, x1: sx, y1: sy, x2: ex, y2: ey, color });
      redraw(true);
    }

    function redraw(saveSnap = false) {
      if (!baseImg || activeIdx < 0) return;
      ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(baseImg,0,0);
      const shapes = pages[activeIdx].shapes || [];
      shapes.forEach(s => draw(ctx, s));
      if (saveSnap) { pages[activeIdx].rendered = canvas.toDataURL('image/jpeg', 0.8); renderSidebar(); }
      if (selectedIdx >= 0 && shapes[selectedIdx]) {
        const b = bounds(ctx, shapes[selectedIdx]);
        ctx.save();
        ctx.strokeStyle = '#EA580C';
        ctx.lineWidth = Math.max(2, Math.round(canvas.width * 0.003));
        ctx.setLineDash([8, 6]);
        ctx.strokeRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);
        ctx.restore();
      }
    }

    function draw(c, s) {
      c.save();
      if (s.type === 'image' && s.imgSrc) {
        if (s._imgObj && s._imgObj.complete) {
          c.drawImage(s._imgObj, s.x1, s.y1, s.x2 - s.x1, s.y2 - s.y1);
        } else {
          const im = new Image();
          im.onload = () => { s._imgObj = im; redraw(false); };
          im.src = s.imgSrc;
        }
        c.strokeStyle = '#475569'; c.lineWidth = 2;
        c.strokeRect(s.x1, s.y1, s.x2 - s.x1, s.y2 - s.y1);
        c.restore();
        return;
      }
      const lw = Math.max(4, Math.round(canvas.width * 0.0045)); c.strokeStyle = s.color; c.fillStyle = s.color; c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round';
      if (s.type === 'freehand' && s.points?.length > 1) { c.beginPath(); c.moveTo(s.points[0].x, s.points[0].y); s.points.slice(1).forEach(p => c.lineTo(p.x, p.y)); c.stroke(); }
      else if (s.type === 'circle') { c.beginPath(); c.ellipse((s.x1+s.x2)/2, (s.y1+s.y2)/2, Math.max(Math.abs(s.x2-s.x1)/2,4), Math.max(Math.abs(s.y2-s.y1)/2,4), 0, 0, Math.PI*2); c.stroke(); }
      else if (s.type === 'arrow') { const hl = lw*4, a = Math.atan2(s.y2-s.y1, s.x2-s.x1); c.beginPath(); c.moveTo(s.x1,s.y1); c.lineTo(s.x2,s.y2); c.stroke(); c.beginPath(); c.moveTo(s.x2,s.y2); c.lineTo(s.x2-hl*Math.cos(a-Math.PI/6), s.y2-hl*Math.sin(a-Math.PI/6)); c.lineTo(s.x2-hl*Math.cos(a+Math.PI/6), s.y2-hl*Math.sin(a+Math.PI/6)); c.closePath(); c.fill(); }
      else if (s.type === 'text') {
        const fs = Math.max(16, Math.round(canvas.width * (s.scale || 0.024)));
        c.font = `bold ${fs}px sans-serif`; const w = c.measureText(s.text).width;
        c.fillStyle = 'rgba(15,23,42,0.85)'; c.fillRect(s.x-8, s.y-fs, w+16, fs+10);
        c.fillStyle = s.color && s.color.includes('234,179,8') ? '#FEF08A' : '#FFF';
        c.strokeStyle = s.color; c.lineWidth = 2; c.strokeRect(s.x-8, s.y-fs, w+16, fs+10);
        c.fillText(s.text, s.x, s.y);
      }
      c.restore();
    }

    async function saveAlbumToCloud(opts = {}) {
      if (isSavingAlbum) return;
      const silent = Boolean(opts.silent);
      const autoDefaultTitle = Boolean(opts.autoDefaultTitle);

      const pendingText = (document.getElementById('textLabelInput')?.value || '').trim();
      if (pendingText && activeIdx >= 0) {
        placeTextAt(pendingText);
      }

      const site = document.getElementById('albumSite').value.trim();
      let title = document.getElementById('albumTitle').value.trim();
      const date = document.getElementById('albumDate').value || new Date().toISOString().split('T')[0];

      if (!title && autoDefaultTitle && pages.length) {
        title = `${date.slice(2).replace(/-/g, '')} 截圖標記紀錄`;
        document.getElementById('albumTitle').value = title;
      }

      if (!site || !title) {
        if (!silent) showToast('請填寫單位及標題');
        return;
      }
      if (!pages.length) {
        if (!silent) showToast('請先加入截圖');
        return;
      }

      isSavingAlbum = true;
      const btn = document.getElementById('saveAlbumBtn');
      if (btn) { btn.disabled = true; btn.textContent = '儲存中...'; }

      try {
        const albumId = currentAlbumId || ('alb-' + Date.now());
        await db.collection(ALBUMS_COL).doc(albumId).set({ site, title, date, pageCount: pages.length, linkedReportId: linkedReportId || '', updatedAt: Date.now() });

        const oldPages = await db.collection(ALBUMS_COL).doc(albumId).collection('pages').get();
        const delBatch = db.batch(); oldPages.docs.forEach(d => delBatch.delete(d.ref)); await delBatch.commit();

        for (let i = 0; i < pages.length; i++) {
          const p = pages[i];
          const cleanShapes = (p.shapes || []).map(s => {
            const copy = { ...s };
            delete copy._imgObj;
            return copy;
          });
          await db.collection(ALBUMS_COL).doc(albumId).collection('pages').doc(`p_${String(i).padStart(3,'0')}`).set({
            id: p.id, order: i, raw: p.raw || p.rendered, rendered: p.rendered || p.raw, shapes: cleanShapes, note: p.note || ''
          });
        }
        currentAlbumId = albumId;
        applyCaptureModeUI();
        const newUrl = new URL(window.location.href); newUrl.search = `?albumId=${albumId}`;
        window.history.replaceState({}, '', newUrl);
        await refreshAlbumListDropdown();

        const albumSharePath = `album.html?view=public&albumId=${albumId}`;
        const docLabel = `📷 ${title} (${pages.length}頁)`;
        let targetRepDoc = null;
        if (linkedReportId) {
          const d = await db.collection(REPORTS_COL).doc(linkedReportId).get();
          if (d.exists) targetRepDoc = d;
        }
        if (!targetRepDoc) {
          const q = await db.collection(REPORTS_COL).where('site', '==', site).get();
          const match = q.docs.find(d => d.data().date === date) || q.docs[0];
          if (match) targetRepDoc = match;
        }

        if (targetRepDoc) {
          const rData = targetRepDoc.data();
          const docs = Array.isArray(rData.docs) ? [...rData.docs] : (rData.docName ? [{ name: rData.docName, url: rData.docUrl || '' }] : []);
          const exIdx = docs.findIndex(d => d.url && d.url.includes(albumId));
          if (exIdx >= 0) docs[exIdx].name = docLabel; else docs.push({ name: docLabel, url: albumSharePath });
          await targetRepDoc.ref.update({ docs, updatedAt: Date.now() });
        } else {
          const newRepId = 'rep-' + Date.now();
          linkedReportId = newRepId;
          await db.collection(REPORTS_COL).doc(newRepId).set({
            site, assignee: '', date, timeRange: '', status: '需跟進', title,
            docs: [{ name: docLabel, url: albumSharePath }], docName: docLabel, docUrl: albumSharePath,
            summary: `共 ${pages.length} 頁`, followup: '', followupLogs: [], photoMeta: [], photos: [],
            createdAt: Date.now(), updatedAt: Date.now()
          });
        }
        document.getElementById('statusTag').textContent = '✓ 已儲存';
        if (!silent) showToast('已儲存並覆蓋更新');
      } catch (err) {
        console.error(err);
        if (!silent) showToast('儲存失敗：' + err.message);
      } finally {
        isSavingAlbum = false;
        if (btn) { btn.disabled = false; btn.textContent = '儲存'; }
      }
    }

    function buildPrintView() {
      const site = document.getElementById('albumSite').value || '';
      const title = document.getElementById('albumTitle').value || '';
      const date = document.getElementById('albumDate').value || '';
      document.getElementById('printReportView').innerHTML = `
        <div style="background:#FFF;border-left:4px solid #EA580C;padding:12px 16px;margin-bottom:16px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;">
          <div>
            <div style="font-size:17px;font-weight:700;">${escapeHtml(site)} — ${escapeHtml(title)}</div>
            <div style="font-size:12px;color:#64748B;">築匠設計 ARTISAN STUDIO</div>
          </div>
          <div style="font-size:13px;font-weight:600;color:#334155;">${escapeHtml(date)}（${pages.length} 頁）</div>
        </div>
        ${pages.map((p, i) => `<div class="print-page">
          <img src="${p.rendered || p.raw}" />
          ${p.note ? `<div style="padding:8px 12px;font-size:13px;"><b>#${i+1}</b> ${escapeHtml(p.note)}</div>` : `<div style="padding:6px 12px;font-size:12px;color:#64748B;">#${i+1}</div>`}
        </div>`).join('')}`;
    }

    function exportPdf() { buildPrintView(); window.print(); }

    function getPublicAlbumUrl() {
      if (!currentAlbumId) return '';
      const u = new URL('album.html', window.location.href);
      u.search = `?view=public&albumId=${currentAlbumId}`;
      return u.toString();
    }

    function copyPureAlbumLink() {
      const url = getPublicAlbumUrl();
      if (!url) return showToast('請先儲存');
      navigator.clipboard.writeText(url).then(() => showToast('已複製純網址'));
    }

    function copyAlbumWhatsApp(audience) {
      const url = getPublicAlbumUrl();
      if (!url) return showToast('請先儲存');
      const site = document.getElementById('albumSite').value.trim() || '單位工程';
      const title = document.getElementById('albumTitle').value.trim() || '圖紙及現場標記';
      const date = document.getElementById('albumDate').value || '';

      const msg = audience === 'client'
        ? [
            `你好！以下為 *${site}* 的最新圖紙／現場標記記錄（共 ${pages.length} 頁），請查閱：`,
            date ? `📅 日期：${date}` : '',
            `📌 項目：${title}`,
            `🔗 圖紙連結：${url}`,
            ``,
            `如有任何疑問或需調整之處，歡迎隨時聯絡我們跟進，謝謝！`,
            `— 築匠設計 ARTISAN STUDIO`
          ].filter(Boolean).join('\n')
        : [
            `麻煩跟進以下單位最新標記圖紙（共 ${pages.length} 頁）：`,
            `🏠 單位：*${site}*`,
            date ? `📅 日期：${date}` : '',
            `📌 重點：${title}`,
            `🔗 標記圖連結：${url}`,
            ``,
            `請查閱並回覆確認，唔該晒！`
          ].filter(Boolean).join('\n');

      navigator.clipboard.writeText(msg).then(() => showToast(audience === 'client' ? '已複製客人訊息' : '已複製師傅/廠訊息'));
    }

    function showToast(m) { const el = document.getElementById('toast'); el.textContent = m; el.classList.remove('hidden'); clearTimeout(window._t); window._t = setTimeout(() => el.classList.add('hidden'), 2200); }
    function escapeHtml(s) { return !s ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    init();
  </script>
</body>
