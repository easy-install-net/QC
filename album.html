<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>築匠設計 ARTISAN STUDIO — 現場相簿 & PDF</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang HK", "Microsoft JhengHei", sans-serif;
      background-color: #F1F5F9;
      color: #0F172A;
      font-size: 14px;
      line-height: 1.5;
      margin: 0;
    }
    .t-site { font-size: 16px; line-height: 1.35; font-weight: 700; }
    .t-body { font-size: 14px; line-height: 1.5; }
    .t-meta { font-size: 12px; line-height: 1.4; }
    .t-mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    .btn-primary { background: #0F172A; color: #FFF; border: 1px solid #0F172A; border-radius: 6px; font-size: 12px; font-weight: 500; padding: 5px 10px; cursor: pointer; }
    .btn-primary:hover { background: #334155; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #FFF; color: #334155; border: 1px solid #CBD5E1; border-radius: 6px; font-size: 12px; font-weight: 500; padding: 5px 10px; cursor: pointer; }
    .btn-secondary:hover { background: #F8FAFC; color: #0F172A; border-color: #94A3B8; }
    .btn-link { background: transparent; border: none; padding: 2px 3px; font-size: 12px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

    /* 全頁唯一允許淺橙色的位置：所有可打字/填寫的輸入框 */
    .input-ui {
      border: 1px solid #FDBA74;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 14px;
      background-color: #FFF7ED;
      color: #0F172A;
    }
    .input-ui:focus { outline: none; border-color: #0F172A; background-color: #FFEDD5; }
    .select-ui { border: 1px solid #CBD5E1; border-radius: 6px; padding: 5px 8px; font-size: 12px; background-color: #FFF; color: #0F172A; }

    .photo-card { background: #FFF; border: 1px solid #CBD5E1; border-radius: 8px; overflow: hidden; break-inside: avoid; page-break-inside: avoid; }

    /* 列印 / 匯出 PDF 專用樣式 */
    @media print {
      body { background: #FFF !important; }
      .no-print { display: none !important; }
      #printHeader { display: block !important; }
      main { max-width: 100% !important; padding: 0 !important; }
      #albumContainer { grid-template-columns: repeat(2, 1fr) !important; gap: 12px !important; }
      .photo-card { border: 1px solid #94A3B8 !important; box-shadow: none !important; }
      .photo-card img { max-height: 260px !important; object-fit: contain !important; background: #F8FAFC !important; }
    }
  </style>
</head>
<body>

  <!-- 頂部導航欄 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 no-print">
    <div class="max-w-5xl mx-auto px-3 py-2 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <button onclick="goBackToReports()" class="btn-secondary">← 返回總報告</button>
        <span class="font-bold tracking-tight truncate text-slate-900" style="font-size:16px;">現場相簿 & PDF</span>
        <span id="syncBadge" class="t-meta px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 border border-slate-200 shrink-0">連線中</span>
      </div>
      <div class="flex flex-wrap items-center gap-1.5 shrink-0">
        <button onclick="copyAlbumSummary()" class="btn-secondary">複製重點</button>
        <button onclick="copyAlbumShareLink()" class="btn-secondary">分享相簿Link</button>
        <button onclick="exportToPdf()" class="btn-primary">匯出 / 另存 PDF</button>
      </div>
    </div>
  </header>

  <!-- PDF 列印專用抬頭 -->
  <div id="printHeader" class="hidden border-b-2 border-slate-900 pb-3 mb-4">
    <div class="flex items-baseline justify-between">
      <div>
        <div class="font-bold text-lg text-slate-900">築匠設計 ARTISAN STUDIO — 現場相片紀錄報告</div>
        <div class="t-body font-bold text-slate-800 mt-1" id="printSiteTitle">全部單位</div>
      </div>
      <div class="t-meta text-slate-500 t-mono" id="printDateStr"></div>
    </div>
  </div>

  <!-- 主內容 -->
  <main class="max-w-5xl mx-auto px-3 py-3">
    <!-- 篩選與快速上傳列 -->
    <div class="bg-white border border-slate-200 rounded-lg p-2.5 mb-3 space-y-2.5 no-print">
      <div class="flex flex-col sm:flex-row gap-2 items-stretch sm:items-center justify-between">
        <input type="text" id="searchInput" oninput="renderAlbum()" placeholder="搜尋相片說明、標題或日期..." class="input-ui flex-1" />
        <div class="flex items-center gap-2">
          <select id="siteFilter" onchange="onSiteFilterChange()" class="select-ui flex-1 sm:flex-none">
            <option value="ALL">全部單位</option>
          </select>
          <select id="dateFilter" onchange="renderAlbum()" class="select-ui">
            <option value="ALL">全部日期</option>
          </select>
        </div>
      </div>

      <!-- 快速批量上傳相片至目前單位 -->
      <div id="quickUploadBar" class="pt-2 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2">
        <span class="t-meta text-slate-600" id="currentScopeText">顯示：全部單位相片</span>
        <div class="flex flex-wrap items-center gap-1.5">
          <label class="btn-secondary cursor-pointer">
            <span>現場拍照</span>
            <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleQuickAlbumUpload(event)" />
          </label>
          <label class="btn-primary cursor-pointer">
            <span>+ 批量上傳相片到此單位</span>
            <input type="file" accept="image/*" multiple class="hidden" onchange="handleQuickAlbumUpload(event)" />
          </label>
        </div>
      </div>
    </div>

    <!-- 相片網格 -->
    <div id="albumContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
      <div class="col-span-full bg-white border border-slate-200 rounded-lg p-6 text-center text-slate-500 t-body">載入中...</div>
    </div>
  </main>

  <!-- 大圖預覽彈窗 -->
  <div id="lightboxModal" class="hidden fixed inset-0 z-50 bg-slate-900/85 flex items-center justify-center p-3 no-print" onclick="closeLightbox()">
    <div class="bg-white rounded-lg max-w-4xl w-full overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
      <div class="px-3.5 py-2 bg-slate-50 border-b border-slate-200 flex items-center justify-between gap-2">
        <span class="t-body font-bold text-slate-900 truncate" id="lbTitle">相片預覽</span>
        <button onclick="closeLightbox()" class="t-meta text-slate-500 hover:text-slate-900 px-2 py-1">關閉 ✕</button>
      </div>
      <div class="bg-slate-900 flex items-center justify-center">
        <img id="lbImg" src="" class="max-h-[75vh] max-w-full object-contain" />
      </div>
      <div class="p-3 bg-white flex flex-wrap items-center justify-between gap-2">
        <div class="t-body text-slate-800" id="lbNote"></div>
        <div class="t-meta t-mono text-slate-500" id="lbMeta"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-4 py-2 rounded-md t-meta shadow-lg no-print"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCSRfZdAVh8ADPNtayW5lyDtmE0xDsJXNg",
      authDomain: "gen-lang-client-0208380044.firebaseapp.com",
      databaseURL: "https://gen-lang-client-0208380044-default-rtdb.firebaseio.com",
      projectId: "gen-lang-client-0208380044",
      storageBucket: "gen-lang-client-0208380044.firebasestorage.app",
      messagingSenderId: "17077391191",
      appId: "1:17077391191:web:cb936dd1bfe98b2f3d7812"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const COLLECTION_NAME = 'artisan_qc_reports';

    let reports = [];
    let initialParamApplied = false;

    function setSyncStatus(text, isOk = true) {
      const el = document.getElementById('syncBadge');
      if (!el) return;
      el.textContent = text;
      el.className = isOk
        ? 't-meta px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 shrink-0'
        : 't-meta px-1.5 py-0.5 rounded bg-red-50 text-red-700 border border-red-200 shrink-0';
    }

    function startSync() {
      db.collection(COLLECTION_NAME).orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
        setSyncStatus('已同步', true);
        reports = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        updateFilters();
        if (!initialParamApplied) {
          initialParamApplied = true;
          const params = new URLSearchParams(window.location.search);
          const siteParam = params.get('site');
          const isPublic = params.get('view') === 'public';
          if (isPublic) document.getElementById('quickUploadBar').classList.add('hidden');
          if (siteParam) {
            const sel = document.getElementById('siteFilter');
            if ([...sel.options].some(o => o.value === siteParam)) {
              sel.value = siteParam;
              updateDateOptions();
            }
          }
        }
        renderAlbum();
      }, () => setSyncStatus('離線', false));
    }

    function goBackToReports() {
      const params = new URLSearchParams(window.location.search);
      const url = new URL('index.html', window.location.href);
      if (params.get('view') === 'public') url.searchParams.set('view', 'public');
      const siteVal = document.getElementById('siteFilter').value;
      if (siteVal && siteVal !== 'ALL') url.searchParams.set('site', siteVal);
      window.location.href = url.toString();
    }

    function updateFilters() {
      const siteSel = document.getElementById('siteFilter');
      const curSite = siteSel.value;
      const sites = [...new Set(reports.map(r => r.site).filter(Boolean))];
      siteSel.innerHTML = '<option value="ALL">全部單位</option>' + sites.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
      if (sites.includes(curSite)) siteSel.value = curSite;
      updateDateOptions();
    }

    function onSiteFilterChange() {
      updateDateOptions();
      renderAlbum();
    }

    function updateDateOptions() {
      const siteVal = document.getElementById('siteFilter').value;
      const dateSel = document.getElementById('dateFilter');
      const curDate = dateSel.value;
      const targetReports = siteVal === 'ALL' ? reports : reports.filter(r => r.site === siteVal);
      const dates = [...new Set(targetReports.map(r => r.date).filter(Boolean))].sort((a, b) => b.localeCompare(a));
      dateSel.innerHTML = '<option value="ALL">全部日期</option>' + dates.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
      if (dates.includes(curDate)) dateSel.value = curDate;
    }

    function getFilteredPhotoEntries() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const siteVal = document.getElementById('siteFilter').value;
      const dateVal = document.getElementById('dateFilter').value;
      const entries = [];

      const sortedReports = [...reports].sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0));

      sortedReports.forEach(r => {
        if (siteVal !== 'ALL' && r.site !== siteVal) return;
        if (dateVal !== 'ALL' && r.date !== dateVal) return;
        const photos = Array.isArray(r.photos) ? r.photos : [];
        photos.forEach((p, idx) => {
          const hay = `${r.site} ${r.date} ${r.title} ${p.note || ''}`.toLowerCase();
          if (keyword && !hay.includes(keyword)) return;
          entries.push({
            reportId: r.id,
            site: r.site,
            assignee: r.assignee || '',
            date: r.date,
            title: r.title,
            status: r.status,
            photoIndex: idx,
            photo: p
          });
        });
      });
      return entries;
    }

    function renderAlbum() {
      const container = document.getElementById('albumContainer');
      const siteVal = document.getElementById('siteFilter').value;
      const dateVal = document.getElementById('dateFilter').value;
      const isPublic = new URLSearchParams(window.location.search).get('view') === 'public';

      document.getElementById('currentScopeText').textContent = siteVal === 'ALL'
        ? '目前顯示：全部單位（選定單一單位後可直接批量上傳）'
        : `目前單位：${siteVal}${dateVal !== 'ALL' ? ' (' + dateVal + ')' : ''}`;

      const entries = getFilteredPhotoEntries();

      if (entries.length === 0) {
        container.innerHTML = `<div class="col-span-full bg-white border border-slate-200 rounded-lg p-6 text-center text-slate-500 t-body">暫無相片紀錄</div>`;
        return;
      }

      container.innerHTML = entries.map((item, i) => {
        const imgSrc = item.photo.base64Annotated || item.photo.base64Raw;
        return `
          <div class="photo-card flex flex-col">
            <div onclick="openLightbox(${i})" class="relative bg-slate-100 border-b border-slate-200 cursor-pointer overflow-hidden" style="height:220px;">
              <img src="${imgSrc}" class="w-full h-full object-cover hover:scale-[1.02] transition-transform" />
              <span class="absolute top-2 left-2 bg-slate-900/80 text-white t-meta t-mono px-1.5 py-0.5 rounded">#${i + 1}</span>
            </div>
            <div class="p-2.5 flex-1 flex flex-col justify-between space-y-2">
              <div>
                <div class="flex items-center justify-between gap-1 t-meta text-slate-500">
                  <span class="font-bold text-slate-900 truncate">${escapeHtml(item.site)}</span>
                  <span class="t-mono shrink-0">${escapeHtml(item.date)}</span>
                </div>
                <div class="t-meta font-semibold text-slate-700 truncate mt-0.5">${escapeHtml(item.title)}</div>
                ${!isPublic ? `
                  <input type="text" value="${escapeHtml(item.photo.note || '')}"
                    onchange="updatePhotoNote('${item.reportId}', ${item.photoIndex}, this.value)"
                    placeholder="輸入相片說明..."
                    class="input-ui w-full t-meta py-1 mt-1.5 no-print" />
                  <div class="hidden print:block t-body text-slate-800 mt-1">${escapeHtml(item.photo.note || '')}</div>
                ` : `
                  <div class="t-body text-slate-800 mt-1">${escapeHtml(item.photo.note || '無說明')}</div>
                `}
              </div>
              ${!isPublic ? `
                <div class="pt-1.5 border-t border-slate-100 flex items-center justify-end gap-2 no-print">
                  <button type="button" onclick="deleteSinglePhoto('${item.reportId}', ${item.photoIndex})" class="btn-link text-slate-400 hover:text-red-600">刪除相片</button>
                </div>
              ` : ''}
            </div>
          </div>`;
      }).join('');
    }

    async function updatePhotoNote(reportId, photoIndex, newNote) {
      const rep = reports.find(r => r.id === reportId);
      if (!rep || !rep.photos || !rep.photos[photoIndex]) return;
      const updatedPhotos = JSON.parse(JSON.stringify(rep.photos));
      updatedPhotos[photoIndex].note = newNote.trim();
      try {
        await db.collection(COLLECTION_NAME).doc(reportId).update({ photos: updatedPhotos, updatedAt: Date.now() });
        showToast('說明已更新');
      } catch (e) { showToast('更新失敗'); }
    }

    async function deleteSinglePhoto(reportId, photoIndex) {
      if (!confirm('確定刪除此相片？')) return;
      const rep = reports.find(r => r.id === reportId);
      if (!rep || !rep.photos) return;
      const updatedPhotos = rep.photos.filter((_, idx) => idx !== photoIndex);
      try {
        await db.collection(COLLECTION_NAME).doc(reportId).update({ photos: updatedPhotos, updatedAt: Date.now() });
        showToast('已刪除相片');
      } catch (e) { showToast('刪除失敗'); }
    }

    // 直接在相簿批量上傳相片到選定單位
    async function handleQuickAlbumUpload(event) {
      const files = Array.from(event.target.files || []);
      event.target.value = '';
      if (!files.length) return;

      let siteVal = document.getElementById('siteFilter').value;
      if (siteVal === 'ALL') {
        const inputSite = prompt('請輸入此批相片所屬的屋苑 / 單位名稱：');
        if (!inputSite || !inputSite.trim()) return;
        siteVal = inputSite.trim();
      }

      showToast(`正在處理 ${files.length} 張相片...`);
      const compressedPhotos = [];
      for (const file of files) {
        const b64 = await compressImage(file);
        compressedPhotos.push({
          id: 'ph-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
          base64Raw: '',
          base64Annotated: b64,
          shapes: [],
          note: ''
        });
      }

      const today = new Date().toISOString().split('T')[0];
      const existingToday = reports.find(r => r.site === siteVal && r.date === today);

      try {
        if (existingToday && (existingToday.photos || []).length + compressedPhotos.length <= 8) {
          await db.collection(COLLECTION_NAME).doc(existingToday.id).update({
            photos: [...(existingToday.photos || []), ...compressedPhotos],
            updatedAt: Date.now()
          });
        } else {
          const docId = 'rep-' + Date.now();
          await db.collection(COLLECTION_NAME).doc(docId).set({
            site: siteVal,
            assignee: '',
            date: today,
            timeRange: '',
            status: '需跟進',
            title: `現場相片紀錄 (${compressedPhotos.length}張)`,
            docs: [],
            docName: '',
            docUrl: '',
            summary: '',
            followup: '',
            followupLogs: [],
            photos: compressedPhotos,
            createdAt: Date.now(),
            updatedAt: Date.now()
          });
        }
        document.getElementById('siteFilter').value = siteVal;
        showToast(`已成功上傳 ${compressedPhotos.length} 張相片`);
      } catch (e) {
        showToast('上傳失敗（單次建議不超過 6 張）');
      }
    }

    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 900;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            const off = document.createElement('canvas');
            off.width = w; off.height = h;
            off.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(off.toDataURL('image/jpeg', 0.68));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // 一鍵匯出 / 另存 PDF
    function exportToPdf() {
      const siteVal = document.getElementById('siteFilter').value;
      const dateVal = document.getElementById('dateFilter').value;
      document.getElementById('printSiteTitle').textContent = siteVal === 'ALL'
        ? '全部單位現場相片總覽'
        : `單位：${siteVal}${dateVal !== 'ALL' ? ' ｜ 日期：' + dateVal : ''}`;
      document.getElementById('printDateStr').textContent = `列印日期：${new Date().toISOString().split('T')[0]}`;
      window.print();
    }

    // 複製相簿重點記錄到剪貼簿
    function copyAlbumSummary() {
      const siteVal = document.getElementById('siteFilter').value;
      const entries = getFilteredPhotoEntries();
      const shareUrl = new URL(window.location.href);
      shareUrl.search = siteVal !== 'ALL' ? `?view=public&site=${encodeURIComponent(siteVal)}` : '?view=public';

      const lines = [`【築匠設計 現場相簿重點】${siteVal === 'ALL' ? '全部單位' : siteVal}（共 ${entries.length} 張相片）`];
      entries.forEach((item, idx) => {
        lines.push(`#${idx + 1} [${item.date}] ${item.title}${item.photo.note ? ' — ' + item.photo.note : ''}`);
      });
      lines.push(`相簿及 PDF 檢視：${shareUrl.toString()}`);
      copyText(lines.join('\n'), '已複製相簿重點記錄');
    }

    function copyAlbumShareLink() {
      const siteVal = document.getElementById('siteFilter').value;
      const url = new URL(window.location.href);
      url.search = siteVal !== 'ALL' ? `?view=public&site=${encodeURIComponent(siteVal)}` : '?view=public';
      copyText(url.toString(), siteVal !== 'ALL' ? `已複製「${siteVal}」相簿分享 Link` : '已複製總相簿 Link');
    }

    function copyText(text, msg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(msg));
      } else {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        showToast(msg);
      }
    }

    function openLightbox(idx) {
      const entries = getFilteredPhotoEntries();
      const item = entries[idx];
      if (!item) return;
      document.getElementById('lbTitle').textContent = `${item.site} — ${item.title}`;
      document.getElementById('lbImg').src = item.photo.base64Annotated || item.photo.base64Raw;
      document.getElementById('lbNote').textContent = item.photo.note || '無相片說明';
      document.getElementById('lbMeta').textContent = `${item.date} (#${idx + 1})`;
      document.getElementById('lightboxModal').classList.remove('hidden');
    }

    function closeLightbox() { document.getElementById('lightboxModal').classList.add('hidden'); }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.add('hidden'), 2200);
    }

    function escapeHtml(str) { return !str ? '' : String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    startSync();
  </script>
</body>
</html>
