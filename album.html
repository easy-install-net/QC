<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>築匠設計 ARTISAN STUDIO — 截圖相簿</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="album.css" />
  <style>
    .album-topbar {
      background: #EA580C;
      color: #FFFFFF;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .album-brand-name {
      color: #FFFFFF;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .album-topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .album-pdf-btn {
      background: rgba(255, 255, 255, 0.16);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .album-pdf-btn:hover {
      background: rgba(255, 255, 255, 0.28);
    }
  </style>
</head>
<body>
  <header class="album-topbar no-print">
    <span class="album-brand-name">築匠設計 ARTISAN STUDIO</span>
    <div class="album-topbar-actions" id="albumTopbarActions">
      <button type="button" id="albumExportPdfBtn" onclick="window.print()" class="album-pdf-btn">出PDF</button>
    </div>
  </header>

  <main id="albumMainContainer" class="container">
    <div id="albumContent" class="album-content"></div>
  </main>

  <script src="app.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var isPublicView = params.get('view') === 'public';

      function ensureAlbumBrandHeader() {
        var topbar = document.querySelector('.album-topbar, header');
        if (!topbar) return;
        var brandEl = topbar.querySelector('.album-brand-name');
        if (!brandEl) {
          brandEl = document.createElement('span');
          brandEl.className = 'album-brand-name';
          brandEl.textContent = '築匠設計 ARTISAN STUDIO';
          topbar.insertBefore(brandEl, topbar.firstChild);
        } else {
          brandEl.textContent = '築匠設計 ARTISAN STUDIO';
        }

        if (isPublicView) {
          topbar.querySelectorAll('button, a').forEach(function (el) {
            var txt = (el.textContent || '').trim();
            if (txt !== '出PDF') {
              el.style.display = 'none';
            }
          });
        }
      }

      document.addEventListener('DOMContentLoaded', ensureAlbumBrandHeader);
    })();
  </script>
</body>
</html>
