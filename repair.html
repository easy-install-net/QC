<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>築匠設計 ARTISAN STUDIO | 修繕拍照紀錄</title>
  <link rel="stylesheet" href="report.css" />
  <style>
    body { margin: 0; background: #F1F5F9; color: #0F172A; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    .topbar { background: #EA580C; color: #FFF; padding: 8px 12px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .topbar-left { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
    .topbar-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .btn-light { background: #FFF; color: #0F172A; border: none; border-radius: 4px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
    .btn-primary { background: #0F172A; color: #FFF; border: none; border-radius: 4px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
    .btn-secondary { background: #E2E8F0; color: #0F172A; border: none; border-radius: 4px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
    .btn-orange { background: #EA580C; color: #FFF; border: none; border-radius: 4px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
    .container { max-width: 820px; margin: 0 auto; padding: 10px; }
    .context-bar { background: #FFF; border-left: 3px solid #EA580C; padding: 8px 10px; border-radius: 4px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .input-ui { border: 1px solid #CBD5E1; border-radius: 4px; padding: 6px 8px; font-size: 13px; background: #FFF; color: #0F172A; font-family: inherit; box-sizing: border-box; }
    .input-ui:focus { outline: none; border-color: #EA580C; }
    .field-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 640px) { .field-grid-2 { grid-template-columns: 1fr; } }
    .field-label { font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 3px; display: block; }
    .space-pills { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .space-pill { border: 1px solid #CBD5E1; background: #FFF; color: #0F172A; border-radius: 4px; padding: 4px 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .space-pill.active { background: #EA580C; color: #FFF; border-color: #EA580C; }
    .hidden { display: none !important; }
    .status-note { font-size: 12px; color: #475569; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="index.html" class="btn-light">← 退回</a>
      <span>築匠設計 ARTISAN STUDIO｜修繕拍照紀錄</span>
    </div>
    <div class="topbar-actions">
      <button type="button" class="btn-light" onclick="addNextShot(true)">+ 新增一張</button>
      <button type="button" class="btn-primary" onclick="exportSummaryText()">複製修繕清單</button>
    </div>
  </header>

  <main class="container">
    <!-- 單位與時間資料列 -->
    <section class="context-bar">
      <input id="siteInput" type="text" class="input-ui" placeholder="單位地址（例如：屯門建生康生樓402室）" style="flex:1 1 220px;" />
      <input id="dateInput" type="date" class="input-ui" />
      <input id="timeInput" type="text" class="input-ui" placeholder="時間（例如：17:30 - 18:00）" style="width:140px;" />
      <span id="shotCounter" class="status-note">共 0 張</span>
    </section>

    <!-- 拍照主軸卡片列表 -->
    <section id="shotsContainer" class="repair-flow-wrap"></section>

    <!-- 清單預覽／匯出區 -->
    <section id="outputBox" class="context-bar hidden" style="margin-top:10px;flex-direction:column;align-items:stretch;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <strong>已整理修繕清單</strong>
        <button type="button" class="btn-secondary" onclick="document.getElementById('outputBox').classList.add('hidden')">收起</button>
      </div>
      <textarea id="outputText" rows="8" class="input-ui" style="width:100%;"></textarea>
    </section>
  </main>

  <script>
    const SPACES = ['主人房', '廁所', '細房', '廳', '廚房', '其他'];
    const COMMON_ITEMS = ['門鉸', '櫃門', '抽屜路軌', '牆身油漆', '地腳線', '燈具／開關', '水龍頭／去水', '窗鉸／膠邊', '床／衣櫃'];

    let shots = [];
    let activeRecognition = null;
    let activeVoiceBtn = null;

    function initFromQuery() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('site')) document.getElementById('siteInput').value = params.get('site');
      if (params.get('date')) document.getElementById('dateInput').value = params.get('date');
      else document.getElementById('dateInput').value = new Date().toISOString().slice(0, 10);
      if (params.get('time')) document.getElementById('timeInput').value = params.get('time');
      addNextShot(false);
    }

    function createShot(prevSpace = '') {
      return {
        id: 'shot_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        photoDataUrl: '',
        photoName: '',
        issueAndFix: '',
        space: prevSpace || SPACES[0],
        sameAsAbove: Boolean(prevSpace),
        item: ''
      };
    }

    function addNextShot(focusNew = true) {
      const prevSpace = shots.length ? shots[shots.length - 1].space : '';
      const shot = createShot(prevSpace);
      shots.push(shot);
      renderShots();
      if (focusNew) {
        const el = document.getElementById(shot.id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function removeShot(id) {
      if (shots.length <= 1) {
        shots[0] = createShot('');
      } else {
        shots = shots.filter(s => s.id !== id);
      }
      renderShots();
    }

    function handlePhotoSelected(id, event, targetField) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const shot = shots.find(s => s.id === id);
      if (!shot) return;
      shot.photoName = file.name || '現場相片';
      const reader = new FileReader();
      reader.onload = () => {
        shot.photoDataUrl = reader.result;
        renderShots();
      };
      reader.readAsDataURL(file);
    }

    function applySameAsAbove(index) {
      if (index <= 0) return;
      const shot = shots[index];
      const prevShot = shots[index - 1];
      shot.space = prevShot.space;
      shot.sameAsAbove = true;
      renderShots();
    }

    function selectSpace(index, spaceName) {
      const shot = shots[index];
      shot.space = spaceName;
      shot.sameAsAbove = index > 0 && shots[index - 1].space === spaceName;
      renderShots();
    }

    function toggleVoiceInput(shotId, btnEl) {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      const shot = shots.find(s => s.id === shotId);
      if (!shot) return;

      if (!SpeechRec) {
        alert('此瀏覽器未支援語音轉文字，請直接用鍵盤或手機鍵盤咪高峰輸入。');
        return;
      }

      if (activeRecognition) {
        activeRecognition.stop();
        if (activeVoiceBtn === btnEl) return;
      }

      const rec = new SpeechRec();
      rec.lang = 'yue-Hant-HK';
      rec.interimResults = false;
      rec.maxAlternatives = 1;

      activeRecognition = rec;
      activeVoiceBtn = btnEl;
      btnEl.classList.add('recording');
      btnEl.textContent = '● 錄音中（再按停止）';

      rec.onresult = (e) => {
        const transcript = e.results[0][0].transcript || '';
        if (transcript) {
          shot.issueAndFix = shot.issueAndFix ? `${shot.issueAndFix}，${transcript}` : transcript;
          renderShots();
        }
      };

      rec.onerror = () => {
        cleanupVoice();
      };

      rec.onend = () => {
        cleanupVoice();
      };

      function cleanupVoice() {
        btnEl.classList.remove('recording');
        btnEl.textContent = '🎤 錄音打字';
        if (activeRecognition === rec) activeRecognition = null;
        if (activeVoiceBtn === btnEl) activeVoiceBtn = null;
      }

      rec.start();
    }

    function renderShots() {
      const wrap = document.getElementById('shotsContainer');
      document.getElementById('shotCounter').textContent = `共 ${shots.length} 張`;

      wrap.innerHTML = shots.map((shot, idx) => {
        const hasPrev = idx > 0;
        const prevSpace = hasPrev ? shots[idx - 1].space : '';
        return `
          <article id="${shot.id}" class="repair-shot-card">
            <div class="repair-shot-head">
              <span class="repair-step-label">第 ${idx + 1} 張相片紀錄</span>
              ${shots.length > 1 ? `<button type="button" class="btn-secondary" onclick="removeShot('${shot.id}')">移除</button>` : ''}
            </div>

            <!-- 1. 拍照／揀相 -->
            <div>
              <span class="field-label">1. 拍照／揀相</span>
              <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;">
                <label class="btn-orange" style="cursor:pointer;">
                  📷 拍照
                  <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoSelected('${shot.id}', event)" />
                </label>
                <label class="btn-secondary" style="cursor:pointer;">
                  🖼️ 揀相
                  <input type="file" accept="image/*" class="hidden" onchange="handlePhotoSelected('${shot.id}', event)" />
                </label>
                <span class="status-note">${shot.photoName ? `已選：${shot.photoName}` : '尚未揀相'}</span>
              </div>
              ${shot.photoDataUrl ? `<img src="${shot.photoDataUrl}" alt="預覽相片" class="repair-photo-preview" style="margin-top:6px;" />` : ''}
            </div>

            <!-- 2. 形容問題 + 處理方法 + 錄音打字 -->
            <div>
              <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:3px;">
                <label class="field-label" style="margin:0;">2. 發生什麼問題 &amp; 需要如何處理</label>
                <button type="button" class="voice-btn" onclick="toggleVoiceInput('${shot.id}', this)">🎤 錄音打字</button>
              </div>
              <textarea
                class="input-ui"
                rows="3"
                style="width:100%;"
                placeholder="例如：櫃門關唔實、有少少刮花；需要換門鉸同補油。"
                oninput="shots[${idx}].issueAndFix = this.value"
              >${shot.issueAndFix}</textarea>
            </div>

            <!-- 3. 揀空間（支援同上） + 揀／寫物件 -->
            <div class="field-grid-2">
              <div>
                <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px;margin-bottom:4px;">
                  <span class="field-label" style="margin:0;">3A. 選擇空間</span>
                  ${hasPrev ? `<button type="button" class="same-above-pill" onclick="applySameAsAbove(${idx})">↩ 同上（${prevSpace}）</button>` : ''}
                </div>
                <div class="space-pills">
                  ${SPACES.map(sp => `
                    <button
                      type="button"
                      class="space-pill ${shot.space === sp ? 'active' : ''}"
                      onclick="selectSpace(${idx}, '${sp}')"
                    >${sp}</button>
                  `).join('')}
                </div>
                <div class="status-note" style="margin-top:4px;">
                  目前空間：<strong>${shot.space}</strong>${shot.sameAsAbove && hasPrev ? '（已沿用上一張）' : ''}
                </div>
              </div>

              <div>
                <label class="field-label">3B. 選擇或寫出什麼東西</label>
                <input
                  type="text"
                  class="input-ui"
                  style="width:100%;"
                  list="commonItemsList"
                  value="${shot.item}"
                  placeholder="揀或輸入物件（例如：床、門鉸）"
                  oninput="shots[${idx}].item = this.value"
                />
                <datalist id="commonItemsList">
                  ${COMMON_ITEMS.map(it => `<option value="${it}"></option>`).join('')}
                </datalist>
              </div>
            </div>

            <!-- 4. 下一張 -->
            <div class="repair-next-bar">
              <span class="status-note">完成第 ${idx + 1} 張後，可繼續下一張。</span>
              <button type="button" class="btn-orange" onclick="addNextShot(true)">下一張 →</button>
            </div>
          </article>
        `;
      }).join('');
    }

    function exportSummaryText() {
      const site = document.getElementById('siteInput').value.trim() || '未填單位';
      const date = document.getElementById('dateInput').value || '';
      const time = document.getElementById('timeInput').value.trim() || '';
      const lines = [`【修繕拍照紀錄】${site} ${date} ${time}`.trim(), ''];

      shots.forEach((s, i) => {
        const sameTag = i > 0 && s.space === shots[i - 1].space ? '（同上）' : '';
        lines.push(`${i + 1}. [${s.space}${sameTag}] ${s.item || '未填物件'}`);
        if (s.photoName) lines.push(`   相片：${s.photoName}`);
        lines.push(`   問題及處理：${s.issueAndFix.trim() || '未填寫'}`);
        lines.push('');
      });

      const text = lines.join('\n').trim();
      const box = document.getElementById('outputBox');
      const ta = document.getElementById('outputText');
      ta.value = text;
      box.classList.remove('hidden');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
    }

    initFromQuery();
  </script>
</body>
</html>
