<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>築匠設計 ARTISAN STUDIO — 修繕與售後跟進</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="theme.css" />
  <style>
    .repair-meta-bar {
      background: #FFFFFF;
      border-left: 3px solid #EA580C;
      padding: 8px 10px;
      margin-top: 8px;
      display: grid;
      grid-template-columns: 1.6fr 1.6fr 140px auto;
      gap: 6px;
      align-items: center;
    }
    @media (max-width: 720px) {
      .repair-meta-bar { grid-template-columns: 1fr; }
    }
    .repair-action-strip {
      background: #F8FAFC;
      border: 1px solid #CBD5E1;
      border-radius: 4px;
      padding: 6px 10px;
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .paste-box {
      background: #FFFBEB;
      border: 1px solid #FDBA74;
      border-radius: 4px;
      padding: 8px 10px;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .zone-card {
      background: #FFFFFF;
      border-left: 3px solid #EA580C;
      margin-top: 8px;
      overflow: hidden;
    }
    .zone-head {
      background: #FFFBEB;
      border-bottom: 1px solid #FDE68A;
      padding: 6px 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .zone-body {
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .issue-card {
      border: 1px solid #CBD5E1;
      border-radius: 4px;
      padding: 8px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .issue-card.is-done {
      background: #F8FAFC;
      border-color: #E2E8F0;
    }
    .issue-top-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .issue-left-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 220px;
    }
    .issue-check {
      width: 17px;
      height: 17px;
      accent-color: #EA580C;
      cursor: pointer;
      flex-shrink: 0;
    }
    .issue-title-text {
      font-weight: 700;
      font-size: 13px;
      color: #0F172A;
    }
    .issue-card.is-done .issue-title-text {
      text-decoration: line-through;
      color: #64748B;
    }
    .issue-fields-grid {
      display: grid;
      grid-template-columns: 145px minmax(0, 1fr);
      gap: 6px;
    }
    @media (max-width: 640px) {
      .issue-fields-grid { grid-template-columns: 1fr; }
    }
    .issue-photos-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding-top: 4px;
      border-top: 1px dashed #E2E8F0;
    }
    .issue-thumb {
      width: 64px;
      height: 48px;
      object-fit: cover;
      border: 1.5px solid #CBD5E1;
      border-radius: 3px;
      cursor: pointer;
      display: block;
    }
    .issue-thumb.active-thumb {
      border-color: #EA580C;
      box-shadow: 0 0 0 1px #EA580C;
    }
    .canvas-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      margin-bottom: 6px;
    }
    .summary-out-ta {
      width: 100%;
      min-height: 160px;
      border: 1px solid #CBD5E1;
      border-radius: 4px;
      padding: 8px;
      font-size: 12px;
      line-height: 1.45;
      font-family: inherit;
      background: #F8FAFC;
    }
  </style>
</head>
<body>

  <header class="topbar no-print">
    <div class="container row-between" style="padding-bottom:0;">
      <div class="row">
        <a href="index.html" class="btn-secondary">退回</a>
        <span class="t-site brand-name">築匠設計 ARTISAN STUDIO</span>
        <span class="topbar-sep">|</span>
        <span class="topbar-sub">修繕與售後跟進</span>
        <span id="repairSyncTag" class="sync-ok"></span>
      </div>
      <div class="row">
        <button type="button" onclick="toggleSummaryBox()" class="btn-secondary">匯出清單</button>
        <button type="button" id="saveRepairBtn" onclick="saveRepairSheet()" class="btn-orange">儲存同步</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="repair-meta-bar no-print">
      <input type="text" id="repairSite" list="repairSiteList" class="input-ui" placeholder="屋苑 / 單位名稱 *" />
      <datalist id="repairSiteList"></datalist>
      <input type="text" id="repairTitle" class="input-ui" placeholder="跟進單標題（例如：交貨後售後跟進）" />
      <input type="date" id="repairDate" class="input-ui" />
      <select id="repairHistorySelect" onchange="onSelectRepairHistory(this.value)" class="select-ui">
        <option value="">載入歷史跟進單</option>
      </select>
    </div>

    <div class="repair-action-strip no-print">
      <div class="row">
        <button type="button" onclick="togglePasteBox()" class="btn-orange">+ 貼入清單拆項</button>
        <button type="button" onclick="addIssueItem('主人房')" class="btn-secondary">+ 主人房</button>
        <button type="button" onclick="addIssueItem('廁所')" class="btn-secondary">+ 廁所</button>
        <button type="button" onclick="addIssueItem('細房')" class="btn-secondary">+ 細房</button>
        <button type="button" onclick="addIssueItem('廳')" class="btn-secondary">+ 廳</button>
        <button type="button" onclick="addIssueItem('廚房')" class="btn-secondary">+ 廚房</button>
        <button type="button" onclick="addIssueItem('其他')" class="btn-secondary">+ 其他</button>
      </div>
      <div class="row" id="repairStatsText"></div>
    </div>

    <div id="pasteBox" class="paste-box hidden no-print">
      <div class="row-between">
        <span class="t-meta" style="font-weight:700;color:#9A3412;">貼入整段區域跟進文字（自動按區域與項目拆開，斜體／*星號* 備註會自動放入「跟進」）</span>
        <button type="button" onclick="togglePasteBox()" class="btn-link">收合 ✕</button>
      </div>
      <textarea id="pasteRawText" rows="5" class="input-ui" placeholder="例如：&#10;主人房&#10;1. 油壓床鉸位同床邊唔對 *電動鉸今日先到*&#10;廳&#10;1. 吊櫃花痕"></textarea>
      <div class="row" style="justify-content:flex-end;">
        <button type="button" onclick="parseAndAppendPasteText()" class="btn-orange">拆解並加入清單</button>
      </div>
    </div>

    <div id="summaryBox" class="zone-card hidden no-print" style="padding:8px 10px;">
      <div class="row-between" style="margin-bottom:6px;">
        <span style="font-weight:700;">跟進清單匯出預覽</span>
        <div class="row">
          <button type="button" onclick="copyRepairExport()" class="btn-wa">複製文字</button>
          <button type="button" onclick="window.print()" class="btn-secondary">列印 / PDF</button>
        </div>
      </div>
      <textarea id="summaryOutputTa" readonly class="summary-out-ta"></textarea>
    </div>

    <div id="annotPanel" class="zone-card hidden no-print" style="padding:8px 10px;">
      <div class="row-between" style="margin-bottom:6px;">
        <span id="annotTargetLabel" style="font-weight:700;color:#EA580C;">照片標記工作區</span>
        <button type="button" onclick="closeAnnotPanel()" class="btn-link">關閉標記 ✕</button>
      </div>
      <div class="canvas-toolbar">
        <div class="row">
          <button type="button" onclick="setRepTool('move')" id="rt-move" class="btn-secondary btn-active">✋ 移動</button>
          <button type="button" onclick="setRepTool('freehand')" id="rt-freehand" class="btn-secondary">✎ 手繪</button>
          <button type="button" onclick="setRepTool('circle')" id="rt-circle" class="btn-secondary">◯ 線圈</button>
          <button type="button" onclick="setRepTool('arrow')" id="rt-arrow" class="btn-secondary">↗ 箭咀</button>
          <button type="button" onclick="setRepTool('text')" id="rt-text" class="btn-secondary">T 打字</button>
          <select id="repFontSize" onchange="onRepFontChange()" class="select-ui">
            <option value="0.018">字體：細</option>
            <option value="0.026" selected>字體：中</option>
            <option value="0.036">字體：大</option>
          </select>
        </div>
        <div class="row">
          <button type="button" onclick="setRepColor('rgba(234,88,12,0.95)', this)" class="color-dot active-color" style="background:#EA580C;"></button>
          <button type="button" onclick="setRepColor('rgba(220,38,38,0.92)', this)" class="color-dot" style="background:#DC2626;"></button>
          <button type="button" onclick="setRepColor('rgba(37,99,235,0.92)', this)" class="color-dot" style="background:#2563EB;"></button>
          <button type="button" onclick="setRepColor('rgba(15,23,42,0.92)', this)" class="color-dot" style="background:#0F172A;"></button>
          <button type="button" id="repDelShapeBtn" onclick="deleteRepSelectedShape()" class="btn-danger-outline hidden">刪選取</button>
          <button type="button" onclick="undoRepShape()" class="btn-secondary">復原</button>
          <button type="button" onclick="clearRepShapes()" class="btn-secondary">全清</button>
        </div>
      </div>
      <input type="text" id="repTextInput" oninput="onRepTextLive()" onkeydown="onRepTextKey(event)" class="input-ui hidden" style="margin-bottom:6px;" placeholder="輸入標記文字，按 Enter 放上照片或點照片落字" />
      <div class="canvas-wrapper"><canvas id="repCanvas"></canvas></div>
      <input type="text" id="repPhotoNote" oninput="onRepPhotoNoteChange()" class="input-ui" style="margin-top:6px;" placeholder="此張照片備註..." />
    </div>

    <div id="issuesContainer"></div>
  </main>

  <div id="toast" class="hidden no-print"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCSRfZdAVh8ADPNtayW5lyDtmE0xDsJXNg",
      authDomain: "gen-lang-client-0208380044.firebaseapp.com",
      databaseURL: "https://gen-lang-client-0208380044-default-rtdb.firebaseio.com",
      projectId: "gen-lang-client-0208380044",
      storageBucket: "gen-lang-client-0208380044.firebasestorage.app",
      messagingSenderId: "17077391191",
      appId: "1:17077391191:web:cb936dd1bfe98b2f3d7812"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    try {
      if (firebase.firestore.persistentLocalCache && firebase.firestore.persistentMultipleTabManager) {
        db.settings({
          localCache: firebase.firestore.persistentLocalCache({
            tabManager: firebase.firestore.persistentMultipleTabManager()
          })
        });
      } else {
        db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
      }
    } catch (_) {
      db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    }

    const REPORTS_COL = 'artisan_qc_reports';
    const REPAIRS_COL = 'artisan_qc_repairs';
    const ZONES_ORDER = ['主人房', '廁所', '細房', '廳', '廚房', '其他'];

    let currentRepairId = null;
    let items = [];
    let activeItemIdx = -1;
    let activePhotoIdx = -1;
    let repTool = 'move';
    let repColor = 'rgba(234,88,12,0.95)';
    let repFontScale = 0.026;
    let repSelectedIdx = -1;
    let repDrawing = false, repDragging = false;
    let rsx = 0, rsy = 0, rlx = 0, rly = 0;
    let repStroke = [], repBaseImg = null;

    const rCanvas = document.getElementById('repCanvas');
    const rCtx = rCanvas.getContext('2d');

    function confirmYAction(msg) {
      const ans = prompt(`${msg}\n請輸入 "Y" 確認：`);
      return ans !== null && ans.trim().toUpperCase() === 'Y';
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(window._rt);
      window._rt = setTimeout(() => el.classList.add('hidden'), 2200);
    }

    function escapeHtml(s) {
      return !s ? '' : String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function initRepairPage() {
      const params = new URLSearchParams(window.location.search);
      const site = params.get('site') || '';
      const date = params.get('date') || new Date().toISOString().split('T')[0];
      currentRepairId = params.get('repairId') || null;

      document.getElementById('repairSite').value = site;
      document.getElementById('repairDate').value = date;
      if (site) document.getElementById('repairTitle').value = `${site} — 售後跟進清單`;

      db.collection(REPORTS_COL).limit(80).get().then(snap => {
        const sites = [...new Set(snap.docs.map(d => d.data().site).filter(Boolean))];
        document.getElementById('repairSiteList').innerHTML = sites.map(s => `<option value="${escapeHtml(s)}"></option>`).join('');
      }).catch(() => {});

      await refreshRepairHistoryDropdown(site);

      if (currentRepairId) {
        await loadRepairDoc(currentRepairId);
      } else if (site) {
        const q = await db.collection(REPAIRS_COL).where('site', '==', site).orderBy('updatedAt', 'desc').limit(1).get().catch(() => null);
        if (q && !q.empty) {
          currentRepairId = q.docs[0].id;
          await loadRepairDoc(currentRepairId);
        }
      }
      renderIssues();
    }

    async function refreshRepairHistoryDropdown(filterSite = '') {
      try {
        const snap = await db.collection(REPAIRS_COL).orderBy('updatedAt', 'desc').limit(60).get();
        const sel = document.getElementById('repairHistorySelect');
        const opts = ['<option value="">載入歷史跟進單</option>'];
        snap.docs.forEach(d => {
          const data = d.data();
          const label = `${data.site || '未命名單位'} — ${data.title || data.date || ''} (${(data.items || []).length}項)`;
          const mark = filterSite && data.site === filterSite ? '★ ' : '';
          opts.push(`<option value="${escapeHtml(d.id)}" ${d.id === currentRepairId ? 'selected' : ''}>${escapeHtml(mark + label)}</option>`);
        });
        sel.innerHTML = opts.join('');
      } catch (_) {}
    }

    async function onSelectRepairHistory(id) {
      if (!id) return;
      currentRepairId = id;
      await loadRepairDoc(id);
      renderIssues();
    }

    async function loadRepairDoc(id) {
      const doc = await db.collection(REPAIRS_COL).doc(id).get();
      if (!doc.exists) return;
      const data = doc.data();
      document.getElementById('repairSite').value = data.site || '';
      document.getElementById('repairTitle').value = data.title || '';
      document.getElementById('repairDate').value = data.date || '';
      items = Array.isArray(data.items) ? data.items : [];
      document.getElementById('repairSyncTag').textContent = `✓ 已載入 ${items.length} 項`;
    }

    function togglePasteBox() {
      document.getElementById('pasteBox').classList.toggle('hidden');
    }

    function parseAndAppendPasteText() {
      const raw = (document.getElementById('pasteRawText').value || '').trim();
      if (!raw) return showToast('請先貼上跟進清單文字');

      let curZone = '其他';
      let addedCount = 0;
      const lines = raw.split(/\r?\n/);

      lines.forEach(line => {
        const t = line.trim();
        if (!t) return;
        const matchedZone = ZONES_ORDER.find(z => t === z || t.startsWith(z + ' ') || t.startsWith(z + '：') || t.startsWith(z + ':'));
        if (matchedZone && t.length <= 8) {
          curZone = matchedZone;
          return;
        }
        const cleaned = t.replace(/^\d+[\.、\)]\s*/, '').trim();
        if (!cleaned) return;

        let titlePart = cleaned;
        let followupPart = '';
        const starMatch = cleaned.match(/\*([^*]+)\*/);
        if (starMatch) {
          followupPart = starMatch[1].trim();
          titlePart = cleaned.replace(starMatch[0], '').trim();
        }
        const dateTagMatch = titlePart.match(/\((\d{1,2}\/\d{1,2})\)$/);
        if (dateTagMatch && !followupPart) {
          followupPart = dateTagMatch[1];
        }

        items.push({
          id: 'iss_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          zone: curZone,
          title: titlePart || cleaned,
          status: followupPart.includes('已') ? '跟進中' : '待跟進',
          done: false,
          followup: followupPart,
          photos: []
        });
        addedCount++;
      });

      document.getElementById('pasteRawText').value = '';
      document.getElementById('pasteBox').classList.add('hidden');
      renderIssues();
      showToast(`已加入 ${addedCount} 項跟進清單`);
    }

    function addIssueItem(zone = '其他') {
      const title = prompt(`新增「${zone}」跟進項目：`);
      if (title === null || !title.trim()) return;
      items.push({
        id: 'iss_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        zone,
        title: title.trim(),
        status: '待跟進',
        done: false,
        followup: '',
        photos: []
      });
      renderIssues();
      showToast(`已新增至「${zone}」`);
    }

    function toggleItemDone(idx, checked) {
      if (!items[idx]) return;
      items[idx].done = Boolean(checked);
      items[idx].status = items[idx].done ? '已完成' : (items[idx].status === '已完成' ? '跟進中' : items[idx].status);
      renderIssues();
    }

    function changeItemStatus(idx, val) {
      if (!items[idx]) return;
      items[idx].status = val;
      items[idx].done = val === '已完成';
      renderIssues();
    }

    function deleteIssueItem(idx) {
      if (!items[idx]) return;
      if (!confirmYAction(`確定要刪除「${items[idx].title}」嗎？`)) return;
      items.splice(idx, 1);
      if (activeItemIdx === idx) {
        activeItemIdx = -1;
        activePhotoIdx = -1;
        closeAnnotPanel();
      }
      renderIssues();
      showToast('已刪除項目');
    }

    function handleIssuePhotoFiles(itemIdx, fileList) {
      Array.from(fileList || []).forEach(file => {
        if (!file || !items[itemIdx]) return;
        const rd = new FileReader();
        rd.onload = ev => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height, max = 1100;
            if (w > max || h > max) {
              if (w > h) { h = Math.round(h * max / w); w = max; }
              else { w = Math.round(w * max / h); h = max; }
            }
            const off = document.createElement('canvas');
            off.width = w; off.height = h;
            off.getContext('2d').drawImage(img, 0, 0, w, h);
            const b64 = off.toDataURL('image/jpeg', 0.8);
            items[itemIdx].photos = items[itemIdx].photos || [];
            items[itemIdx].photos.push({
              id: 'rp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
              raw: b64,
              rendered: b64,
              shapes: [],
              note: ''
            });
            const pIdx = items[itemIdx].photos.length - 1;
            renderIssues();
            openPhotoInAnnotator(itemIdx, pIdx);
            showToast(`已加入第 ${pIdx + 1} 張照片`);
          };
          img.src = ev.target.result;
        };
        rd.readAsDataURL(file);
      });
    }

    function openPhotoInAnnotator(itemIdx, photoIdx) {
      const it = items[itemIdx];
      const ph = it?.photos?.[photoIdx];
      if (!it || !ph) return;
      activeItemIdx = itemIdx;
      activePhotoIdx = photoIdx;
      repSelectedIdx = -1;
      if (!ph.raw) ph.raw = ph.rendered;

      document.getElementById('annotPanel').classList.remove('hidden');
      document.getElementById('annotTargetLabel').textContent = `標記：【${it.zone}】${it.title} — 照片 #${photoIdx + 1}`;
      document.getElementById('repPhotoNote').value = ph.note || '';

      repBaseImg = new Image();
      repBaseImg.onload = () => {
        rCanvas.width = repBaseImg.width;
        rCanvas.height = repBaseImg.height;
        redrawRepCanvas(false);
      };
      repBaseImg.src = ph.raw;
    }

    function closeAnnotPanel() {
      document.getElementById('annotPanel').classList.add('hidden');
    }

    function onRepPhotoNoteChange() {
      if (activeItemIdx >= 0 && activePhotoIdx >= 0 && items[activeItemIdx]?.photos?.[activePhotoIdx]) {
        items[activeItemIdx].photos[activePhotoIdx].note = document.getElementById('repPhotoNote').value;
      }
    }

    function setRepTool(t) {
      repTool = t;
      ['move', 'freehand', 'circle', 'arrow', 'text'].forEach(k => {
        document.getElementById('rt-' + k).classList.toggle('btn-active', k === t);
      });
      rCanvas.style.cursor = t === 'move' ? 'grab' : 'crosshair';
      if (t !== 'move') repSelectedIdx = -1;
      const inp = document.getElementById('repTextInput');
      inp.classList.toggle('hidden', t !== 'text');
      if (t === 'text') inp.focus();
      redrawRepCanvas(false);
    }

    function setRepColor(c, btn) {
      repColor = c;
      document.querySelectorAll('#annotPanel .color-dot').forEach(b => b.classList.remove('active-color'));
      if (btn) btn.classList.add('active-color');
    }

    function onRepFontChange() {
      repFontScale = parseFloat(document.getElementById('repFontSize').value) || 0.026;
    }

    function placeRepText(txt, x, y) {
      if (activeItemIdx < 0 || activePhotoIdx < 0 || !txt) return;
      const ph = items[activeItemIdx].photos[activePhotoIdx];
      ph.shapes = ph.shapes || [];
      const px = typeof x === 'number' ? x : Math.round(rCanvas.width * 0.25);
      const py = typeof y === 'number' ? y : Math.round(rCanvas.height * 0.25);
      ph.shapes.push({ type: 'text', x: px, y: py, text: txt, color: repColor, scale: repFontScale });
      document.getElementById('repTextInput').value = '';
      setRepTool('move');
      repSelectedIdx = ph.shapes.length - 1;
      document.getElementById('repDelShapeBtn').classList.remove('hidden');
      redrawRepCanvas(true);
    }

    function onRepTextKey(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const txt = (document.getElementById('repTextInput').value || '').trim();
        if (txt) placeRepText(txt);
      }
    }

    function onRepTextLive() {
      const shapes = items[activeItemIdx]?.photos?.[activePhotoIdx]?.shapes || [];
      if (repTool === 'move' && repSelectedIdx >= 0 && shapes[repSelectedIdx]?.type === 'text') {
        shapes[repSelectedIdx].text = document.getElementById('repTextInput').value;
        redrawRepCanvas(true);
      }
    }

    function deleteRepSelectedShape() {
      const shapes = items[activeItemIdx]?.photos?.[activePhotoIdx]?.shapes || [];
      if (repSelectedIdx >= 0) {
        shapes.splice(repSelectedIdx, 1);
        repSelectedIdx = -1;
        document.getElementById('repDelShapeBtn').classList.add('hidden');
        redrawRepCanvas(true);
      }
    }

    function undoRepShape() {
      const shapes = items[activeItemIdx]?.photos?.[activePhotoIdx]?.shapes || [];
      shapes.pop();
      repSelectedIdx = -1;
      redrawRepCanvas(true);
    }

    function clearRepShapes() {
      if (activeItemIdx < 0 || activePhotoIdx < 0) return;
      items[activeItemIdx].photos[activePhotoIdx].shapes = [];
      repSelectedIdx = -1;
      redrawRepCanvas(true);
    }

    function getRepCoords(e) {
      const r = rCanvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: (cx - r.left) * (rCanvas.width / r.width), y: (cy - r.top) * (rCanvas.height / r.height) };
    }

    rCanvas.addEventListener('mousedown', rDown);
    window.addEventListener('mousemove', rMove);
    window.addEventListener('mouseup', rUp);
    rCanvas.addEventListener('touchstart', rDown, { passive: false });
    window.addEventListener('touchmove', rMove, { passive: false });
    window.addEventListener('touchend', rUp);

    function rDown(e) {
      if (activeItemIdx < 0 || activePhotoIdx < 0) return;
      e.preventDefault();
      const pos = getRepCoords(e);
      const ph = items[activeItemIdx].photos[activePhotoIdx];
      ph.shapes = ph.shapes || [];
      if (repTool === 'text') {
        const txt = (document.getElementById('repTextInput').value || '').trim();
        if (!txt) return showToast('請先輸入文字');
        placeRepText(txt, pos.x, pos.y);
        return;
      }
      if (repTool === 'move') {
        repSelectedIdx = ph.shapes.length - 1;
        document.getElementById('repDelShapeBtn').classList.toggle('hidden', repSelectedIdx < 0);
        if (repSelectedIdx >= 0) { repDragging = true; rlx = pos.x; rly = pos.y; }
        return;
      }
      repDrawing = true; rsx = pos.x; rsy = pos.y;
      if (repTool === 'freehand') repStroke = [pos];
    }

    function rMove(e) {
      if (activeItemIdx < 0 || activePhotoIdx < 0) return;
      const ph = items[activeItemIdx].photos[activePhotoIdx];
      if (repDragging && repSelectedIdx >= 0 && ph.shapes[repSelectedIdx]) {
        e.preventDefault();
        const pos = getRepCoords(e);
        const dx = pos.x - rlx, dy = pos.y - rly;
        const s = ph.shapes[repSelectedIdx];
        if (s.type === 'text') { s.x += dx; s.y += dy; }
        else if (s.type === 'freehand' && s.points) s.points.forEach(p => { p.x += dx; p.y += dy; });
        else { s.x1 += dx; s.y1 += dy; s.x2 += dx; s.y2 += dy; }
        rlx = pos.x; rly = pos.y;
        redrawRepCanvas(false);
        return;
      }
      if (!repDrawing) return;
      e.preventDefault();
      const pos = getRepCoords(e);
      redrawRepCanvas(false);
      if (repTool === 'freehand') {
        repStroke.push(pos);
        drawRepShape(rCtx, { type: 'freehand', points: repStroke, color: repColor });
      } else {
        drawRepShape(rCtx, { type: repTool, x1: rsx, y1: rsy, x2: pos.x, y2: pos.y, color: repColor });
      }
    }

    function rUp(e) {
      if (repDragging) { repDragging = false; redrawRepCanvas(true); return; }
      if (!repDrawing || activeItemIdx < 0 || activePhotoIdx < 0) return;
      repDrawing = false;
      const ph = items[activeItemIdx].photos[activePhotoIdx];
      ph.shapes = ph.shapes || [];
      if (repTool === 'freehand') {
        if (repStroke.length > 1) ph.shapes.push({ type: 'freehand', points: repStroke, color: repColor });
        repStroke = [];
        redrawRepCanvas(true);
        return;
      }
      const r = rCanvas.getBoundingClientRect();
      const cx = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
      const cy = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
      const ex = (cx - r.left) * (rCanvas.width / r.width);
      const ey = (cy - r.top) * (rCanvas.height / r.height);
      if (Math.hypot(ex - rsx, ey - rsy) > 6) {
        ph.shapes.push({ type: repTool, x1: rsx, y1: rsy, x2: ex, y2: ey, color: repColor });
      }
      redrawRepCanvas(true);
    }

    function redrawRepCanvas(saveSnap = false) {
      if (!repBaseImg || activeItemIdx < 0 || activePhotoIdx < 0) return;
      const ph = items[activeItemIdx].photos[activePhotoIdx];
      rCtx.clearRect(0, 0, rCanvas.width, rCanvas.height);
      rCtx.drawImage(repBaseImg, 0, 0);
      (ph.shapes || []).forEach(s => drawRepShape(rCtx, s));
      if (saveSnap) {
        ph.rendered = rCanvas.toDataURL('image/jpeg', 0.8);
        renderIssues();
      }
    }

    function drawRepShape(c, s) {
      c.save();
      const lw = Math.max(4, Math.round(rCanvas.width * 0.005));
      c.strokeStyle = s.color; c.fillStyle = s.color; c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round';
      if (s.type === 'freehand' && s.points?.length > 1) {
        c.beginPath(); c.moveTo(s.points[0].x, s.points[0].y);
        s.points.slice(1).forEach(p => c.lineTo(p.x, p.y));
        c.stroke();
      } else if (s.type === 'circle') {
        c.beginPath();
        c.ellipse((s.x1 + s.x2) / 2, (s.y1 + s.y2) / 2, Math.max(Math.abs(s.x2 - s.x1) / 2, 4), Math.max(Math.abs(s.y2 - s.y1) / 2, 4), 0, 0, Math.PI * 2);
        c.stroke();
      } else if (s.type === 'arrow') {
        const hl = lw * 4, a = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
        c.beginPath(); c.moveTo(s.x1, s.y1); c.lineTo(s.x2, s.y2); c.stroke();
        c.beginPath(); c.moveTo(s.x2, s.y2);
        c.lineTo(s.x2 - hl * Math.cos(a - Math.PI / 6), s.y2 - hl * Math.sin(a - Math.PI / 6));
        c.lineTo(s.x2 - hl * Math.cos(a + Math.PI / 6), s.y2 - hl * Math.sin(a + Math.PI / 6));
        c.closePath(); c.fill();
      } else if (s.type === 'text') {
        const fs = Math.max(16, Math.round(rCanvas.width * (s.scale || 0.026)));
        c.font = `bold ${fs}px sans-serif`;
        const w = c.measureText(s.text || '').width;
        c.fillStyle = 'rgba(15,23,42,0.85)';
        c.fillRect(s.x - 8, s.y - fs, w + 16, fs + 10);
        c.fillStyle = '#FFF';
        c.strokeStyle = s.color; c.lineWidth = 2;
        c.strokeRect(s.x - 8, s.y - fs, w + 16, fs + 10);
        c.fillText(s.text, s.x, s.y);
      }
      c.restore();
    }

    function renderIssues() {
      const doneCount = items.filter(x => x.done || x.status === '已完成').length;
      document.getElementById('repairStatsText').innerHTML = `<span class="t-meta muted">共 <b>${items.length}</b> 項｜已完成 <b>${doneCount}</b> 項</span>`;

      const container = document.getElementById('issuesContainer');
      if (!items.length) {
        container.innerHTML = `<div class="zone-card" style="padding:16px;text-align:center;" class="muted">尚未加入跟進項目，可按上方「+ 貼入清單拆項」或各區「+」按鈕新增</div>`;
        return;
      }

      const zones = [...ZONES_ORDER, ...[...new Set(items.map(x => x.zone).filter(z => !ZONES_ORDER.includes(z)))]];
      const html = zones.map(z => {
        const zItems = items.map((it, idx) => ({ it, idx })).filter(x => x.it.zone === z);
        if (!zItems.length) return '';

        const cardsHtml = zItems.map(({ it, idx }) => {
          const isDone = Boolean(it.done || it.status === '已完成');
          const photos = it.photos || [];
          const thumbsHtml = photos.map((p, pIdx) => {
            const isAct = activeItemIdx === idx && activePhotoIdx === pIdx;
            return `<img src="${p.rendered || p.raw}" onclick="openPhotoInAnnotator(${idx}, ${pIdx})" class="issue-thumb ${isAct ? 'active-thumb' : ''}" title="點擊標記／查看" />`;
          }).join('');

          return `<div class="issue-card ${isDone ? 'is-done' : ''}">
            <div class="issue-top-row">
              <div class="issue-left-group">
                <input type="checkbox" class="issue-check" ${isDone ? 'checked' : ''} onchange="toggleItemDone(${idx}, this.checked)" />
                <span class="issue-title-text">${escapeHtml(it.title)}</span>
              </div>
              <div class="row">
                <select onchange="changeItemStatus(${idx}, this.value)" class="select-ui" style="height:24px;font-size:12px;">
                  <option value="待跟進" ${it.status === '待跟進' ? 'selected' : ''}>待跟進</option>
                  <option value="待覆期" ${it.status === '待覆期' ? 'selected' : ''}>待覆期</option>
                  <option value="跟進中" ${it.status === '跟進中' ? 'selected' : ''}>跟進中</option>
                  <option value="已完成" ${isDone ? 'selected' : ''}>已完成</option>
                </select>
                <button type="button" onclick="deleteIssueItem(${idx})" class="btn-danger-outline" style="height:24px;">刪</button>
              </div>
            </div>

            <div class="issue-fields-grid">
              <input type="text" value="${escapeHtml(it.title)}" oninput="items[${idx}].title=this.value" class="input-ui" placeholder="問題項目" />
              <input type="text" value="${escapeHtml(it.followup || '')}" oninput="items[${idx}].followup=this.value" class="input-ui" placeholder="跟進備註／日期（例如：26/11、等補件、待覆期）" />
            </div>

            <div class="issue-photos-row">
              <label class="btn-orange" style="cursor:pointer;height:24px;">
                <span>📷 連續拍照</span>
                <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleIssuePhotoFiles(${idx}, this.files)" />
              </label>
              <label class="btn-secondary" style="cursor:pointer;height:24px;">
                <span>🖼 揀相</span>
                <input type="file" accept="image/*" multiple class="hidden" onchange="handleIssuePhotoFiles(${idx}, this.files)" />
              </label>
              ${thumbsHtml}
            </div>
          </div>`;
        }).join('');

        return `<div class="zone-card">
          <div class="zone-head">
            <span class="t-site">${escapeHtml(z)}（${zItems.length} 項）</span>
            <button type="button" onclick="addIssueItem('${escapeHtml(z)}')" class="btn-secondary" style="height:24px;">+ ${escapeHtml(z)}</button>
          </div>
          <div class="zone-body">${cardsHtml}</div>
        </div>`;
      }).join('');

      container.innerHTML = html;
    }

    function buildRepairExportText() {
      const site = document.getElementById('repairSite').value.trim() || '單位工程';
      const title = document.getElementById('repairTitle').value.trim() || '修繕與售後跟進清單';
      const date = document.getElementById('repairDate').value || '';
      const lines = [`${site} — ${title}${date ? ` (${date})` : ''}`, ''];

      const zones = [...ZONES_ORDER, ...[...new Set(items.map(x => x.zone).filter(z => !ZONES_ORDER.includes(z)))]];
      zones.forEach(z => {
        const zItems = items.filter(x => x.zone === z);
        if (!zItems.length) return;
        lines.push(`【${z}】`);
        zItems.forEach((it, i) => {
          const mark = (it.done || it.status === '已完成') ? '✓' : '☐';
          const fu = it.followup ? ` [${it.followup}]` : '';
          const pInfo = (it.photos && it.photos.length) ? ` (${it.photos.length}張相)` : '';
          lines.push(`${i + 1}. ${mark} ${it.title}${fu}${pInfo}`);
        });
        lines.push('');
      });
      return lines.join('\n').trim();
    }

    function toggleSummaryBox() {
      const box = document.getElementById('summaryBox');
      box.classList.toggle('hidden');
      if (!box.classList.contains('hidden')) {
        document.getElementById('summaryOutputTa').value = buildRepairExportText();
      }
    }

    function copyRepairExport() {
      const txt = buildRepairExportText();
      navigator.clipboard.writeText(txt).then(() => showToast('已複製跟進清單文字'));
    }

    async function saveRepairSheet() {
      const site = document.getElementById('repairSite').value.trim();
      const date = document.getElementById('repairDate').value || new Date().toISOString().split('T')[0];
      const title = document.getElementById('repairTitle').value.trim() || `${site || '單位'} — 售後跟進清單`;
      if (!site) return showToast('請先填寫屋苑／單位名稱');

      const btn = document.getElementById('saveRepairBtn');
      btn.disabled = true; btn.textContent = '儲存中...';

      try {
        const docId = currentRepairId || ('rep_iss_' + Date.now());
        await db.collection(REPAIRS_COL).doc(docId).set({
          site,
          title,
          date,
          items,
          itemCount: items.length,
          updatedAt: Date.now()
        });
        currentRepairId = docId;
        document.getElementById('repairSyncTag').textContent = '✓ 已儲存';
        await refreshRepairHistoryDropdown(site);
        showToast('已儲存修繕與售後跟進清單');
      } catch (e) {
        showToast('儲存失敗：' + e.message);
      } finally {
        btn.disabled = false; btn.textContent = '儲存同步';
      }
    }

    initRepairPage();
  </script>
</body>
</html>
